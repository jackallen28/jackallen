# ADVANCED 1: Traffic Lights. See e1_lightswitch.toml for the GPIO lesson keys.
# Pin plan (CLAUDE.md §7): red 17, amber 27, green 22, button 23, buzzer 18.

id = "a1_traffic"
title = "Traffic Lights"
file_name = "traffic_lights.py"
requires_gpio = true

intro = """
## Build a set of traffic lights

Every traffic light at an intersection is run by a small computer following a **sequence**: a list of steps done in order, with exact timings.

In this activity you will:
- switch real LEDs on and off with code
- make the **Australian** traffic light sequence: green, amber, red
- use a **function** and a **loop** so the lights run forever
- add a **pedestrian button**, and a beeper so everyone knows when it's safe to cross

**No kit yet?** Choose **Simulator** next to the Run button and use the board on screen. When you've got parts, switch to **Real Pi** and see your lights for real.
"""

outro = """
## Your intersection is open!

You used `LED`, `Button` and `Buzzer`, timed a **sequence** with `sleep()`, grouped it in a **function**, and made it repeat with a **loop**. Real traffic engineers do exactly this, with a few more lights!

**Extension ideas:**
- gpiozero has a `TrafficLights` class: `lights = TrafficLights(17, 27, 22)`, then `lights.green.on()`. Rewrite your program with it.
- Add a second set of lights for the cross street. They must **never** both be green!
- Make the green light last longer at night: `from datetime import datetime` and check `datetime.now().hour`.
"""

[[wiring]]
part = "Red LED"
kind = "led"
pin = 17
colour = "red"
connect = "GPIO17 (pin 11) → 330Ω resistor → LED long leg (+). Short leg (−) → GND rail."

[[wiring]]
part = "Amber LED"
kind = "led"
pin = 27
colour = "amber"
connect = "GPIO27 (pin 13) → 330Ω resistor → long leg. Short leg → GND rail."

[[wiring]]
part = "Green LED"
kind = "led"
pin = 22
colour = "green"
connect = "GPIO22 (pin 15) → 330Ω resistor → long leg. Short leg → GND rail."

[[wiring]]
part = "Pedestrian button"
kind = "button"
pin = 23
connect = "One leg → GPIO23 (pin 16). The leg on the other side of the middle gap → GND rail. No resistor needed: gpiozero turns on the Pi's built-in pull-up."

[[wiring]]
part = "Buzzer (step 5)"
kind = "buzzer"
pin = 18
connect = "An *active* buzzer: + (the longer leg) → GPIO18 (pin 12). − → GND rail."

[[wiring]]
part = "Tip"
connect = "Join the breadboard's blue (−) rail to a GND pin, like pin 9 or 14. Then every part can share it."

# ------------------------------------------------------------------ STEP 1
[[steps]]
title = "Flash one light"
support = "guided"
starter_mode = "replace"
starter = '''
from gpiozero import LED
from time import sleep

red = LED(17)       # the red LED is wired to GPIO17

red.on()
sleep(1)            # wait 1 second
red.off()
sleep(1)
red.on()
sleep(___)          # make this flash last 2 seconds
red.off()
print("Done!")
'''
text = """
`LED(17)` makes an **object** that controls the LED on **GPIO17**. Objects have **methods** you call with a dot: `red.on()` and `red.off()`.

`sleep(1)` pauses your program for 1 second, so there's time to see the light.

**Your task:** fill in the blank so the second flash lasts **2 seconds**. Run it and watch the red LED.

*Simulator:* the LED on the board lights up. *Real Pi:* your breadboard LED does!
"""
hints = [
  "The blank is how many seconds to wait.",
  "Replace `___` with `2`.",
  "The line should read `sleep(2)`.",
]
error_hints = { BadPinFactory = "Not on a Raspberry Pi? Choose **Simulator** next to the Run button." }
success = "You just controlled a light with code. Every traffic light starts here!"
