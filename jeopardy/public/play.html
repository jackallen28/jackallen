<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind Jeopardy — Team</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%B4%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
<style>
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  #join { flex: 1; display: grid; place-items: center; padding: 1.5rem; text-align: center; }
  .card { width: min(30rem, 100%); }
  #join h1 {
    font-family: var(--display); font-size: clamp(1.8rem, 6vw, 3.2rem);
    margin: 0 0 .3rem; color: var(--gold); text-transform: uppercase;
  }
  #join p { opacity: .75; margin: 0 0 1.4rem; }
  #join input { width: 100%; font-size: 1.05rem; text-align: center; margin-bottom: .7rem; }
  #codeInput { letter-spacing: .35em; text-transform: uppercase; font-weight: 800; }
  .bigbtn {
    width: 100%; padding: .9rem; font-size: 1.1rem; font-weight: 800;
    background: var(--gold); color: var(--blue-950);
  }
  #teamPick { display: grid; gap: .5rem; margin-bottom: 1rem; }
  #teamPick button {
    padding: .9rem; font-size: 1.05rem; font-weight: 700;
    background: var(--blue-700); color: var(--cream); border: 3px solid var(--edge);
  }
  #teamPick button.sel { border-color: var(--gold); background: var(--blue-600); }
  #joinErr { color: var(--red); min-height: 1.3rem; margin: .5rem 0 0; }

  #game { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #status {
    padding: .5rem 1rem; text-align: center; font-weight: 700;
    font-size: clamp(.9rem, 2.6vw, 1.25rem);
    background: var(--blue-800); border-bottom: 2px solid var(--edge);
  }
  #myscore {
    text-align: center; padding: .4rem;
    font-family: var(--display); color: var(--gold);
    font-size: clamp(1.4rem, 5vw, 2.4rem); font-weight: 700;
  }
  #myscore span { font-size: .45em; color: var(--cream); opacity: .7; display: block; letter-spacing: .12em; text-transform: uppercase; }

  #clueBox {
    margin: .5rem 1rem; padding: .8rem 1rem;
    background: var(--blue-800); border-left: 6px solid var(--gold);
    font-size: clamp(.9rem, 2.4vw, 1.25rem); line-height: 1.4;
    max-height: 28vh; overflow-y: auto;
  }

  #buzzer {
    flex: 1; min-height: 7rem; margin: .5rem 1rem;
    border: 6px solid var(--edge); background: var(--blue-700);
    display: grid; place-items: center; text-align: center;
    font-family: var(--display); font-weight: 700;
    font-size: clamp(1.3rem, 6.5vw, 3rem); color: var(--cream);
    width: calc(100% - 2rem);
  }
  #buzzer.live {
    background: #c81e2d; border-color: #ff8a94; color: #fff;
    animation: beat 1.1s ease-in-out infinite;
  }
  #buzzer.ours { background: #14713f; border-color: var(--green); }
  #buzzer.locked { opacity: .45; }
  #buzzer.typing { flex: 0 0 auto; min-height: 0; padding: .8rem; font-size: clamp(1rem, 3.2vw, 1.5rem); }
  #buzzer small { display: block; font-family: var(--sans); font-size: .32em; opacity: .85; margin-top: .4rem; letter-spacing: .1em; }
  @keyframes beat { 50% { transform: scale(1.02); box-shadow: 0 0 40px rgba(200,30,45,.55); } }

  #inputArea { padding: .5rem 1rem 1rem; margin-top: auto; }
  .inrow { display: flex; gap: .5rem; }
  .inrow input { flex: 1; font-size: clamp(1rem, 3.4vw, 1.4rem); padding: .75rem .9rem; }
  .inrow button { padding: .75rem 1.2rem; font-weight: 800; background: var(--gold); color: var(--blue-950); }
  #hint { text-align: center; min-height: 1.6rem; margin-top: .5rem; font-weight: 700; font-size: .92rem; }
  #hint.good { color: var(--green); }
  #hint.bad { color: var(--red); }
  #hint.warn { color: var(--gold); }

  #clock { text-align: center; font-family: var(--display); font-weight: 700; color: var(--gold); font-size: clamp(1.5rem, 6vw, 2.6rem); }
  #clock.low { color: var(--red); }
</style>
</head>
<body>

<div id="join">
  <div class="card">
    <h1>Mind Jeopardy</h1>
    <p>Pick your team.</p>
    <div id="teamPick"></div>
    <input id="codeInput" class="hidden" placeholder="GAME CODE" maxlength="8" autocomplete="off">
    <button class="bigbtn" id="joinBtn">JOIN</button>
    <p id="joinErr"></p>
  </div>
</div>

<div id="game" class="hidden">
  <div id="status">Waiting for the host…</div>
  <div id="myscore"><span id="myTeamName">—</span><b id="myScoreVal">0</b></div>
  <div id="clock" class="hidden"></div>
  <div id="clueBox" class="hidden"></div>

  <button id="buzzer" class="locked">BUZZERS LOCKED<small>press SPACE when they open</small></button>

  <div id="inputArea">
    <div class="inrow" id="answerRow">
      <input id="answerInput" placeholder="Wait for your turn…" autocomplete="off" disabled>
      <button id="sendBtn" disabled>SEND</button>
    </div>
    <div class="inrow hidden" id="wagerRow" style="margin-top:.5rem">
      <input id="wagerInput" type="number" min="0" placeholder="Your wager" inputmode="numeric">
      <button id="wagerBtn">LOCK IN</button>
    </div>
    <div id="hint"></div>
  </div>
</div>

<div id="flash"><div class="inner"></div></div>

<script type="module" src="/play.js"></script>
</body>
</html>
