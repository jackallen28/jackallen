# ADVANCED 3: Motion Alarm & Logger, with an HC-SR04 ultrasonic distance sensor.
# See e1_lightswitch.toml for the GPIO lesson keys. kind = "distance" uses pins = [echo, trigger].
# Pin plan: distance sensor TRIG 4 (pin 7), ECHO 26 (pin 37, through a 1kΩ / 2kΩ divider),
# LED 17, buzzer 18, arm button 23.
# Step by step: test the light + buzzer -> measure the distance -> "something's close" events ->
# sensor + alarm together -> the arm button -> logging -> challenge.

id = "a3_alarm"
title = "Motion Alarm & Logger"
file_name = "motion_alarm.py"
requires_gpio = true

intro = """
## Build a security system

An **ultrasonic distance sensor** (the HC-SR04, or one like it) works like a bat. It sends out a squeak too high for people to hear, then times how long the echo takes to come back. A short echo means something is **close**. Car parking sensors and robot vacuums use the same idea.

You'll build an alarm that goes off when someone comes too close, one part at a time:
- test the **light** and **buzzer** on their own
- test the **sensor** on its own: measure distances in centimetres
- react with **events** when something comes close, and when it goes away
- put them together to sound an **alarm**
- use a **state** variable so the alarm can be **armed** and **disarmed**
- keep a **log** of every event in a CSV file, then read it back to make a **report**

**In the Simulator:** drag the slider under the sensor on the board to move something closer (left) or further away (right).

**Safety:** the sensor runs on **5V**, and its ECHO pin sends back **5V**, which is too much for a GPIO pin. That's why ECHO goes through **two resistors** (a voltage divider) that turn it into a safe 3.3V. Ask your teacher to check them before you put the blue HAT back on.
"""

outro = """
## Your alarm is armed and logging!

You used an ultrasonic sensor, events, a **state** variable, a **cooldown** timer, and files for **logging** and **reporting**. Real security systems are built from exactly these ideas.

**Extension ideas:**
- Make the alarm beep faster the closer someone gets (like a car's parking sensor)
- Only sound the alarm at night: check `datetime.now().hour`
- Arm with a **secret code**: a pattern of short and long presses
- Make a bar chart of events per hour with `print("#" * count)`
- Combine it with the **Photo Booth**: take a photo when someone comes close!
"""

[[wiring]]
part = "Distance sensor (HC-SR04)"
kind = "distance"
pins = [26, 4]
connect = "VCC → 5V (pin 2). GND → GND (pin 6). TRIG → GPIO4 (pin 7). ECHO → 1kΩ resistor → GPIO26 (pin 37), plus a 2kΩ resistor from GPIO26 to GND. The two resistors turn the 5V echo into a safe 3.3V."

[[wiring]]
part = "LED"
kind = "led"
pin = 17
colour = "red"
connect = "GPIO17 (pin 11) → 330Ω resistor → LED long leg (+). Short leg (−) → GND rail."

[[wiring]]
part = "Buzzer"
kind = "buzzer"
pin = 18
connect = "An *active* buzzer: + (the longer leg) → GPIO18 (pin 12). − → GND rail."

[[wiring]]
part = "Arm button"
kind = "button"
pin = 23
connect = "One leg → GPIO23 (pin 16). The leg across the middle gap → GND rail. (Needed from step 5.)"

[[wiring]]
part = "Tip"
connect = "Got a 3.3V sensor (HC-SR04P or RCWL-1601)? Power it from 3V3 (pin 1) instead, and you can leave out the two resistors. Point the sensor at an open space: walls and desks close by give echoes too."

