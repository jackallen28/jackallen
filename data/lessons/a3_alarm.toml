# ADVANCED 3: Motion Alarm & Logger. See e1_lightswitch.toml for the GPIO lesson keys.
# Pin plan: PIR OUT 4 (VCC 5V pin 2, GND pin 6), LED 17, button 23, buzzer 18.
# Step by step: test the light + buzzer -> test the sensor -> sensor + alarm together ->
# the arm button -> logging -> challenge.

id = "a3_alarm"
title = "Motion Alarm & Logger"
file_name = "motion_alarm.py"
requires_gpio = true

intro = """
## Build a security system

A **PIR** sensor (passive infrared) notices the heat from a moving person or animal. Shops, schools and homes use them to switch on lights and sound alarms.

You'll build it one part at a time:
- test the **light** and **buzzer** on their own
- test the **sensor** on its own: react to **motion** with events
- put them together to sound an **alarm**
- use a **state** variable so the alarm can be **armed** and **disarmed**
- keep a **log** of every event in a CSV file, then read it back to make a **report**

**About the sensor:** a real PIR needs **30 to 60 seconds to warm up** after the Pi turns on. It may trigger by itself while it settles. In the Simulator, click the sensor on the board to "wave" at it.

**Safety:** the PIR's power pin goes to **5V**, but its OUT pin only sends **3.3V**, which is safe for a GPIO pin. Never connect anything that *outputs* 5V straight to a GPIO pin.
"""

outro = """
## Your alarm is armed and logging!

You used a sensor, events, a **state** variable, a **cooldown** timer, and files for **logging** and **reporting**. Real security systems are built from exactly these ideas.

**Extension ideas:**
- Only sound the alarm at night: check `datetime.now().hour`
- Arm with a **secret code**: a pattern of short and long presses
- Make a bar chart of events per hour with `print("#" * count)`
- Combine it with the **Photo Booth**: take a photo when motion is detected!
"""

[[wiring]]
part = "PIR motion sensor"
kind = "pir"
pin = 4
connect = "VCC → 5V (pin 2). OUT → GPIO4 (pin 7). GND → GND (pin 6). Check the labels on your sensor: some put the pins in a different order."

[[wiring]]
part = "LED"
kind = "led"
pin = 17
colour = "red"
connect = "GPIO17 (pin 11) → 330Ω resistor → LED long leg (+). Short leg (−) → GND rail."

[[wiring]]
part = "Buzzer"
kind = "buzzer"
pin = 18
connect = "An *active* buzzer: + (the longer leg) → GPIO18 (pin 12). − → GND rail."

[[wiring]]
part = "Arm button"
kind = "button"
pin = 23
connect = "One leg → GPIO23 (pin 16). The leg across the middle gap → GND rail. (Needed from step 4.)"

[[wiring]]
part = "Tip"
connect = "The PIR has two small orange dials. Turn the 'time' dial fully anticlockwise for the shortest hold time, and leave 'sensitivity' in the middle."

