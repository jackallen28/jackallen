# Render blueprint for Mind Jeopardy.
#
# This is a standalone project that happens to live in a subdirectory, so it
# deploys as its own Render service, entirely separate from Mind Feud.
#
# Deploy: in Render choose New -> Blueprint and point it at the repo. If you
# split this directory into its own repo (see the README), delete the
# `rootDir` line below.

services:
  - type: web
    name: mind-jeopardy
    runtime: node
    plan: free
    rootDir: jeopardy
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health

    # The whole game lives in this process's memory — the board, the scores,
    # whose pick it is. A second instance would be a second, separate game that
    # half the class lands on. Never scale this above one.
    numInstances: 1

    envVars:
      - key: NODE_VERSION
        value: "22"

      # Guards the host laptop screen and the projector window, both of which
      # show more than a student should see. Read it in the dashboard under
      # Environment -> HOST_TOKEN.
      - key: HOST_TOKEN
        generateValue: true

      # The short code the class types to join. Leave it generated and read it
      # off the projector, or set your own memorable one (e.g. MIND).
      - key: JOIN_CODE
        generateValue: true

      # Optional. Without it the game uses its built-in fuzzy matcher, which
      # handles typos, plurals and every alias in the clue bank.
      - key: ANTHROPIC_API_KEY
        sync: false
