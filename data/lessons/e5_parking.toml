# ELECTRONICS LAB 5: Parking Sensor, like the beeper in a real car's bumper.
# See e1_lightswitch.toml for the GPIO lesson keys. kind = "distance" uses pins = [echo, trigger].
# Pin plan: distance sensor TRIG 4 (pin 7), ECHO 26 (pin 37, through a 1kΩ / 2kΩ divider),
# red LED 17, amber LED 27, green LED 22, buzzer 18, park button 23 (challenge only).
# Step by step: test the sensor -> test the three lights -> sensor + lights = zones ->
# test the buzzer -> sensor + buzzer = faster beeps -> everything together -> challenge: parking game.

id = "e5_parking"
title = "Parking Sensor"
file_name = "parking_sensor.py"
requires_gpio = true

intro = """
## Beep... beep... beep-beep-beep!

Lots of cars have a **parking sensor** in the back bumper. As the car reverses towards a wall, it beeps faster and faster. When the car is really close, the beep turns into one long tone: **stop!**

The sensor is an **ultrasonic distance sensor** (the HC-SR04). It sends out a squeak too high for people to hear, then times how long the echo takes to come back. A short echo means something is close.

You'll build your own, one part at a time:
- test the **sensor** on its own: measure distances in centimetres
- test the **three lights** on their own
- join them: **green**, **amber** and **red** zones
- test the **buzzer** on its own
- join it to the sensor: **beep faster** as you get closer
- put it all together, then play a **parking game**

**In the Simulator:** drag the slider under the sensor on the board. Left is closer, right is further away.

**Safety:**
- Take the **blue HAT off** before you change any wires, and put it back on after.
- **Never turn the Pi off**, or you'll lose your progress.
- The sensor's ECHO pin sends back **5V**, which is too much for a GPIO pin. It must go through the **two resistors** (see **Wiring + Safety**). Ask your teacher to check them before you put the blue HAT back on.
"""

outro = """
## Parked perfectly!

You built a real car gadget. You used a **sensor** that measures distance, **if / elif / else** to sort numbers into zones, a **variable** that remembers the last zone, and **timing** you control yourself with `sleep()`.

**In the real world:** car parking sensors work just like yours. Ultrasonic sensors in the bumper measure the distance many times a second, and a little computer turns it into beeps and coloured bars on the dashboard. Robot vacuums, drones and automatic doors use the same idea.

**Extension ideas:**
- Keep a **closest ever** record, and use the button to reset it
- Show the distance as a bar of `#` symbols that shrinks as you get closer: `print("#" * round(cm / 5))`
- Make **two players** take turns at the parking game, and print the winner
"""

[[wiring]]
part = "Distance sensor (HC-SR04)"
kind = "distance"
pins = [26, 4]
connect = "VCC → 5V (pin 2). GND → GND (pin 6). TRIG → GPIO4 (pin 7). ECHO → 1kΩ resistor → GPIO26 (pin 37), plus a 2kΩ resistor from GPIO26 to GND. The two resistors turn the 5V echo into a safe 3.3V."

[[wiring]]
part = "Red LED"
kind = "led"
pin = 17
colour = "red"
connect = "GPIO17 (pin 11) → 330Ω resistor → LED long leg (+). Short leg (−) → GND rail."

[[wiring]]
part = "Amber LED"
kind = "led"
pin = 27
colour = "amber"
connect = "GPIO27 (pin 13) → 330Ω resistor → LED long leg (+). Short leg (−) → GND rail."

[[wiring]]
part = "Green LED"
kind = "led"
pin = 22
colour = "green"
connect = "GPIO22 (pin 15) → 330Ω resistor → LED long leg (+). Short leg (−) → GND rail."

[[wiring]]
part = "Buzzer"
kind = "buzzer"
pin = 18
connect = "An *active* buzzer: + (the longer leg) → GPIO18 (pin 12). − → GND rail."

[[wiring]]
part = "Park button"
kind = "button"
pin = 23
connect = "One leg → GPIO23 (pin 16). The leg across the middle gap → GND rail. (Only needed for the challenge in step 7.)"

[[wiring]]
part = "Tip"
connect = "Got a 3.3V sensor (HC-SR04P or RCWL-1601)? Power it from 3V3 (pin 1) instead, and you can leave out the two resistors. Point the sensor at an open space, and use a book or your hand as the wall."

