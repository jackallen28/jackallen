# ------------------------------------------------------------------ STEP 4
[[steps]]
title = "Bar graphs on the screen"
support = "scaffolded"
starter_mode = "replace"
starter = '''
from pipath_computer import cpu_temp, cpu_load, ram_used
from time import sleep

def bar(percent):
    return ___ * int(percent / 5)      # one # for every 5 %

for i in range(10):
    load = cpu_load()
    ram = ram_used()
    print(f"CPU {bar(load):20} {load} %")
    print(f"RAM {bar(ram):20} {ram} %")
    print()
    sleep(1)
'''
text = """
Numbers are hard to read quickly. A **bar** is easier: the longer the bar, the bigger the number.

In Python you can multiply text by a number: `"#" * 4` gives `####`.

The function `bar(percent)` should **return** a bar with one `#` for every 5 %. So 50 % is 10 of them. `{bar(load):20}` makes the bar take up 20 spaces, so the numbers line up.

**Your task:** fill in the blank so `bar()` returns a bar of `#` signs. Run it, and make the Pi busy to watch the CPU bar grow.
"""
hints = [
  "You want a piece of text made of `#` signs.",
  "Text goes in quotes: `\"#\"`.",
  "The line is `return \"#\" * int(percent / 5)`",
]
success = "A text bar graph! Next, the LEDs take over from the bars."
demo = '''
