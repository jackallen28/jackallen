label = "I saw the colours change"

# ------------------------------------------------------------------ STEP 2
[[steps]]
title = "A rainbow loop"
support = "scaffolded"
starter_mode = "replace"
starter = '''
from gpiozero import RGBLED
from time import sleep

lamp = RGBLED(red=17, green=27, blue=22)

rainbow = [
    (1, 0, 0),      # red
    (1, 0.3, 0),    # orange
    ___,            # yellow
    (0, 1, 0),      # green
    (0, 0, 1),      # blue
    (0.5, 0, 1),    # violet
]

for colour in rainbow:
    lamp.color = colour
    sleep(0.5)
'''
text = """
A **list** can hold colours too. The `for` loop takes each colour from the list, one at a time, and shows it.

**Your task:** fill in the missing colour (yellow), run it, then make the rainbow repeat **3 times**.
"""
hints = [
  "Yellow is red + green: `(1, 1, 0)`",
  "To repeat, put the `for colour in rainbow:` loop inside another loop: `for i in range(3):`",
  "Example:\n```\nfor i in range(3):\n    for colour in rainbow:\n        lamp.color = colour\n        sleep(0.5)\n```",
]
success = "A loop inside a loop: a nested loop!"

demo = '''
