[[steps]]
title = "Challenge: a study log"
support = "brief"
starter_mode = "keep"
run_mode = "until_stopped"
text = """
**Goal:** after each session, add a line to a file called `study_log.csv` with the **date**, the **time** and the **minutes** you focused, like this:

```
2026-10-18,15:42,0.2
```

Then read the whole file back, add up the minutes for **today** only, and print it, like `Today you've focused for 0.4 minutes`. Keep the bar, the buzzer and the message working. (With 12 second sessions, each one is 0.2 minutes. Real sessions will add up faster!)

Run it, do two sessions, then press **Stop** and open `study_log.csv` in the file manager to look at it.

Tips: `from datetime import datetime`, then `datetime.now().strftime("%Y-%m-%d")` gives today's date and `"%H:%M"` gives the time. `open("study_log.csv", "a")` adds to the end of a file. To read it back, loop over the lines with `for line in f:`, and `line.strip().split(",")` splits a line into a list.
"""
hints = [
  "Write the line first: `with open(\"study_log.csv\", \"a\") as f:` then `f.write(f\"{date},{time},{SESSION_SECONDS / 60}\\n\")`.",
  "To add up today: `total = 0`, then for each line, `parts = line.strip().split(\",\")`. If `parts[0] == today`, add `float(parts[2])` to `total`.",
]
error_hints = { FileNotFoundError = "Write to the log **before** you read it back, so the file is there the first time.", IndexError = "Is there a line in your log without three parts? Check each line has the date, the time and the minutes, with commas between." }
success = "Your Pi remembers every session and adds up your study time. Now change SESSION_SECONDS to 25 * 60 and use it for real!"
demo = '''
from gpiozero import LEDBarGraph, Buzzer, Button
from pipath_computer import show_message
from datetime import datetime
from time import sleep

SESSION_SECONDS = 12      # a real focus session is 25 * 60
LOG_FILE = "study_log.csv"
bar = LEDBarGraph(17, 27, 22, 5, 6, 13)
buzzer = Buzzer(18)
button = Button(23)


def log_session(minutes):
    now = datetime.now()
    date = now.strftime("%Y-%m-%d")
    time = now.strftime("%H:%M")
    with open(LOG_FILE, "a") as f:
        f.write(f"{date},{time},{minutes}\n")


def minutes_today():
    today = datetime.now().strftime("%Y-%m-%d")
    total = 0
    with open(LOG_FILE) as f:
        for line in f:
            parts = line.strip().split(",")
            if len(parts) == 3 and parts[0] == today:
                total = total + float(parts[2])
    return round(total, 1)


while True:
    print("Press the button to start a focus session.")
    button.wait_for_press()
    button.wait_for_release()

    for time_left in range(SESSION_SECONDS, 0, -1):
        bar.value = time_left / SESSION_SECONDS
        minutes = time_left // 60
        seconds = time_left % 60
        print(f"Time left: {minutes}:{seconds:02}")
        sleep(1)

    bar.off()
    print("Time's up!")
    buzzer.beep(on_time=0.2, off_time=0.2, n=3, background=False)
    log_session(SESSION_SECONDS / 60)
    total = minutes_today()
    print(f"Today you've focused for {total} minutes")
    show_message(f"Time for a break! Today: {total} minutes", "Focus Timer")
'''
demo_events = ["1 tap 23"]
demo_seconds = 16

