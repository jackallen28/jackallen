# ------------------------------------------------------------------ STEP 7
[[steps]]
title = "Challenge: the parking game"
support = "brief"
starter_mode = "keep"
run_mode = "until_stopped"
text = """
Turn your parking sensor into a game! Drive up to the wall, stop where you think is perfect, and press the **park button**.

**Goal:** when the button on GPIO23 is pressed, check the distance and print how you went:
- closer than 10 cm: `Crash! Too close.`
- 10 to 20 cm: `Perfect park!`, and add 1 to a **score**
- further than 20 cm: `Too far from the wall.`

Then print the score, like `Score: 2`.

**Tips:**
- Import `Button` too, and make `button = Button(23)` near the top
- `score = 0` near the top. A function that changes it needs `global score` as its first line
- Write `def park():` that measures `cm` itself, then uses `if / elif / else`
- Connect it before the loop: `button.when_pressed = park` (no brackets!)

**Bonus:** keep a **closest ever** record, or give a "Wow, centimetre perfect!" message for exactly 15 cm.
"""
hints = [
  "Near the top: `button = Button(23)` and `score = 0`. Before `while True:`, add `button.when_pressed = park`.",
  "Start of `park()`:\n```\ndef park():\n    global score\n    cm = sensor.distance * 100\n    if cm < 10:\n        print(\"Crash! Too close.\")\n```",
  "Then `elif cm <= 20:` prints `Perfect park!` and does `score += 1`. `else:` prints `Too far from the wall.` Last line of `park()`: `print(\"Score:\", score)`.",
]
error_hints = { UnboundLocalError = "Is `global score` the first line inside `park()`?" }
success = "Parked like a pro! You've built a real car gadget and turned it into a game. Brilliant work!"
demo = '''
from gpiozero import DistanceSensor, LED, Buzzer, Button
from time import sleep

sensor = DistanceSensor(echo=26, trigger=4)
red = LED(17)
amber = LED(27)
green = LED(22)
buzzer = Buzzer(18)
button = Button(23)
last_zone = ""
score = 0

def park():
    global score
    cm = sensor.distance * 100
    if cm < 10:
        print("Crash! Too close.")
    elif cm <= 20:
        print("Perfect park!")
        score += 1
    else:
        print("Too far from the wall.")
    print("Score:", score)

button.when_pressed = park
print("Drive up to the wall, then press the button to park.")

while True:
    cm = sensor.distance * 100

    green.off()
    amber.off()
    red.off()
    if cm > 60:
        zone = "all clear"
        green.on()
    elif cm >= 20:
        zone = "getting close"
        amber.on()
    elif cm >= 10:
        zone = "very close"
        red.on()
    else:
        zone = "STOP!"
        red.on()

    if zone != last_zone:
        print(round(cm), "cm:", zone)
        last_zone = zone

    if cm < 10:
        buzzer.on()
        sleep(0.1)
    else:
        buzzer.on()
        sleep(0.05)
        buzzer.off()
        sleep(cm / 100)
'''
demo_events = ["1 distance 26 40", "2.5 tap 23", "3.5 distance 26 15", "5 tap 23", "6 distance 26 5",
               "7.5 tap 23", "8.5 distance 26 90"]
demo_seconds = 10

