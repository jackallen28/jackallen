# ------------------------------------------------------------------ STEP 5
[[steps]]
title = "Challenge: the photo strip"
support = "brief"
starter_mode = "keep"
run_mode = "until_stopped"
text = """
Photo booths at parties print a **strip** of photos taken quickly one after another.

**Goal:** after the countdown, take **4 photos** in a row, half a second apart, then tell the user how many photos are in the folder.

1. Name them so they stay together, ending in `_1` to `_4`, like `strip_09-41-07_1.jpg`
2. Use a `for` loop with `range(1, 5)` (that's 1, 2, 3, 4)
3. Count the photos with the `glob` module: `len(glob.glob("*.jpg"))`, and print `You have 12 photos`

**Bonus:** flash all three LEDs on each snap, like a camera flash.
"""
hints = [
  "Make the start of the name once: `stamp = datetime.now().strftime(\"strip_%H-%M-%S\")`, then in the loop `cam.take_photo(f\"{stamp}_{i}.jpg\")`.",
  "`import glob` at the top, then after the strip: `print(\"You have\", len(glob.glob(\"*.jpg\")), \"photos\")`.",
]
success = "A whole photo strip from one button press. Brilliant!"
demo = '''
from gpiozero import LED, Button, Buzzer
from pipath_camera import Camera
from time import sleep
from datetime import datetime
import glob

cam = Camera()
button = Button(23)
buzzer = Buzzer(18)
lights = [LED(17), LED(27), LED(22)]

def countdown():
    count = 3
    for light in lights:
        print(count)
        light.on()
        sleep(1)
        light.off()
        count = count - 1
    buzzer.beep(0.1, 0.1, n=2, background=False)

def photo_strip():
    countdown()
    stamp = datetime.now().strftime("strip_%H-%M-%S")
    for i in range(1, 5):
        for light in lights:
            light.on()
        cam.take_photo(f"{stamp}_{i}.jpg")
        for light in lights:
            light.off()
        print("Snap", i)
        sleep(0.5)
    print("You have", len(glob.glob("*.jpg")), "photos")

while True:
    print("Press the button for a photo strip")
    button.wait_for_press()
    photo_strip()
'''
demo_events = ["1 tap 23"]
demo_seconds = 9

