<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Staff login</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="/"><span class="brand-logo" aria-hidden="true"></span><span data-site-name>Program Bookings</span></a>
    </div>
  </header>
  <main id="main" style="max-width:420px">
    <div class="card">
      <h1>Staff login</h1>
      <div id="message" role="alert" hidden></div>
      <form id="login">
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        </div>
        <button class="button" type="submit">Log in</button>
      </form>
    </div>
  </main>
  <script type="module">
    import { api, setupPage, announce, esc } from '/js/common.js';
    setupPage();
    document.getElementById('login').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await api('/admin/api/login', { method: 'POST', body: { password: e.target.password.value } });
        location.reload();
      } catch (err) {
        announce(document.getElementById('message'), esc(err.message), 'error');
        e.target.password.select();
      }
    });
  </script>
</body>
</html>
