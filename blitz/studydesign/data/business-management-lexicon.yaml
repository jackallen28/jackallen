# Concept lexicon for VCE Business Management Units 3 & 4.
#
# See blitz/ingest/lexicon.py for the format and physics-lexicon.yaml for the
# reasoning behind having one at all. Business Management's problem is not
# Physics' problem. Physics questions describe scenarios that share no words
# with the study design. Business Management questions share *too many*: every
# dot point is written in the same managerial English, so "employees",
# "objectives", "strategies" and "the business" appear everywhere and separate
# nothing.
#
# Two collisions do most of the damage, and most of the vetoes below exist for
# them:
#
# 1. Unit 3 teaches a topic; Unit 4 teaches the same topic under change.
#    Corporate culture is u3-aos1-kk09 and again u4-aos2-kk03; stakeholders are
#    u3-aos1-kk03 and again u4-aos2-kk08; CSR is u3-aos3-kk09 and again
#    u4-aos2-kk09; training, motivation, lean and global sourcing are all Unit 3
#    dot points that reappear inside u4-aos2-kk02. Every Unit 4 twin therefore
#    `requires` change vocabulary and outweighs its Unit 3 counterpart, so a
#    question only lands in Unit 4 when it is actually about changing something.
#
# 2. A named theory is worth more than the words it is made of. "Lewin" alone
#    cannot separate Force Field Analysis from the Three-step Change Model, so
#    the model is triggered on unfreeze/refreeze and the analysis on
#    weighting/ranking, and both are weighted above the general vocabulary they
#    sit in.
#
# Terms are lowercased and matched by blitz/ingest/lexicon.py: a phrase as a
# substring, a single word on token boundaries. Australian spellings are what
# VCAA uses; the American ones are here too because textbooks are inconsistent.

