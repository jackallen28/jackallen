# ELECTRONICS LAB 6: Whack-a-Mole. See e1_lightswitch.toml for the GPIO lesson keys.
# Pin plan: moles = LEDs 17, 27, 22; buttons 23, 24, 25 (button n hits mole n); buzzer 18.
# One part at a time: the moles -> test the buttons -> which_button() -> one round ->
# test the buzzer -> ten rounds with a score -> faster and faster -> challenge.

id = "e6_whackamole"
title = "Whack-a-Mole"
file_name = "whack_a_mole.py"
requires_gpio = true

intro = """
## Build an arcade game

Three moles (LEDs) pop up at random. Hit the button under a mole before it hides again. Every hit makes the next mole **faster**. How many can you whack?

You'll build it one part at a time:
- make the moles pop up with a **list** of LEDs and `random`
- test the three buttons on their own
- write a **function** that waits for a button, but not forever
- play one round, then a whole game with a **score**
- test the buzzer, then make it beep on every hit
- speed the game up, and save a **high score** to a file

**Before you wire:** take the **blue HAT** off the GPIO pins before you change any wires, and put it back on when you're done. **Never turn the Pi off** to change wires: you'd lose your progress.
"""

outro = """
## Whack! You built an arcade game

You used lists, random numbers, a function that **returns** a value (or `None`), a game loop with a score, a timer that speeds up, and a file that remembers the high score. Real arcade machines work the same way: a tiny computer reads buttons, lights lamps and keeps score.

**Extension ideas:**
- Add a **2-player mode**: player 2 gets three more buttons, and the moles are shared. Who whacks first?
- Add a **golden mole**: once in a while all three LEDs flash, and a hit is worth 5 points
- Keep a **leaderboard**: save each player's name and score to `scores.csv`, then print the top 3
"""

