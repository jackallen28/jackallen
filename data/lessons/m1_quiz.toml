[[steps]]
title = "Score as a percentage"
support = "scaffolded"
starter_mode = "keep"
text = """
"3 out of 5" is good, but a **percentage** makes scores easy to compare, even between quizzes with different numbers of questions.

```
percent = score / len(questions) * 100
print(f"You got {percent:.0f}%")
```

`/` divides, `* 100` turns it into a percentage, and `:.0f` inside the curly brackets shows it with **no decimal places** (so `60.0` shows as `60`).

**Your task:** at the end of your quiz:
1. Work out the score as a percentage and print it.
2. Use `if`, `elif` and `else` to print a different message for **at least 3** score bands. For example:
- 80% or more: `Quiz Master!`
- 50% or more: `Not bad at all!`
- less than 50%: `Have another go!`
"""
hints = [
  "Work out the percentage **after** the loop, once the score is final.",
  "Start with the highest band: `if percent >= 80:`. Then `elif percent >= 50:`, then `else:`.",
  "Example:\n```\npercent = score / len(questions) * 100\nprint(f\"You got {percent:.0f}%\")\nif percent >= 80:\n    print(\"Quiz Master!\")\nelif percent >= 50:\n    print(\"Not bad at all!\")\nelse:\n    print(\"Have another go!\")\n```",
]
error_hints = { ZeroDivisionError = "You divided by 0. Is the questions list empty? Divide by `len(questions)`." }
success = "Your quiz gives a percentage and a message to match. Nice work!"
demo = '''
