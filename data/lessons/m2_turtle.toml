# ------------------------------------------------------------------ STEP 2
[[steps]]
title = "Let a loop do the work"
support = "scaffolded"
starter_mode = "replace"
run_mode = "until_stopped"
starter = '''
import turtle

t = turtle.Turtle()
t.speed(0)
t.pensize(3)

# A square, drawn with a loop
t.color("teal")
for i in range(___):
    t.forward(100)
    t.left(90)

# Now add a triangle here (in a different colour)

turtle.done()
'''
text = """
Writing `forward` and `left` four times is a lot of typing. A **`for` loop** repeats the indented lines for you:

```
for i in range(4):
    t.forward(100)
    t.left(90)
```

`range(4)` means "do it 4 times". The lines that are **indented** (pushed in with spaces) are the ones that repeat. Your old code is safe in the `backups` folder.

**Your task:**
1. Fill in the blank so the loop draws the square again.
2. Under the comment, add a **second loop** that draws a **triangle** in a new colour.

A triangle has 3 sides. To get all the way round, the turtle still turns 360 degrees in total. So each turn is 360 ÷ 3 = **120** degrees.
"""
hints = [
  "A square has 4 sides, so the loop runs 4 times: `range(4)`.",
  "The triangle loop looks just like the square loop, but runs 3 times and turns 120 degrees each time.",
  "Add this under the comment:\n```\nt.color(\"purple\")\nfor i in range(3):\n    t.forward(100)\n    t.left(120)\n```",
]
error_hints = { IndentationError = "The lines inside a loop must all be pushed in by the same amount (4 spaces). Line them up under each other.", Terminator = "The turtle window was closed before it finished drawing. Press **Run** again and let it finish." }
success = "Two shapes, and far less typing. Loops are one of the most useful ideas in coding."
demo = '''
