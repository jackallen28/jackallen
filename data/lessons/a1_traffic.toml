# ------------------------------------------------------------------ STEP 5
[[steps]]
title = "Challenge: safe to cross"
support = "brief"
starter_mode = "keep"
run_mode = "until_stopped"
text = """
Real crossings help people who can't see the lights. They make a fast **tick-tick** sound while it's safe to cross, then the red figure **flashes** to say "don't start crossing now".

**Goal:**
1. Add a **buzzer** on GPIO18. While people are crossing (red for cars), make it beep quickly.
2. Stop the beeping, then **flash** the red LED 5 times before the lights go back to green.

**Tips:**
- `buzzer = Buzzer(18)` (add `Buzzer` to your import)
- `buzzer.beep(0.1, 0.1)` beeps over and over **in the background** until `buzzer.off()`
- `red.blink(0.2, 0.2, n=5, background=False)` flashes 5 times, then carries on
"""
hints = [
  "Put `buzzer.beep(0.1, 0.1)` just after `print(\"Walk!\")`, and `buzzer.off()` after the `sleep()`.",
  "After `buzzer.off()`, flash the red light: `red.blink(0.2, 0.2, n=5, background=False)`.",
]
success = "Your crossing is safer for everyone. That's thoughtful design!"
demo = '''
from gpiozero import LED, Button, Buzzer
from time import sleep

red = LED(17)
amber = LED(27)
green = LED(22)
button = Button(23)
buzzer = Buzzer(18)

def cycle():
    amber.on()
    sleep(2)
    amber.off()
    red.on()
    print("Walk!")
    buzzer.beep(0.1, 0.1)      # tick-tick-tick while people cross
    sleep(4)
    buzzer.off()
    red.blink(0.2, 0.2, n=5, background=False)   # flashing red: don't start crossing
    red.off()

while True:
    green.on()
    print("Press the button to cross")
    button.wait_for_press()
    green.off()
    cycle()
'''
demo_events = ["1.5 tap 23"]
demo_seconds = 11

