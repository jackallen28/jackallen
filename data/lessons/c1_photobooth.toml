title = "A new name every time"
support = "scaffolded"
starter_mode = "keep"
run_mode = "until_stopped"
text = """
Right now every photo is called `countdown.jpg`, so each new one **replaces** the last. Let's give every photo its own name using the **date and time**, and keep the booth running.

```
from datetime import datetime

name = datetime.now().strftime("photo_%Y-%m-%d_%H-%M-%S.jpg")
```

That makes names like `photo_2026-10-16_09-41-07.jpg`. (`%Y` is the year, `%H` the hour, `%M` minutes, `%S` seconds.)

**Your task:**
1. Add `from datetime import datetime` at the top
2. Write a function `def countdown_photo():` that runs `countdown()`, makes a date-and-time name, takes the photo with that name and prints it
3. Replace the bottom of your program with a loop that runs forever:

```
while True:
    print("Press the button for a photo")
    button.wait_for_press()
    countdown_photo()
```

Take two photos, check they both appear, then press **Stop**.
"""
hints = [
  "Add `from datetime import datetime` at the top.",
  "Inside your new function, make the name just before the photo: `name = datetime.now().strftime(\"photo_%Y-%m-%d_%H-%M-%S.jpg\")`, then `cam.take_photo(name)`.",
  "Example:\n```\ndef countdown_photo():\n    countdown()\n    name = datetime.now().strftime(\"photo_%Y-%m-%d_%H-%M-%S.jpg\")\n    cam.take_photo(name)\n    print(\"Saved\", name)\n```",
]
error_hints = { NameError = "Did you add `from datetime import datetime` at the top?" }
success = "Every photo gets its own name. Nothing gets overwritten!"
demo = '''
from gpiozero import LED, Button, Buzzer
from pipath_camera import Camera
from time import sleep
from datetime import datetime

cam = Camera()
button = Button(23)
buzzer = Buzzer(18)
lights = [LED(17), LED(27), LED(22)]    # red = 3, amber = 2, green = 1

def countdown():
    """3, 2, 1 on the lights, then two beeps."""
    count = 3
    for light in lights:
        print(count)
        light.on()
        sleep(1)
        light.off()
        count = count - 1
    buzzer.beep(0.1, 0.1, n=2, background=False)

def countdown_photo():
    countdown()
    name = datetime.now().strftime("photo_%Y-%m-%d_%H-%M-%S.jpg")
    cam.take_photo(name)
    print("Saved", name)

while True:
    print("Press the button for a photo")
    button.wait_for_press()
    countdown_photo()
'''
demo_events = ["1 tap 23", "6 tap 23"]
demo_seconds = 11

