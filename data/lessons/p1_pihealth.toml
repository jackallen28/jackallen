# PI & COMPUTER 1: Pi Health Lights. The Pi's own numbers (temperature, CPU load, RAM) shown
# live on three LEDs. See e1_lightswitch.toml for the GPIO lesson keys.
# Pin plan: temperature LED 17 (red), CPU LED 27 (amber), RAM LED 22 (green).
# Step by step: read the numbers on the screen -> read the temperature file yourself -> keep
# watching in a loop -> text bar graphs -> test the three LEDs -> live lights -> warnings -> log.

id = "p1_pihealth"
title = "Pi Health Lights"
file_name = "pi_health.py"
requires_gpio = true

intro = """
## How is your Pi feeling?

Your Raspberry Pi is a whole computer, and it keeps an eye on itself. It knows:
- how **hot** its processor (CPU) is, in °C
- how **busy** the processor is (the **CPU load**), as a percentage
- how much of its **memory** (RAM) is in use

In this project you'll read those numbers with Python, print them on the screen, then show them **live** on three LEDs. Open a big program, like the web browser, and watch the lights change!

You'll use a little helper called `pipath_computer`. Later you'll see how it works: the numbers are just text in special files.

**In the Simulator:** the numbers are real (they come from this computer). **Watch the goal** pretends the Pi gets hot and busy, so you can see the lights change.
"""

outro = """
## Your Pi has a health monitor!

You read the Pi's own numbers from files, used loops to keep watching, scaled numbers to **brightness**, and used `if` to warn when something's wrong. Big computer rooms (data centres) have dashboards that do exactly this.

**Extension ideas:**
- Use the buzzer on GPIO18 to beep when the Pi is hotter than 75 °C
- Add the **Binary Clock** or **Bar Graph** LEDs and show the CPU load as a bar of six lights
- Find the highest temperature in your log file and print it
- Add a button that switches all three LEDs to show just one number as a bar graph
"""

[[wiring]]
part = "Temperature LED"
kind = "led"
pin = 17
colour = "red"
connect = "GPIO17 (pin 11) → 330Ω resistor → LED long leg (+). Short leg (−) → GND rail."

[[wiring]]
part = "CPU LED"
kind = "led"
pin = 27
colour = "amber"
connect = "GPIO27 (pin 13) → 330Ω resistor → LED long leg (+). Short leg (−) → GND rail."

[[wiring]]
part = "RAM LED"
kind = "led"
pin = 22
colour = "green"
connect = "GPIO22 (pin 15) → 330Ω resistor → LED long leg (+). Short leg (−) → GND rail."

[[wiring]]
part = "Tip"
connect = "You only need the LEDs from step 5. Steps 1 to 4 work on the screen."

