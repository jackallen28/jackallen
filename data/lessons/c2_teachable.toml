first = examples[0]
print("Comparing everything with the first", first["label"])
for ex in examples:
    print(ex["label"], distance(first["pixels"], ex["pixels"]))
'''
text = """
To recognise something, the computer needs a way to say how **alike** two pictures are. Here's a simple way:

- look at each pair of matching pixels
- find the **gap** between their numbers (always positive: that's what `abs()` does)
- add up all the gaps. A small total means the pictures look alike. A big total means they're different.

`zip(a, b)` pairs up the two lists: the first pixel of each, then the second, and so on.

**Your task:** fill in the blank so it adds the gap between `x` and `y`. Run it. Are the distances to the **same** thing smaller than the distances to the **other** thing?
"""
