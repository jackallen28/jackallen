ignore_case = true
label = "It prints what you rolled"

# ------------------------------------------------------------------ STEP 5
[[steps]]
title = "Challenge: shake to roll"
support = "brief"
starter_mode = "keep"
run_mode = "until_stopped"
text = """
Here's a secret: to gpiozero, **any switch is a button**. A **tilt switch** has a tiny ball inside that connects two wires when it's upright and disconnects when you tip it.

**Goal:** add a tilt switch on **GPIO25** so **shaking** the breadboard rolls the dice.

```
shake = Button(25)
shake.when_pressed = roll
```

No tilt switch? Use a third push button instead, or try a **reed switch** with a magnet. The code is the same!

**Extra challenge:** stop the dice rolling again while it's already rolling. *(Hint: a variable like `rolling = True`.)*
"""
hints = [
  "It really is just `Button(25)` with `when_pressed` pointing at your roll function.",
  "If it rolls too often, the ball is bouncing. Try `Button(25, bounce_time=0.3)`.",
]
success = "You've built a shake-to-roll dice. You now know lights, buttons, events, functions, lists and limits!"

demo = '''
from gpiozero import LEDBarGraph, Button
from signal import pause
from time import sleep
import random

graph = LEDBarGraph(17, 27, 22, 5, 6, 13)
down = Button(24)
shake = Button(25, bounce_time=0.3)

count = 0
rolling = False

def show():
    graph.value = count / 6

def roll():
    global count, rolling
    if rolling:
        return
    rolling = True
    for i in range(10):
        count = random.randint(1, 6)
        show()
        sleep(0.05)
    count = random.randint(1, 6)
    show()
    print(f"You rolled a {count}!")
    rolling = False

down.when_pressed = roll
shake.when_pressed = roll
show()
pause()
'''
demo_events = ["1 tap 25", "3 tap 25"]
demo_seconds = 5

[[steps.checks]]
type = "runs_ok"
label = "Your program runs"

[[steps.checks]]
type = "code_regex"
value = '''Button\(\s*25'''
label = "A third input on GPIO25"

[[steps.checks]]
type = "confirm"
label = "Shaking (or the third button) rolls the dice"
