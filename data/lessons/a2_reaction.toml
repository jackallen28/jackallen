# ------------------------------------------------------------------ STEP 2
[[steps]]
title = "Start the stopwatch"
support = "scaffolded"
starter_mode = "replace"
starter = '''
from gpiozero import LED, Button
from time import sleep, monotonic
import random

light = LED(17)
button = Button(23)

print("Get ready...")
sleep(random.uniform(2, 5))
light.on()
start = monotonic()             # the stopwatch reading right now, in seconds
button.wait_for_press()
end = ___
light.off()

reaction = end - start
print(f"Your reaction time: {round(reaction * 1000)} ms")
'''
text = """
`monotonic()` is like a stopwatch that's always running. It gives a number of seconds. The number itself doesn't matter, but the **difference** between two readings is exact.

- `start = monotonic()` when the light comes on
- `end = monotonic()` when the button is pressed
- `end - start` is your reaction time in seconds. Times 1000 gives **milliseconds** (ms).

**Your task:** fill in the blank so `end` is the stopwatch reading after the press. Run it and test your reactions!
"""
hints = [
  "You need another stopwatch reading, just like the `start` line.",
  "Replace `___` with `monotonic()`.",
]
success = "You built a stopwatch with a computer. Was it under 300 ms?"
