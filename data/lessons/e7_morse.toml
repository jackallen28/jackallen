text = """
Now join the dictionary to the hardware. Wire up the **buzzer** on GPIO18 first (see the Wiring + Safety card). Your old code is safe in `backups/`.

Real Morse code has strict timing, all measured in **units**:
- a dot is **1 unit** long, a dash is **3 units**
- the gap inside a letter is **1 unit** (the `signal()` function does that for you)
- the gap between letters is **3 units**

There is a loop **inside** a loop: the outer loop goes through the letters, and the inner loop goes through the dots and dashes of each letter.

**Your task:** fill in the two blanks using `UNIT`. A dash is 3 units. After a letter, `signal()` has already waited 1 unit, so how many more do you need? Run it and type a short word, like `HI`.
