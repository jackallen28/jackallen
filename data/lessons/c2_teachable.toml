[[steps]]
title = "Challenge: how accurate is it?"
support = "brief"
starter_mode = "keep"
text = """
Scientists never just say "it works". They **test** it and measure how often it's right. That's called **accuracy**.

**Goal:** change the bottom of your program into a **test**:

1. For each thing, ask the user to show it and press the button **5 times** (new photos, not the training ones)
2. Count how many guesses were correct, and how many guesses there were in total
3. At the end, print the accuracy as a percentage, like `Accuracy: 80%`

Then **experiment**. What happens if you test in different light, from further away, or with a different background? Write down what you find.

**Tip:** the percentage is `round(correct / total * 100)`.
"""
hints = [
  "Replace the `while True:` loop with `for thing in things:` and, inside it, `for i in range(5):`.",
  "After each guess: `if guess == thing:` then `correct = correct + 1`. Start with `correct = 0` and `total = 0` before the loops.",
]
success = "You measured your machine's accuracy, just like real AI researchers do."
demo = '''
from gpiozero import Button, LED
from pipath_camera import Camera
import json

cam = Camera()
button = Button(23)
green = LED(22)
red = LED(17)

with open("examples.json") as f:
    examples = json.load(f)
things = []
for ex in examples:
    if ex["label"] not in things:
        things.append(ex["label"])

def distance(a, b):
    total = 0
    for x, y in zip(a, b):
        total = total + abs(x - y)
    return total

def classify(pixels):
    best_label = None
    best_distance = None
    for ex in examples:
        d = distance(pixels, ex["pixels"])
        if best_distance is None or d < best_distance:
            best_distance = d
            best_label = ex["label"]
    return best_label

def snap():
    grid = cam.capture_grid(16, 16)
    pixels = []
    for row in grid:
        pixels = pixels + row
    return pixels

correct = 0
total = 0
for thing in things:
    print(f"Test: show me a {thing} and press the button 5 times")
    for i in range(5):
        button.wait_for_press()
        guess = classify(snap())
        print("  I think it's a", guess)
        green.value = guess == things[0]
        red.value = guess == things[1]
        if guess == thing:
            correct = correct + 1
        total = total + 1
        button.wait_for_release()

print(f"Accuracy: {round(correct / total * 100)}%")
'''
