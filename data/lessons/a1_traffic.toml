Real crossings help people who can't see the lights. They make a fast **tick-tick** sound while it's safe to cross.

`buzzer.beep(0.1, 0.1)` beeps over and over **in the background** (0.1 seconds on, 0.1 off), so your program carries on while it beeps. `buzzer.off()` stops it.

**Your task:**
1. Add `Buzzer` to your import line: `from gpiozero import LED, Button, Buzzer`
2. Make a buzzer on GPIO18: `buzzer = Buzzer(18)`
3. In `cycle()`, start beeping straight after `print("Walk!")`
4. Stop the beeping after the `sleep(4)`, before the red light goes off
"""
