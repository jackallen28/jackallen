# PI & COMPUTER 3: Dice DJ. A button rolls a dice on six LEDs and the computer plays a sound,
# video or picture for the number. See e1_lightswitch.toml for the GPIO lesson keys.
# files = [...] copies sample files into the student's folder when the activity opens (never
# replacing theirs). Pin plan: LEDs 17, 27, 22, 5, 6, 13, roll button 23, surprise button 24.
# Step by step: roll on the screen -> test the button -> test the LEDs -> button + LEDs ->
# a sound for each number -> your own playlist -> challenge: a surprise website button.

id = "p3_dicedj"
title = "Dice DJ"
file_name = "dice_dj.py"
requires_gpio = true
files = ["p3/party"]

intro = """
## Roll the dice, start the party

Hardware can control the **computer**, not just lights. In this project, a button rolls a dice, the LEDs show the number, and the Pi **plays something** for that number: a sound, a song, a video or a picture.

You'll:
- roll a dice with `randint()`
- test the button and the LEDs, one at a time
- join them into an LED dice
- use `open_file()` to play a sound on the computer for each number
- make your own playlist from a folder of files
- add a **surprise** button that opens a website

There's a `party` folder in your work folder with six sounds already: `1.wav` beeps once, `6.wav` beeps six times. Plug in headphones or a speaker to hear them.
"""

outro = """
## You built a Dice DJ!

You used random numbers, lists, list positions (`roll - 1`), `glob` to find files, and a button that makes the **computer** do something. That's the same idea as a games controller, a smart doorbell or a TV remote.

**How open_file() works:** it runs the Pi's `xdg-open` command, which opens a file with its normal app, just like double-clicking it:

```
import subprocess
subprocess.Popen(["xdg-open", "party/1.wav"])
```

**Extension ideas:**
- Record six sounds of your own (your voice, your pet, your band) and put them in the `party` folder
- Hold the button down for a "mega roll": roll two dice and add them up
- Count how many times each number comes up, and print the counts when you press the second button
- Make a Spin-the-Bottle style game picker: the dice picks who goes next
"""

