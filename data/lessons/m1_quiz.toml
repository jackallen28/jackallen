id = "m1_quiz"
title = "Quiz Master"
file_name = "quiz_master.py"

intro = """
## Build a trivia quiz

Time to make a game your friends can play! Your quiz will ask questions about Australia, animals, footy and space, and keep score.

To build it you'll learn some big ideas:
- **lists**, to keep lots of questions in one place
- **for loops** with `zip()`, to go through questions and answers together
- **cleaning up answers** with `.strip()` and `.lower()`, so " CANBERRA " still counts
- **functions** that hand back an answer with `return`
- **percentages** and **random order**, so the quiz is different every time

Help gets lighter as you go. By the last step you'll be working from just a goal.
"""

outro = """
## You're a Quiz Master!

You stored data in **lists**, paired them up with `zip()`, cleaned up messy answers with `.strip()` and `.lower()`, wrote a **function** that returns True or False, and worked out a **percentage**.

You also found out why shuffling two lists on their own breaks a quiz. Keeping data that belongs together in **pairs** is a trick real programmers use all the time.

**Extension ideas:**
- Make a quiz about your favourite topic: a sport, a game, a band or your school
- Give the player 3 lives, and end the quiz early when they run out
- Accept more than one right answer, like "6" or "six" (hint: a list of answers for each question)
"""

