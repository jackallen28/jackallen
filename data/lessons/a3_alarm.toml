```

**Tips:**

```
from datetime import datetime

def log(event):
    with open("alarm_log.csv", "a") as f:
        f.write(f"{datetime.now().isoformat(timespec='seconds')},{event}\\n")
```

- `"a"` means **append**: add to the end of the file instead of starting again
- `\\n` starts a new line
- Call `log("intruder")`, `log("armed")` and `log("disarmed")` in the right places

Find the file in your PiPath folder afterwards and open it in a spreadsheet!
