title = "Challenge: the action log"
support = "brief"
starter_mode = "keep"
run_mode = "until_stopped"
text = """
**Goal:** keep a log of everything your control pad does. Each time a button does a job, add one line to a file called `controlpad_log.csv` with the date and time, a comma, and the action's name, like this:

```
2026-10-18 10:15:02,louder
2026-10-18 10:15:07,screenshot
```

Keep every button (and the hold) working. Press at least two buttons, then open `controlpad_log.csv` in your work folder to check it.

Tips: `datetime.now().strftime("%Y-%m-%d %H:%M:%S")` gives the date and time as text. Open the file with `"a"` (append) so new lines go on the end, instead of wiping the file each time.
"""
hints = [
  "Write one function, `log(action)`, that opens the file with `\"a\"` and writes one line. Then call it from each action, like `log(\"louder\")`.",
  "Inside `log()`: `with open(\"controlpad_log.csv\", \"a\") as f:` then `f.write(now + \",\" + action + \"\\n\")`. Don't forget `from datetime import datetime`.",
]
success = "Your control pad keeps its own records. That's how real systems find out what people use most!"
demo = '''
from gpiozero import Button, LED
from signal import pause
from time import sleep
from datetime import datetime
from pipath_computer import take_screenshot, change_volume, open_website

button1 = Button(23, hold_time=1.5)
button2 = Button(24)
button3 = Button(25)
light = LED(17)

def flash():
    light.on()
    sleep(0.2)
    light.off()

def log(action):
    now = datetime.now().strftime("%Y-%m-%d %H:%M:%S")
    with open("controlpad_log.csv", "a") as f:
        f.write(now + "," + action + "\n")
    print("Logged", action)

def screenshot():
    name = take_screenshot("screenshot.png")
    print("Saved", name)
    log("screenshot")

def louder():
    change_volume(5)
    log("louder")

def quieter():
    change_volume(-5)
    log("quieter")

def favourite():
    open_website("https://projects.raspberrypi.org")
    log("website")
    flash()

# pin number -> what to do
actions = {23: screenshot, 24: louder, 25: quieter}

def pressed(button):
    number = button.pin.number         # which pin was pressed?
    action = actions[number]           # look up its action
    action()                           # run it
    flash()

for button in [button1, button2, button3]:
    button.when_pressed = pressed
button1.when_held = favourite

print("Control pad ready! Every action goes in controlpad_log.csv")
pause()
'''
demo_events = ["1 tap 24", "2 tap 25", "3 tap 23"]
demo_seconds = 4.5

