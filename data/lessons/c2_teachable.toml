  "`abs(x - y)` gives the gap, even if `y` is bigger than `x`.",
  "The line is `total = total + abs(x - y)`",
]
error_hints = { FileNotFoundError = "There's no `examples.json` yet. Go back to step 2 and collect your examples first." }
success = "You just wrote the most important part of a nearest-neighbour classifier."
