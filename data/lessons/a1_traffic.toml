text = """
Before the button joins the lights, test it **on its own**. Engineers test each part by itself first. Then, if something goes wrong later, you know it isn't the button.

`button.wait_for_press()` makes your program **stop and wait** right there until the button is pressed. `wait_for_release()` waits until you let go.

Don't worry about your traffic light code: it's saved in your `backups` folder, and the next step joins the lights and the button together.

**Your task:** fill in the blank so the program waits for a press. Run it and press the button **3 times**.

*Simulator:* click the button on the board. *Real Pi:* press your real button. Nothing happens? Open **Wiring + Safety** and press **Check my wiring**.
"""
