# ELECTRONICS LAB 7: Morse Code Messenger. See e1_lightswitch.toml for the GPIO lesson keys.
# Pin plan: LED 17, active buzzer 18, button 23 (the Morse key).
# Step by step: SOS on the LED -> a Morse dictionary on the screen -> send a word on the LED + buzzer
# -> test the key on its own -> dot or dash -> decode letters -> challenge: a Morse quiz.

id = "e7_morse"
title = "Morse Code Messenger"
file_name = "morse_messenger.py"
requires_gpio = true

intro = """
## Talk in dots and dashes

Before phones and the internet, people sent messages down long wires with **Morse code**. In the 1840s, Samuel Morse and Alfred Vail built the **telegraph**: an operator tapped a key, and a buzzer clicked at the other end, maybe hundreds of kilometres away. In 1872 the Overland Telegraph Line joined Adelaide to Darwin, and from there to the rest of the world.

Every letter is a pattern of short beeps (**dots**) and long beeps (**dashes**). Ships used Morse by radio, and the most famous message of all is **SOS**: `... --- ...`. It means "help!". The *Titanic* sent it in 1912.

You'll build a Morse messenger one part at a time:
- flash SOS on the **LED**
- store the whole alphabet in a **dictionary**
- send any word on the LED and the **buzzer** together
- test your **Morse key** (the button) on its own, then turn presses into dots and dashes
- decode your taps into letters, then play a **Morse quiz**

**Safety:** take the blue GPIO HAT off before you change any wires, and put it back on after. Never turn the Pi off, or you'll lose your progress.
"""

outro = """
## Message received!

You used dictionaries (both ways round), loops inside loops, functions that **return** a value, a stopwatch and timeouts. That's how real decoders work.

**Extension ideas:**
- Build a **two-way messenger**: type a word to send on the LED and buzzer, then tap a reply on the key and decode it
- Add the numbers 0 to 9 to your dictionary (for example `"1": ".----"`), and a longer gap of 7 units between words
- Make the quiz harder each round: start with easy letters like E, T and I, then add longer ones, and speed up the dots
"""

[[wiring]]
part = "LED"
kind = "led"
pin = 17
colour = "yellow"
connect = "GPIO17 (pin 11) → 330Ω resistor → LED long leg (+). Short leg (−) → GND rail."

[[wiring]]
part = "Buzzer"
kind = "buzzer"
pin = 18
connect = "Buzzer + (long leg) → GPIO18 (pin 12). Buzzer − → GND rail. (Needed from step 3.)"

[[wiring]]
part = "Morse key (button)"
kind = "button"
pin = 23
connect = "One leg → GPIO23 (pin 16). The leg across the middle gap → GND rail. (Needed from step 4.)"

[[wiring]]
part = "Tip"
connect = "Put the button at the front edge of the breadboard so it's easy to tap, like a real Morse key."

# ------------------------------------------------------------------ STEP 1
[[steps]]
title = "Flash SOS"
support = "guided"
starter_mode = "replace"
starter = '''
from gpiozero import LED
from time import sleep

light = LED(17)

# S is three dots: short flashes of 0.2 seconds
light.blink(on_time=0.2, off_time=0.2, n=3, background=False)
sleep(0.4)      # a gap between letters

# O is three dashes: a dash is 3 times as long as a dot
light.blink(on_time=___, off_time=0.2, n=3, background=False)
sleep(0.4)

# S again
light.blink(on_time=0.2, off_time=0.2, n=3, background=False)
print("SOS sent!")
'''
text = """
Morse code is all about **timing**. A dot is a short flash. A dash is a long flash: **3 times** as long as a dot.

`light.blink(on_time=0.2, off_time=0.2, n=3, background=False)` flashes the LED 3 times: on for 0.2 seconds, off for 0.2 seconds. `background=False` makes the program wait until the flashing is finished before it goes on.

**Your task:** a dot lasts 0.2 seconds. Fill in the blank so each dash in the O lasts 3 times as long. Run it and watch the LED spell **SOS**: 3 short, 3 long, 3 short.

*Simulator:* watch the LED on the board. *Real Pi:* watch your breadboard LED!
"""
hints = [
  "A dot is 0.2 seconds. What is 3 times 0.2?",
  "3 × 0.2 = 0.6, so the blank is `0.6`.",
  "The line is `light.blink(on_time=0.6, off_time=0.2, n=3, background=False)`",
]
error_hints = { BadPinFactory = "Not on a Raspberry Pi? Choose **Simulator** next to the Run button." }
success = "... --- ... You just sent the world's most famous message!"
demo = '''
