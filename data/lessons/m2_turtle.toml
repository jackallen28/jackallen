text = """
Time to be the artist. Ideas:
- a **flower**: lots of small shapes turned around a centre, with a green stem
- a **snowflake**: six arms, each a line with little shapes on it
- a **spiral galaxy**: walk a little further each time round the loop, turning by 91 degrees

**Your task:** design your own turtle artwork. It must:
- use a **function** you wrote (your `polygon` or a new one, like `def petal(size):`)
- use **loops** to repeat things
- pick colours from a **list** with `%`
- **print** the name of your artwork, e.g. `print("My art: Galaxy")`

Plan it on paper first, then build it a bit at a time, pressing **Run** to check as you go.
"""
