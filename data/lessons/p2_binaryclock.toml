# PI & COMPUTER 2: Binary Clock. The Pi's clock shown live in binary on six LEDs.
# See e1_lightswitch.toml for the GPIO lesson keys.
# Pin plan: LEDs 17, 27, 22, 5, 6, 13 (left = 32, right = 1), mode button 23.
# Step by step: read the clock -> numbers in binary -> a ticking clock on the screen ->
# test the six LEDs -> seconds on the LEDs -> test the button -> button switches seconds/minutes/hours.

id = "p2_binaryclock"
title = "Binary Clock"
file_name = "binary_clock.py"
requires_gpio = true

intro = """
## Tell the time like a computer

Inside every computer, numbers are stored as **binary**: just 1s and 0s, on and off. Six LEDs are enough to show any number from 0 to 63, so they can show the seconds (0 to 59) ticking by.

In this project you'll:
- read the time from the Pi's clock with `datetime`
- turn numbers into binary with `format()`
- make a ticking binary clock on the screen
- show it **live** on six LEDs
- add a button to switch between seconds, minutes and hours

Each LED has a value. Add up the values of the LEDs that are on:

```
32  16   8   4   2   1
 ●   ○   ●   ○   ○   ●     32 + 8 + 1 = 41
```
"""

outro = """
## Your Pi tells the time in binary!

You read the computer's clock, changed numbers into binary, turned text into a tuple of 1s and 0s, and used a button to change **modes**. Binary clocks are a favourite project for programmers: now you can read one!

**Extension ideas:**
- Add the buzzer on GPIO18 and make it beep on the hour (when the minutes are 0)
- Make a countdown timer: count down from 63 in binary
- Hold the button for 2 seconds to show the hours *and* the minutes, one after the other
- Show the CPU load in binary with `cpu_load()` from the **Pi Health Lights** activity
"""

