# PI & COMPUTER 5: Focus Timer. A study timer: a button starts a session, six LEDs shrink as
# the time runs out, the buzzer beeps and a message pops up on the screen for a break, and each
# session is logged to study_log.csv. See e1_lightswitch.toml for the GPIO lesson keys.
# Pin plan: LEDs 17, 27, 22, 5, 6, 13 (LEDBarGraph), buzzer 18, start button 23.
# Step by step: countdown on the screen -> test the six LEDs -> the bar shrinks with the time ->
# test the buzzer -> button starts, buzzer ends -> a message on the screen -> challenge: a log.
# Demo sessions are 12 seconds (SESSION_SECONDS = 12); students change it to 25 * 60.

id = "p5_focustimer"
title = "Focus Timer"
file_name = "focus_timer.py"
requires_gpio = true

intro = """
## Time to focus

Lots of people study in short bursts: **25 minutes** of focus, then a **5 minute** break. A timer helps you stick to it. In this project you'll build one on your Pi.

You'll build it one part at a time:
- a **countdown** on the screen with a `for` loop and `sleep()`
- test **six LEDs** as a bar
- join them: the bar **shrinks** as the time runs out
- test the **buzzer** on its own
- add a **start button**, and a beep at the end
- pop up a **message** on the screen: time for a break!
- keep a **log** of every session and add up today's minutes

**Short sessions for testing:** waiting 25 minutes every time you press Run would be no fun. So the sessions are only **12 seconds** long while you build. At the end you'll change one number to make it a real 25 minute timer.

**Safety:**
- Take the **blue HAT off** before you change any wires, and put it back on after.
- **Never turn the Pi off**, or you'll lose your progress.
"""

outro = """
## Your Focus Timer is ready!

You used a **countdown loop**, a **constant** (`SESSION_SECONDS`) that changes the whole program from one place, **division** to turn time into a bar of lights, a **button** and a **buzzer**, a message on the **computer's screen**, and a **log file** that you read back and add up.

**Make it real:** change `SESSION_SECONDS = 12` to `SESSION_SECONDS = 25 * 60`. That's 1500 seconds, or 25 minutes. Now use it for your homework!

**How show_message() works:** it uses Tkinter, the same toolkit PiPath is made with:

```
from tkinter import Tk, messagebox
root = Tk()
root.withdraw()          # hide the empty main window
messagebox.showinfo("Focus Timer", "Time for a break!")
```

**Extension ideas:**
- After each session, run a 5 minute **break** timer with the bar growing back up
- Hold the button for 2 seconds (`when_held`) to cancel a session early
- Print how many sessions you've done **this week**, not just today
"""

