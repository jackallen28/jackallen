name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go formatting
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: Go vet
        run: go vet ./...

      - name: Go tests (server, content, save files)
        run: go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: JavaScript tests
        run: npm test

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: GUI smoke test
        run: npm run e2e

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/screenshots
          if-no-files-found: ignore

  windows:
    # The real CircuitPath.exe on real Windows: the Go tests, then start the
    # exe and use it. The exe is kept as a download on the run's page.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go tests on Windows
        run: go test ./...

      - name: Build CircuitPath.exe
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags "-H windowsgui -s -w -X circuitpath.Version=$("$env:GITHUB_SHA".Substring(0,7))" -o dist/CircuitPath.exe ./cmd/circuitpath

      - name: Start CircuitPath.exe and use it
        shell: pwsh
        run: ./tests/windows/smoke.ps1 -Exe dist/CircuitPath.exe

      - uses: actions/upload-artifact@v4
        with:
          name: CircuitPath-exe
          path: dist/CircuitPath.exe

  boards:
    # Every board compiles the kit check with the pinned cores and libraries
    # (internal/arduino/requirements.json).
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache the Arduino cores and libraries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cp/arduino
          key: arduino-amd64-${{ hashFiles('internal/arduino/requirements.json') }}

      - name: Install the Arduino tools and compile for every board
        run: go run ./cmd/circuitpath -data "$RUNNER_TEMP/cp" -setup-arduino
