starter = '''
from gpiozero import Button, LED
from signal import pause
from time import sleep
from pipath_computer import take_screenshot, change_volume

button1 = Button(23)
button2 = Button(24)
button3 = Button(25)
light = LED(17)

def flash():
    light.on()
    sleep(0.2)
    light.off()

def screenshot():
    name = take_screenshot("screenshot.png")
    print("Saved", name)

def louder():
    change_volume(5)

def quieter():
    change_volume(-5)

# pin number -> what to do
actions = {23: screenshot, 24: ___, 25: ___}

def pressed(button):
    number = button.pin.number         # which pin was pressed?
    print("Pin", number)
    action = actions[___]              # look up its action
    action()                           # run it
    flash()

for button in [button1, button2, button3]:
    button.when_pressed = pressed

print("Control pad ready!")
pause()
'''
text = """
Your program has three `when_pressed` lines and a `flash()` in every function. What if you had 20 buttons? Real control pads keep their actions in a table instead. In Python that's a **dictionary**. (Your old code is safe in the `backups` folder.)

```
actions = {23: screenshot, 24: louder, 25: quieter}
```

The **key** is a pin number, and the **value** is a function. `actions[24]` gives back the `louder` function, and `actions[24]()` runs it.

Now **one** function, `pressed(button)`, can handle every button. gpiozero gives it the button that was pressed, and `button.pin.number` says which pin it's on. The flash happens once, in `pressed()`.

**Your task:** fill in the blanks so the dictionary has all three actions, and `pressed()` looks up the pin number. Run it and press all three buttons.
"""
