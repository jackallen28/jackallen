demo = '''
import turtle

t = turtle.Turtle()
t.speed(0)
t.pensize(2)
turtle.bgcolor("black")

def polygon(sides, size):
    angle = 360 / sides
    for i in range(sides):
        t.forward(size)
        t.left(angle)

def flower(petals, size):
    for i in range(petals):
        t.color(colours[i % len(colours)])
        polygon(6, size)
        t.left(360 / petals)

colours = ["red", "orange", "yellow", "pink", "purple"]

print("My art: Sunset Flower")

# the stem
t.color("green")
t.pensize(6)
t.right(90)
t.forward(200)
t.backward(200)
t.left(90)

# the flower head
t.pensize(2)
flower(24, 60)

turtle.done()
'''
