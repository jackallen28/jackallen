part = "Player 1 button"
kind = "button"
pin = 23
connect = "One leg → GPIO23 (pin 16). The leg across the middle gap → GND rail."

[[wiring]]
part = "Player 2 button"
kind = "button"
pin = 24
connect = "One leg → GPIO24 (pin 18). The leg across the middle gap → GND rail. (Needed from step 4.)"

