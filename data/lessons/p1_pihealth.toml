# ------------------------------------------------------------------ STEP 2
[[steps]]
title = "Under the bonnet"
support = "guided"
starter_mode = "replace"
starter = '''
# Read the Pi's temperature straight from its special file
try:
    with open("/sys/class/thermal/thermal_zone0/temp") as f:
        raw = f.read().strip()
except FileNotFoundError:
    raw = "45000"          # not on a Pi? Pretend it's 45 °C

print("The file says:", raw)
temp = int(raw) / ___
print(f"That's {temp} °C")
'''
text = """
How does `cpu_temp()` know the temperature? Linux keeps it in a **file**. It's just text, so Python can `open()` it and `read()` it like any file.

The file gives the temperature in **thousandths** of a degree. So `48312` means 48.312 °C.

The `try` / `except` part means: *try* to open the file, and if it isn't there (on a computer that isn't a Pi), use a pretend number instead of crashing.

**Your task:** fill in the blank so the program turns the number from the file into degrees. Run it and compare it with `cpu_temp()`.
"""
hints = [
  "The file counts in thousandths of a degree. What do you divide by?",
  "Divide by `1000`.",
  "The line is `temp = int(raw) / 1000`",
]
success = "That's all a helper function is: a few lines of code with a name, so you don't have to write them every time."
demo = '''
