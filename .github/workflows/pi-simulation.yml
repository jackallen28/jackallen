# The Pi simulation: installs CircuitPath on the real Raspberry Pi OS Lite
# (64-bit) userland, booting systemd in a container on an arm64 runner, and
# checks install, every board's compile, OS updates, the firewall, a
# self-update and a restart. See tests/pi/simulate.sh.
name: Pi simulation

on:
  push:
    branches: [BNTS_CircuitPath, master, main]
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 0" # weekly (Monday morning in Melbourne): catches a new Raspberry Pi OS

permissions:
  contents: read

# A newer push replaces a simulation that's still running.
concurrency:
  group: pi-simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache the Arduino cores and libraries
        uses: actions/cache@v4
        with:
          path: test-results/pi/arduino-cache
          key: arduino-pi-arm64-${{ hashFiles('internal/arduino/requirements.json') }}

      - name: Simulate a Raspberry Pi 5
        run: tests/pi/simulate.sh

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-simulation-logs
          path: |
            test-results/pi/*.log
            test-results/pi/*.txt
          if-no-files-found: ignore
