[[steps]]
title = "Faster and faster"
support = "scaffolded"
starter_mode = "keep"
text = """
Real arcade games get harder as you get better. Let's make the moles hide **faster** after every hit.

Instead of always giving the player 2 seconds, keep the time in a **variable**:

```
time_allowed = 2.0
```

After each hit, make it a little shorter:

```
time_allowed = max(0.5, time_allowed - 0.2)
```

`max()` picks the bigger number, so the time never drops below half a second. (Otherwise the game would be impossible!)

**Your task:**
1. Make `time_allowed = 2.0` before the loop
2. Use `which_button(time_allowed)` instead of `which_button(2)`
3. Make it shorter after every hit
4. At the start of each turn, show the time, like `Mole 3: 1.6 seconds`
"""
hints = [
  "Put `time_allowed = 2.0` next to `score = 0`. Change `which_button(2)` to `which_button(time_allowed)`.",
  "Inside `if choice == mole:`, add `time_allowed = max(0.5, time_allowed - 0.2)`.",
  "At the top of the loop: `print(f\"Mole {turn + 1}: {time_allowed:.1f} seconds\")`. The `:.1f` shows 1 decimal place.",
]
success = "The game fights back now. Can you still get 10 out of 10?"
demo = '''
from gpiozero import LED, Button, Buzzer
from time import sleep, monotonic
import random

moles = [LED(17), LED(27), LED(22)]               # left, middle, right
buttons = [Button(23), Button(24), Button(25)]
buzzer = Buzzer(18)

def which_button(timeout):
    """Wait up to timeout seconds for a button. Return 0, 1 or 2, or None if too slow."""
    start = monotonic()
    while monotonic() - start < timeout:
        for number in range(3):
            if buttons[number].is_pressed:
                buttons[number].wait_for_release()
                return number
        sleep(0.01)
    return None

score = 0
time_allowed = 2.0
for turn in range(10):
    print(f"Mole {turn + 1}: {time_allowed:.1f} seconds")
    mole = random.randint(0, 2)
    moles[mole].on()
    choice = which_button(time_allowed)
    moles[mole].off()
    if choice == mole:
        print("Hit!")
        score = score + 1
        buzzer.beep(on_time=0.1, n=1)
        time_allowed = max(0.5, time_allowed - 0.2)
    elif choice is None:
        print("Too slow!")
    else:
        print("Miss!")
    sleep(0.5)

print("Game over! Score:", score, "out of 10")
'''
