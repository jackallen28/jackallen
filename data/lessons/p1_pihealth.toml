[[steps]]
title = "Challenge: keep a health log"
support = "brief"
starter_mode = "keep"
run_mode = "until_stopped"
text = """
**Goal:** every 5 seconds, add a line to a file called `pi_health.csv` with the **time**, the temperature, the CPU load and the RAM, like this:

```
10:42:05,47.2,12.5,38.1
```

Keep the lights and warnings working. Run it for at least 10 seconds, then press **Stop** and open `pi_health.csv` in the file manager to look at it.

Tips: `from datetime import datetime`, then `datetime.now().strftime("%H:%M:%S")` gives the time. `open("pi_health.csv", "a")` adds to the end of a file. Count the loops to know when 5 seconds have passed.
"""
hints = [
  "Your loop runs every 0.5 seconds, so every 10th time round is 5 seconds. Keep a counter: `count = 0` before the loop.",
  "`count = count + 1`, then `if count % 10 == 0:` to write a line.",
]
success = "A log the Pi writes by itself. Open it in a spreadsheet to make a graph of your Pi's day!"
demo = '''
from gpiozero import PWMLED
from pipath_computer import cpu_temp, cpu_load, ram_used
from datetime import datetime
from time import sleep

temp_led = PWMLED(17)
cpu_led = PWMLED(27)
ram_led = PWMLED(22)
count = 0

while True:
    temp = cpu_temp()
    load = cpu_load()
    ram = ram_used()

    temp_led.value = min(1, max(0, (temp - 30) / 50))
    cpu_led.value = load / 100
    ram_led.value = ram / 100

    print(f"{temp} °C   CPU {load} %   RAM {ram} %")
    if load > 80:
        print("⚠ The Pi is working hard!")
    if temp >= 70:
        print("⚠ The Pi is getting hot!")

    if count % 10 == 0:
        now = datetime.now().strftime("%H:%M:%S")
        with open("pi_health.csv", "a") as f:
            f.write(f"{now},{temp},{load},{ram}\n")
        print("(saved to the log)")
    count = count + 1
    sleep(0.5)
'''
demo_events = ["0.3 stat temp 46", "0.3 stat load 12", "3 stat load 85", "5 stat load 20"]
demo_seconds = 7

