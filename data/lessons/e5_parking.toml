[[steps]]
title = "Green, amber, red zones"
support = "scaffolded"
starter_mode = "replace"
run_mode = "until_stopped"
starter = '''
from gpiozero import DistanceSensor, LED
from time import sleep

sensor = DistanceSensor(echo=26, trigger=4)
red = LED(17)
amber = LED(27)
green = LED(22)

print("Parking sensor on. Come closer!")
while True:
    cm = sensor.distance * 100
    green.off()
    amber.off()
    red.off()
    if cm > 60:
        green.on()          # lots of room
    elif ___:
        amber.on()          # getting close
    else:
        ___                 # very close!
    sleep(0.1)
'''
text = """
Now join the sensor and the lights. A parking sensor sorts the distance into **zones**:

- more than **60 cm**: green, lots of room
- **20 to 60 cm**: amber, getting close
- less than **20 cm**: red, very close!

The `while True` loop measures the distance 10 times a second. Each time, it turns all the lights off, then `if / elif / else` turns the right one on.

Python checks `if`, then `elif`, then `else`, **in order**, and stops at the first one that's true. So by the time it gets to `elif`, it already knows the distance isn't more than 60.

**Your task:** fill in the two blanks: amber when the distance is **20 cm or more**, and red for everything else. Run it, move closer and further away, then press **Stop**.
"""
hints = [
  "The `elif` needs a test, like the `if` above it. Amber is for 20 cm or more.",
  "The test is `cm >= 20`. In the `else` part, turn the red light on.",
  "The lines are `elif cm >= 20:` and `red.on()`",
]
error_hints = { SyntaxError = "Check the `elif` line ends with a colon: `elif cm >= 20:`" }
success = "Green, amber, red: your lights follow the distance. Now for the sound."
