[[steps]]
title = "Challenge: no spam, and a visitor log"
support = "brief"
starter_mode = "keep"
run_mode = "until_stopped"
text = """
Someone standing at the door would set it off again and again. Make your doorbell smarter.

**Goal:**
- after a visit, ignore new visitors for **10 seconds** (a cooldown), and print `(too soon)` instead
- count the visitors and print `Visitor 1`, `Visitor 2`, ...
- add a line to `visitors.csv` for each visitor: the visitor number, the time and the photo's name

Tips: `from time import monotonic` gives a clock in seconds. Remember when the last visit was, and compare. A function that changes a variable from outside it needs `global`.
"""
hints = [
  "Before the functions: `last_visit = -100` and `count = 0`. In `visitor()`: `global last_visit, count`.",
  "`if monotonic() - last_visit < 10:` then `print(\"(too soon)\")` and `return`. Otherwise set `last_visit = monotonic()` and add 1 to `count`.",
]
success = "A doorbell that knows when to ring, and remembers every visitor. Brilliant work!"
demo = '''
from gpiozero import DistanceSensor, LED, Buzzer
from pipath_camera import Camera
from pipath_computer import open_file
from datetime import datetime
from time import monotonic
from signal import pause

sensor = DistanceSensor(echo=26, trigger=4, threshold_distance=0.3)    # closer than 30 cm
light = LED(17)
bell = Buzzer(18)
cam = Camera()
last_visit = -100
count = 0

def visitor():
    global last_visit, count
    if monotonic() - last_visit < 10:
        print("(too soon)")
        return
    last_visit = monotonic()
    count = count + 1
    print("Ding dong! Visitor", count)
    light.on()
    bell.beep(0.1, 0.1, n=2)
    stamp = datetime.now().strftime("%H-%M-%S")
    name = cam.take_photo(f"visitor_{stamp}.jpg")
    open_file(name)
    with open("visitors.csv", "a") as f:
        f.write(f"{count},{stamp},{name}\n")

def gone():
    light.off()

sensor.when_in_range = visitor
sensor.when_out_of_range = gone

print("Doorbell ready...")
pause()
'''
demo_events = ["0 show face", "1 distance 26 15", "2.5 distance 26 90", "3.5 distance 26 12", "5 distance 26 90"]
demo_seconds = 6

