title = "The camera is busy"
explain = "Another program is already using the camera. Only one program can use it at a time."
hints = [
  "Press **Stop** on any other PiPath program, and close other camera apps.",
  "Still stuck? Restart the Pi, then try again.",
]

# ------------------------------------------------------------------ Everything else

[[error]]
id = "file_not_found"
type = "FileNotFoundError"
message = '''No such file or directory: '(?P<file>.+)''''
title = "Can't find the file `{file}`"
explain = "Your program tried to open `{file}`, but it doesn't exist (yet)."
tech = """Relative paths like `{file}` are resolved from the **current working directory**, not necessarily the folder you expect. Opening with mode `"r"` needs the file to exist; `"w"` and `"a"` create it. Check with `os.path.exists()` or catch `FileNotFoundError`."""
hints = [
  "Check the file name spelling.",
  "If you're reading a file, it has to be created first. Open it with `\"a\"` or `\"w\"` mode to create it.",
]

[[error]]
id = "recursion"
type = "RecursionError"
title = "A function that never stops calling itself"
explain = "A function kept calling itself over and over until Python gave up."
tech = """Each function call adds a **frame** to the call stack, and Python limits the depth (about 1000) to avoid running out of memory. Recursion needs a **base case** that returns without calling itself, and each call must move closer to it. Often a loop is simpler."""
hints = [
  "Find the function that calls itself. When should it stop?",
]

[[error]]
id = "eof"
type = "EOFError"
title = "No answer was given"
explain = "Your program asked a question with `input()` but the program was stopped before an answer arrived."
tech = """`input()` reads from **standard input** (stdin). When stdin is closed before a line arrives, there is nothing left to read, so Python raises `EOFError`. Programs that read input can catch it to finish cleanly."""
hints = [
  "Run it again and type into the box under the Output.",
]

[[error]]
id = "generic"
type = "*"
title = "Something went wrong"
explain = "Python stopped with a **{type}** on line {line}. Python said: `{message}`"
hints = [
  "Read line {line} carefully. What is it trying to do?",
  "Add a `print()` just before line {line} to see what your variables hold.",
  "Still stuck? Ask a classmate to read your code with you, then ask your teacher.",
]
