# ------------------------------------------------------------------ STEP 2
[[steps]]
title = "Scanner animation"
support = "scaffolded"
starter_mode = "replace"
starter = '''
from gpiozero import LEDBoard
from time import sleep

bar = LEDBoard(17, 27, 22, 5, 6, 13)

for repeat in range(3):
    for led in bar:            # left to right
        led.on()
        sleep(0.1)
        led.off()
'''
text = """
You can loop through an `LEDBoard` just like a list. This makes a light **run** across the row.

**Your task:** make the light bounce **back and forth** like a scanner, 3 times.
"""
hints = [
  "After the left-to-right loop, add a right-to-left loop inside the same `repeat` loop.",
  "`reversed(bar.leds)` gives the LEDs from right to left.",
  "Example:\n```\nfor repeat in range(3):\n    for led in bar:\n        led.on(); sleep(0.1); led.off()\n    for led in reversed(bar.leds):\n        led.on(); sleep(0.1); led.off()\n```",
]
success = "Smooth! Animation is just loops plus timing."

demo = '''
from gpiozero import LEDBoard
from time import sleep

bar = LEDBoard(17, 27, 22, 5, 6, 13)

for repeat in range(3):
    for led in bar:                  # left to right
        led.on()
        sleep(0.1)
        led.off()
    for led in reversed(bar.leds):   # right to left
        led.on()
        sleep(0.1)
        led.off()
'''

[[steps.checks]]
type = "runs_ok"
label = "Your program runs"

[[steps.checks]]
type = "code_uses"
value = "call:reversed"
label = "The light comes back the other way"

[[steps.checks]]
type = "confirm"
label = "The light bounces back and forth"

# ------------------------------------------------------------------ STEP 3
[[steps]]
title = "Up / down counter"
support = "scaffolded"
starter_mode = "replace"
run_mode = "until_stopped"
starter = '''
from gpiozero import LEDBarGraph, Button
from signal import pause

graph = LEDBarGraph(17, 27, 22, 5, 6, 13)
up = Button(23)
down = Button(24)

count = 0

def show():
    graph.value = count / 6       # 0 = no LEDs, 1 = all six
    print("Count:", count)

def go_up():
    global count
    count = count + 1
    show()

def go_down():
    global count
    count = count - 1
    show()

up.when_pressed = go_up
down.when_pressed = go_down
show()
pause()
'''
text = """
`LEDBarGraph` lights LEDs **from the left like a meter**. Its `value` goes from `0` (none) to `1` (all six), so `count / 6` turns our count into the right level.

**Your task:** run it and press **up** 8 times. Read the Coach when it breaks!

Then fix it so the count **never goes above 6 or below 0**. These are called **limits**.
"""
hints = [
  "The bar graph only understands values from 0 to 1. What's 7 / 6?",
  "Only add 1 if `count < 6`. Only take away 1 if `count > 0`.",
  "Example:\n```\ndef go_up():\n    global count\n    if count < 6:\n        count = count + 1\n    show()\n```",
]
success = "A counter with limits: the same idea is in every volume control."

demo = '''
from gpiozero import LEDBarGraph, Button
from signal import pause

graph = LEDBarGraph(17, 27, 22, 5, 6, 13)
up = Button(23)
down = Button(24)

count = 0

def show():
    graph.value = count / 6
    print("Count:", count)

def go_up():
    global count
    if count < 6:
        count = count + 1
    show()

def go_down():
    global count
    if count > 0:
        count = count - 1
    show()

up.when_pressed = go_up
down.when_pressed = go_down
show()
pause()
'''
demo_events = ["1 tap 23 every 0.4 until 4.2", "4.8 tap 24 every 0.4 until 7"]
demo_seconds = 8

[[steps.checks]]
type = "runs_ok"
label = "Your program runs"

[[steps.checks]]
type = "code_regex"
value = '''count\s*<\s*6|count\s*<=\s*5|min\('''
label = "The count can't go above 6"

[[steps.checks]]
type = "code_regex"
value = '''count\s*>\s*0|count\s*>=\s*1|max\('''
label = "The count can't go below 0"

[[steps.checks]]
type = "confirm"
label = "The bar goes up and down with the buttons"

# ------------------------------------------------------------------ STEP 4
[[steps]]
title = "Roll the dice"
support = "brief"
starter_mode = "keep"
run_mode = "until_stopped"
text = """
**Goal:** turn your counter into a **dice**. When the **down** button (now the *Roll* button) is pressed:

1. Play a short "rolling" animation: show random numbers quickly, about 10 times
2. Pick the final number from **1 to 6**
3. Show it on the bar graph and print `You rolled a 4!`

Keep the **up** button doing whatever you like, or remove it.
"""
hints = [
  "Write a new function `roll()` and set `down.when_pressed = roll`.",
  "Animation: `for i in range(10):` pick a random number, show it, `sleep(0.05)`.",
  "Final roll: `count = random.randint(1, 6)` then `show()` and print it. Don't forget `import random` and `from time import sleep`.",
]
success = "Rolling! Try making the animation slow down at the end, like a real dice."

demo = '''
from gpiozero import LEDBarGraph, Button
from signal import pause
from time import sleep
import random

graph = LEDBarGraph(17, 27, 22, 5, 6, 13)
up = Button(23)
down = Button(24)

count = 0

def show():
    graph.value = count / 6

def go_up():
    global count
    if count < 6:
        count = count + 1
    show()

def roll():
    global count
    for i in range(10):              # the rolling animation
        count = random.randint(1, 6)
        show()
        sleep(0.05)
    count = random.randint(1, 6)
    show()
    print(f"You rolled a {count}!")

up.when_pressed = go_up
down.when_pressed = roll
show()
pause()
'''
demo_events = ["1 tap 24", "3 tap 24"]
demo_seconds = 5

[[steps.checks]]
type = "runs_ok"
label = "Your program runs"

[[steps.checks]]
type = "code_regex"
value = '''randint\(\s*1\s*,\s*6\s*\)'''
label = "The dice rolls 1 to 6"

[[steps.checks]]
type = "code_uses"
value = "call:sleep"
label = "There's a rolling animation"

[[steps.checks]]
type = "output_regex"
