# ------------------------------------------------------------------ STEP 3
[[steps]]
title = "Round and round"
support = "scaffolded"
starter_mode = "keep"
run_mode = "until_stopped"
text = """
Real traffic lights never stop. Let's put the sequence in a **function**, then call it again and again with a **loop**.

A function is a named chunk of code. You make it with `def`, and everything **indented** under it belongs to it:

```
def cycle():
    green.on()
    sleep(3)
    green.off()
    # ...amber and red go here too

while True:
    cycle()
```

`while True:` means *repeat forever*. That's OK here, because `sleep()` lets the Pi rest.

**Your task:** put your green, amber and red code inside `def cycle():` (select the lines and press **Tab** to indent them all). Add the `while True:` loop at the bottom. Run it, watch two full cycles, then press **Stop**.
"""
hints = [
  "Type `def cycle():` on a new line above your `print(\"Green: go\")` line.",
  "Select every line from the green print down to `red.off()` and press **Tab** so they're indented under `def`.",
  "At the very bottom, not indented: `while True:` and on the next line (indented) `cycle()`.",
]
success = "Your lights run forever, just like the real thing."
demo = '''
from gpiozero import LED
from time import sleep

red = LED(17)
amber = LED(27)
green = LED(22)

def cycle():
    print("Green: go")
    green.on()
    sleep(3)
    green.off()
    print("Amber: slow down")
    amber.on()
    sleep(2)
    amber.off()
    print("Red: stop")
    red.on()
    sleep(3)
    red.off()

while True:
    cycle()
'''
demo_seconds = 10

