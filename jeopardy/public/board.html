<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind Jeopardy — Board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%A1%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
<style>
  /* This window is dragged onto the projector and left alone. Nothing on it is
     clickable and nothing on it is ever an unrevealed answer. */
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; cursor: none; }

  #lobby { flex: 1; display: grid; place-items: center; text-align: center; padding: 2rem; }
  #lobby .title {
    font-family: var(--display);
    font-size: clamp(2rem, 9vw, 7rem);
    font-weight: 700;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: .04em;
    text-shadow: 5px 5px 0 rgba(0,0,0,.55);
    line-height: 1;
  }
  #lobby .sub { font-size: clamp(.9rem, 2.2vw, 1.7rem); opacity: .85; margin-top: 1.2rem; }
  #joinUrl {
    display: inline-block;
    margin-top: 1.8rem;
    padding: .6rem 1.5rem;
    border: 3px dashed var(--gold);
    font-size: clamp(1rem, 3vw, 2.2rem);
    font-weight: 700;
  }
  #codeLabel { margin-top: 1.4rem; letter-spacing: .25em; text-transform: uppercase; font-size: .8rem; opacity: .7; }
  #code {
    display: inline-block;
    margin-top: .4rem;
    padding: .4rem 1.6rem;
    background: var(--gold);
    color: var(--blue-950);
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(2rem, 8vw, 5rem);
    letter-spacing: .3em;
    text-indent: .3em;
  }

  #clock { font-size: clamp(2rem, 8vw, 6rem); }

  #buzzWho {
    font-family: var(--display);
    font-size: clamp(1.2rem, 4vw, 3rem);
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: .1em;
  }

  #finalWait { display: grid; gap: .6rem; justify-items: center; }
  .waitrow {
    display: flex; gap: .8rem; align-items: center;
    font-size: clamp(.9rem, 2.2vw, 1.6rem);
  }
  .waitrow .dot {
    width: 1.1em; height: 1.1em; border-radius: 50%;
    border: 3px solid var(--edge); display: inline-block;
  }
  .waitrow.done .dot { background: var(--green); border-color: var(--green); }

  #gameover { flex: 1; display: grid; place-items: center; text-align: center; padding: 2rem; }
  #gameover .win {
    font-family: var(--display);
    font-size: clamp(1.8rem, 7vw, 5rem);
    color: var(--gold);
    font-weight: 700;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div id="lobby">
  <div>
    <div class="title">Mind<br>Jeopardy</div>
    <div class="sub">Where is My Mind? — Perception, Consciousness &amp; AI</div>
    <div id="joinUrl"></div>
    <div id="codeLabel" class="hidden">Game code</div>
    <div id="code" class="hidden"></div>
    <div class="sub muted" id="rosterLine" style="margin-top:1.4rem"></div>
  </div>
</div>

<div id="gridview" class="hidden" style="flex:1;display:flex;flex-direction:column;min-height:0">
  <div class="grid" id="grid"></div>
</div>

<div id="clueview" class="hidden clue-screen">
  <div class="clue-meta" id="clueMeta"></div>
  <div class="clue-text" id="clueText"></div>
  <div id="buzzWho"></div>
  <div class="clock" id="clock" class="hidden"></div>
  <div class="clue-answer hidden" id="clueAnswer"></div>
</div>

<div id="finalview" class="hidden clue-screen">
  <div class="clue-meta" id="finalMeta"></div>
  <div class="clue-text" id="finalText"></div>
  <div class="clock" id="finalClock"></div>
  <div id="finalWait"></div>
  <div class="clue-answer hidden" id="finalAnswer"></div>
  <div id="finalResults"></div>
</div>

<div id="gameover" class="hidden">
  <div>
    <div class="win" id="winLine"></div>
    <div class="sub" id="finalScores" style="margin-top:1.5rem"></div>
  </div>
</div>

<div class="bar hidden" id="bar"><i></i></div>
<div class="scores" id="scores"></div>

<div id="flash"><div class="inner"></div></div>

<script type="module" src="/board.js"></script>
</body>
</html>
