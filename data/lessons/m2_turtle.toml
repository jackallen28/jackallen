id = "m2_turtle"
title = "Turtle Art Studio"
file_name = "turtle_art.py"

intro = """
## Code that draws

Python comes with a **turtle**: a little arrow that walks around a window and draws a line wherever it goes. You tell it how far to walk and how much to turn.

In this project you will:
- draw a square, one line at a time
- use a **`for` loop** so Python repeats the work for you
- write a **function** that can draw *any* shape
- use a **list** of colours and `%` to make a spinning rainbow pattern
- design your own artwork

When you press **Run**, a **new window opens** with the turtle in it. Move it to the side so you can still see your code. Close the turtle window (or press **Stop**) when you've finished looking.
"""

outro = """
## You're a turtle artist!

You used `forward()` and `left()`, repeated them with a `for` loop, wrapped them in a **function** with parameters, and picked colours from a list with `%`. Those are the same tools real programmers use every day.

**Extension ideas** (try these in Free Build):
- Draw a **spiral**: make the turtle walk a little further each time round the loop (`t.forward(i * 2)`)
- Draw a **street of houses**: write `def house(x, y):` that uses `t.penup()`, `t.goto(x, y)` and `t.pendown()`, then call it in a loop
- Fill your shapes with colour using `t.begin_fill()` and `t.end_fill()`
"""

