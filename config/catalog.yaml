# =====================================================================================
#  PROGRAM CATALOG — the single place where every booking rule lives.
#
#  Generated from docs/program-booking-rules.md. Edit this file to change programs,
#  rooms, equipment or combination rules, then run `npm run catalog:check` to validate
#  it and print a readable summary. The server refuses to start if this file is invalid.
#
#  Items marked "ASSUMPTION" are judgement calls — see docs/OPEN-QUESTIONS.md (Q numbers).
# =====================================================================================

settings:
  class_size: 25                       # students per class

  # Bookable time blocks (local time). Add e.g. AM/PM half-day slots here if needed (Q4).
  slots:
    - { id: full, label: "Full day", start: "09:15", end: "14:45" }

  staff_pool: { name: "STEAM Communicators", size: 4 }   # ASSUMPTION (Q1)

  # When a pairing is explicitly allowed by an `only_runs_with` list (e.g. Creative
  # TechStyles + Medical Emergency), let those two programs share rooms/equipment.
  allowed_pairs_share_rooms: true      # ASSUMPTION (Q5)

  # Semester date ranges. Each semester can list several ranges (one per year).
  semesters:                           # ASSUMPTION — owner to confirm dates (Q2)
    S1:
      - { from: "2027-01-28", to: "2027-06-25" }
    S2:
      - { from: "2026-07-13", to: "2026-12-18" }
      - { from: "2027-07-13", to: "2027-12-17" }

  # Days nothing can be booked (weekends are always closed).
  blackouts:                           # ASSUMPTION — example only, owner to supply real list (Q3)
    - { date: "2026-11-03", reason: "Melbourne Cup Day (public holiday)" }

# -------------------------------------------------------------------------------------
# Resources. Rooms are exclusive (one program per room per slot). Equipment listed here
# is shared, portable kit that can clash across rooms. Other equipment (laser cutter,
# 3D printers, felt loom, ...) is assumed to stay in its room and is shown for info only (Q19).
# -------------------------------------------------------------------------------------
resources:
  # rooms
  - { id: drone-room,     name: "Drone Room",                     type: room }
  - { id: pink-room,      name: "Pink Room",                      type: room }
  - { id: blue-room,      name: "Blue Room",                      type: room }
  - { id: fibre-hub,      name: "Fibre Hub",                      type: room }
  - { id: builders-box,   name: "Builders Box",                   type: room }
  - { id: design-hub,     name: "Design Hub",                     type: room }
  - { id: systems-lab,    name: "Systems Lab",                    type: room }
  - { id: podcast-studio, name: "Podcast Studio",                 type: room }
  - { id: ce-sim-lab,     name: "CE Simulation Lab",              type: room }
  - { id: media-room,     name: "Media / Green Screen Room",      type: room }
  - { id: igloo,          name: "DS Igloo",                       type: room }
  # shared equipment (tracked)
  - { id: vr-headsets,    name: "VR Headsets",                    type: equipment }
  - { id: drones,         name: "Drones",                         type: equipment }
  - { id: dobots,         name: "Dobots",                         type: equipment }
  - { id: podcasting-kits, name: "Podcasting Kits",               type: equipment }

categories:
  - { id: tech-samplers,  name: "Tech Samplers" }
  - { id: tech-in-action, name: "Tech in Action" }
  - { id: extension,      name: "Extension Programs" }

# -------------------------------------------------------------------------------------
# Programs
#
#   requires:        one line per requirement. A line with several ids means "any one of".
#                    e.g. [pink-room, blue-room] = Pink Room OR Blue Room.
#   cannot_run_with: programs that may never run in the same slot (applied both ways).
#   only_runs_with:  if set, this program may ONLY run alongside the programs listed.
#   equipment, software, rotation, notes: display / staff information only.
#   bookings_service_id: the matching Microsoft Bookings service (fill in using
#                    `npm run graph:check` — only needed for SYNC_MODE=graph).
# -------------------------------------------------------------------------------------
