# PiPath settings. Teachers can edit this file.

free_play_name = "Free Play"   # the sandbox's name on the activity picker and its title bar
app_name = "PiPath"
tagline = "Learn Python one step at a time, right here on your Raspberry Pi."

# PIN for the teacher panel (press Ctrl+Shift+T anywhere). CHANGE THIS before class.
teacher_pin = "2468"

# Runaway-program protection
busy_loop_seconds = 8       # stop a program that keeps the CPU busy this long with no output
max_output_lines = 3000     # stop a program that prints more lines than this in 20 seconds (a flood)

# Independence stars: total hints used in a lesson -> stars
three_star_max_hints = 2
two_star_max_hints = 6
