name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go formatting
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: Go vet
        run: go vet ./...

      - name: Go tests (server, content, save files, certificates)
        run: go test ./...

      - name: Build the Pi server (linux/arm64, one static file)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X circuitpath.Version=${GITHUB_SHA::7}" -o circuitpath-server-linux-arm64 ./cmd/circuitpath-server

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: JavaScript tests
        run: npm test

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: GUI smoke test
        run: npm run e2e

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/screenshots
          if-no-files-found: ignore

  boards:
    # Every board compiles the kit check with the pinned cores and libraries
    # (internal/arduino/requirements.json). The Pi simulation does the same on arm64.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache the Arduino cores and libraries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cp/arduino
          key: arduino-amd64-${{ hashFiles('internal/arduino/requirements.json') }}

      - name: Install the Arduino tools and compile for every board
        run: go run ./cmd/circuitpath-server -data "$RUNNER_TEMP/cp" -setup-arduino
