text = """
Copying the `if` block for every question would make a very long program. Instead, we keep the questions in a **list**, and the answers in another list, **in the same order**.

```
answers = ["Canberra", "platypus", "6", "Mercury"]
```

`zip()` **pairs up** two lists, like a zip on a jacket. The first question goes with the first answer, the second with the second, and so on. The `for` loop then takes one pair at a time:

```
for q, a in zip(questions, answers):
```

Each time round the loop, `q` is a question and `a` is its answer.

Your code from the last step is safe in the `backups` folder.

**Your task:**
1. Fill in the blanks so the loop zips the **questions** list with the **answers** list.
2. Add a **fifth question** to the end of `questions`, and its answer to the end of `answers`.
3. Run it and play your quiz!
"""
