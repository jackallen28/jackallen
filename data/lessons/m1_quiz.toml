print(f"Score: {score} out of {len(questions)}")

percent = score / len(questions) * 100
print(f"You got {percent:.0f}%")
if percent >= 80:
    print("Quiz Master!")
elif percent >= 50:
    print("Not bad at all!")
else:
    print("Have another go!")
'''
