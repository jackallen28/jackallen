# ADVANCED 2: Reaction Timer. See e1_lightswitch.toml for the GPIO lesson keys.
# Pin plan: LED 17, player 1 button 23, player 2 button 24, (optional) buzzer 18.

id = "a2_reaction"
title = "Reaction Timer"
file_name = "reaction_timer.py"
requires_gpio = true

intro = """
## How fast are you?

A light comes on at a random moment. Press your button as fast as you can. The Pi times you to the **millisecond** (a thousandth of a second).

In this activity you will:
- use **random** waits so nobody can guess when the light comes on
- use the Pi as a **stopwatch** with `time.monotonic()`
- catch **cheaters** who press too early
- race a friend with **events** (`when_pressed`)
- save a **high score** to a file, so it's still there tomorrow

Most people react in about 200 to 300 ms. Can you beat that?
"""

outro = """
## Ready, set, react!

You used random waits, a stopwatch, decisions, events, a `for` loop, and a **file** that remembers the high score. That's a complete arcade game.

**Extension ideas:**
- Add a buzzer that beeps when the light comes on, then test: do people react faster to sound or to light?
- Keep a **leaderboard**: save everyone's name and best time to a CSV file
- Draw a bar chart of the 5 reaction times with `print("#" * (ms // 20))`
"""

