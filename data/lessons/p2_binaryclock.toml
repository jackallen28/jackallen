# ------------------------------------------------------------------ STEP 2
[[steps]]
title = "Numbers in binary"
support = "guided"
starter_mode = "replace"
starter = '''
for n in range(11):
    print(n, format(n, ___))
'''
text = """
`format(41, "06b")` turns the number 41 into binary text: `101001`.

- the `b` means **binary**
- the `06` means "use 6 digits, with 0s at the front if needed", so 5 becomes `000101`

**Your task:** fill in the blank with `"06b"` (with the quotes) to print 0 to 10 in binary. Can you see the pattern? The right-hand digit flips every time.
"""
hints = [
  "The blank needs the text that means \"6 binary digits\".",
  "It's `\"06b\"`, with the quotes.",
  "The line is `print(n, format(n, \"06b\"))`",
]
success = "That's how your Pi stores every number: as 1s and 0s. Six of them are enough for the seconds."
demo = '''
