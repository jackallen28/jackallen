from pipath_camera import Camera
import json

cam = Camera()

with open("examples.json") as f:
    examples = json.load(f)

def distance(a, b):
    total = 0
    for x, y in zip(a, b):
        total = total + abs(x - y)
    return total

def classify(pixels):
    """Find the example that looks most like these pixels, and return its label."""
    best_label = None
    best_distance = None
    for ex in examples:
        d = distance(pixels, ex["pixels"])
        if best_distance is None or d < ___:
            best_distance = d
            best_label = ex["label"]
    return best_label

def snap():
    """Take a 16 x 16 picture and join its rows into one list of 256 numbers."""
    grid = cam.capture_grid(16, 16)
    pixels = []
    for row in grid:
        pixels = pixels + row
    return pixels

print("Looking...")
guess = classify(snap())
print("I think it's a", guess)
'''
text = """
Now the clever bit. To guess what's in a new photo, `classify()` compares it with **every** training example and finds the **closest** one (the smallest distance). Its label is the guess. That's a **nearest neighbour** classifier.

It works like you looking at a new dog photo and thinking "that looks most like the Labrador I saw before".

**Your task:** fill in the blank so a new example wins if its distance `d` is **smaller** than the best so far.

Then test it with **both** things: run it with one thing in front of the camera, then run it again with the other. (Simulator: choose **Ball** on the board and run it, then choose **Box** and run it again.)
"""
hints = [
  "We keep the smallest distance so far in `best_distance`.",
  "Compare `d` with `best_distance`.",
  "The line is `if best_distance is None or d < best_distance:`",
]
