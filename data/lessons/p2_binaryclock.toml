starter_mode = "replace"
starter = '''
from datetime import datetime

now = datetime.now()
print("Hours:", now.hour)
print("Minutes:", now.minute)
print("Seconds:", now.___)
'''
text = """
The Pi has a clock inside. `datetime.now()` asks it for the time **right now**, and gives back a value with parts you can read:

- `now.hour` (0 to 23)
- `now.minute` (0 to 59)
- `now.second` (0 to 59)

**Your task:** fill in the blank so the program prints the seconds too. Run it a few times and watch the seconds change.
"""
