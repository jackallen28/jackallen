# Concept lexicon for VCE Physics Units 3 & 4.
#
# The study design describes concepts; exam questions describe scenarios. VCAA
# writes "investigate and apply Newton's three laws of motion"; Checkpoints
# writes "a speeding motorbike travels past a stationary police car". Matching
# one against the other on shared words fails badly — and worse than randomly,
# because the generic words that do line up are misleading: "motion" pulls
# kinematics questions into "motion approaching the speed of light", and
# "travel"/"speed" pull them into "electromagnetic waves travel at the speed c".
#
# This file supplies the missing half: the vocabulary a question actually uses
# for each dot point. It is hand-written subject knowledge, not derived from the
# study design, and it is what the offline tagger leans on.
#
#   triggers  — terms or phrases that indicate this dot point. Multi-word
#               phrases are matched as substrings; single words on token
#               boundaries. A phrase is worth more than a bare word.
#   requires  — if present, at least one of these must also appear. Used to stop
#               a broad dot point claiming every question that shares one word.
#   avoid     — terms that rule this dot point out even if triggers matched.
#
# Scored in blitz/ingest/tag.py; measured by evals/tagging_eval.py.

