text = """
A button can do **two** jobs: one for a quick press, and one when you **hold** it down. gpiozero calls the second one `when_held`.

1. Import `open_website` from `pipath_computer` too.
2. Change button 1 so it counts as "held" after a second and a half: `button1 = Button(23, hold_time=1.5)`
3. Write a `favourite()` function that opens a website you like, then flashes:
```
def favourite():
    open_website("https://projects.raspberrypi.org")
    flash()
```
4. After the `for` loop: `button1.when_held = favourite`

A hold starts as a press, so button 1 takes a screenshot first, then opens the site. Websites need the internet: with no internet, the browser shows an error page, and that's OK.

**Your task:** make holding button 1 open your favourite website. Quick presses should still work.
"""
