# ------------------------------------------------------------------ STEP 3
[[steps]]
title = "Show a random pattern"
support = "scaffolded"
starter_mode = "replace"
starter = '''
from gpiozero import LED, Button
from time import sleep
import random

leds = [LED(17), LED(27), LED(22)]
buttons = [Button(23), Button(24), Button(25)]

def flash(number):
    """Flash one LED. number is 0, 1 or 2."""
    leds[number].on()
    sleep(0.4)
    leds[number].off()
    sleep(0.2)

pattern = []
for i in range(4):
    pattern.append(random.randint(0, ___))

print("Pattern:", pattern)
for number in pattern:
    flash(number)
'''
text = """
The game needs a **pattern**: a list of numbers, where `0` means red, `1` green and `2` blue.

`flash(number)` is a **function**: a named, reusable chunk of code. We call it once for every number in the pattern.

**Your task:** fill in the blank so `randint` picks 0, 1 **or 2**. Run it a few times and check the lights match the printed pattern.
"""
hints = [
  "LED positions in the list go 0, 1, 2. What's the biggest?",
  "`random.randint(0, 2)` picks 0, 1 or 2.",
]
error_hints = { IndexError = "`leds[3]` doesn't exist. The list only has positions 0, 1 and 2. Check your randint numbers." }
success = "The computer can make patterns. Now let's see if a human can copy them!"

[[steps.checks]]
