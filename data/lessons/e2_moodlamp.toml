**Goal:** make the lamp your own. Choose **at least one** of these:

- **Moods:** give each colour a name in a **dictionary** (`{"calm": (0, 0.3, 1), ...}`) and print the mood name each time it changes
- **Breathing:** `lamp.pulse(on_color=..., fade_in_time=2, fade_out_time=2)` for a slow glow
- **Sunrise:** fade from dark red to bright yellow using a loop and small steps

Test it, then show a classmate.
"""
hints = [
  "Pick one idea and get the simplest version working first.",
  "For a dictionary: `moods = {\"calm\": (0, 0.3, 1), \"happy\": (1, 0.8, 0)}` then `for name, colour in moods.items():`",
]
success = "Your own design. That's what makers do!"

demo = '''
from gpiozero import RGBLED
from time import sleep

lamp = RGBLED(red=17, green=27, blue=22)

moods = {"calm": (0, 0.3, 1), "happy": (1, 0.8, 0), "fire": (1, 0.2, 0)}

for name, colour in moods.items():
    print("Mood:", name)
    lamp.pulse(fade_in_time=1, fade_out_time=1, on_color=colour, n=1, background=False)
