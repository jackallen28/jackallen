<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="5">
  <title>CircuitPath is getting ready</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <!-- Shown while the server starts up and checks for (or installs) an update. -->
  <div class="logon">
    <main class="logon-stage">
      <section class="window wizard getting-ready" aria-labelledby="ready-title">
        <div class="titlebar"><img class="app-icon" src="/img/favicon.svg" alt=""><span class="title" id="ready-title">CircuitPath</span></div>
        <div class="window-body">
          <h2>CircuitPath is getting ready</h2>
          <p>It's checking for updates. This page will open by itself in a moment.</p>
          <div class="progress marquee" role="progressbar" aria-label="Getting ready"><span></span></div>
          <p class="small muted">Your work is safe. If you were writing code, it will save when CircuitPath is back.</p>
        </div>
      </section>
    </main>
    <img class="bnts-pixels" src="/img/bnts-pixels.svg" alt="">
  </div>
</body>
</html>
