[[steps]]
title = "Challenge: the surprise button"
support = "brief"
starter_mode = "keep"
run_mode = "until_stopped"
text = """
**Goal:** add a second button on **GPIO24**. When it's pressed, open a random **website** from a list, with `open_website(url)` from `pipath_computer`. Keep the roll button working.

Here are some links to start with (they're YouTube searches, so the Pi needs the internet, and your school might block some sites):

```
sites = ["https://www.youtube.com/results?search_query=dance+music",
         "https://www.youtube.com/results?search_query=funny+cats",
         "https://www.youtube.com/results?search_query=lego+stop+motion",
         "https://www.youtube.com/results?search_query=australian+animals"]
```

Tip: `surprise_button.when_pressed = surprise` runs your `surprise` function in the background, even while the loop waits for the roll button.
"""
hints = [
  "`surprise_button = Button(24)`, then `def surprise():` with `open_website(choice(sites))` inside.",
  "Give the function to the button **before** the `while True:` loop: `surprise_button.when_pressed = surprise` (no brackets).",
]
success = "Two buttons, one computer, endless parties. You're a real Dice DJ!"
demo = '''
from gpiozero import Button, LEDBarGraph
from random import randint, choice
from pipath_computer import open_file, open_website
import glob

button = Button(23)
surprise_button = Button(24)
dice = LEDBarGraph(17, 27, 22, 5, 6, 13)
files = glob.glob("party/*")
sites = ["https://www.youtube.com/results?search_query=dance+music",
         "https://www.youtube.com/results?search_query=funny+cats",
         "https://www.youtube.com/results?search_query=lego+stop+motion",
         "https://www.youtube.com/results?search_query=australian+animals"]

def surprise():
    print("Surprise!")
    open_website(choice(sites))

surprise_button.when_pressed = surprise

print("Press the button to roll!")
while True:
    button.wait_for_press()
    roll = randint(1, 6)
    dice.value = roll / 6
    print("You rolled", roll)
    open_file(choice(files))
    button.wait_for_release()      # one roll per press
'''
demo_events = ["1 tap 23", "2.5 tap 24", "4 tap 23"]
demo_seconds = 5.5
demo_files = ["p3/party"]

