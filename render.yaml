# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Configured for the FREE instance type: no card needed for the service itself.
# Free instances have no disk, so generated models and submitted requests live
# in /tmp and are lost when the instance restarts or spins down after 15 minutes
# of inactivity. That is fine for testing the flow; see "Keeping the data" below
# for the one-line change that makes it persistent.
#
# In Render: New → Blueprint → pick this repo → Apply. The only value you supply
# is ANTHROPIC_API_KEY.
#
# NOTE: Render asks for payment details before applying a Blueprint. If you'd
# rather not add a card at all, create the service by hand instead — the steps
# are in cad-quote-bot/README.md ("No card: create the service manually").

services:
  - type: web
    name: cad-quote-bot
    runtime: docker
    dockerfilePath: ./cad-quote-bot/Dockerfile
    dockerContext: ./cad-quote-bot
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true

    # Keeping the data: switch `plan` to `starter` ($7/mo), uncomment this disk,
    # and set DATA_DIR to /data below. Sessions, models and quote requests then
    # survive restarts.
    # disk:
    #   name: cadbot-data
    #   mountPath: /data
    #   sizeGB: 1

    envVars:
      # Prompted for on first apply, never stored in the repo.
      - key: ANTHROPIC_API_KEY
        sync: false

      # Preview mode: submitted quote requests are viewable in the browser
      # rather than emailed. Set this to `resend` and add RESEND_API_KEY +
      # QUOTE_NOTIFY_EMAIL when you want them delivered for real.
      - key: NOTIFY_MODE
        value: preview

      # Render generates this. Read it in the dashboard (Environment tab) and
      # use it to open /requests?key=<value>.
      - key: ADMIN_KEY
        generateValue: true

      # Ephemeral, because the free instance type has no disk. Change to /data
      # when you attach the disk above.
      - key: DATA_DIR
        value: /tmp/cadbot-data
      - key: STORAGE_DRIVER
        value: local
      - key: BRAND_NAME
        value: CAD Quote Bot
      - key: BRAND_ACCENT
        value: "#FF6A1A"

      # While prototyping, any site may embed the widget. Before you go live,
      # set this to your own origins, e.g. https://www.yourcompany.com
      - key: ALLOWED_ORIGINS
        value: "*"

      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: OPENSCAD_XVFB
        value: "true"
      - key: OPENSCAD_TIMEOUT_MS
        value: "90000"
