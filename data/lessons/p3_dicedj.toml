# ------------------------------------------------------------------ STEP 5
[[steps]]
title = "A sound for each number"
support = "scaffolded"
starter_mode = "keep"
run_mode = "until_stopped"
text = """
Time to make the **computer** do something. `open_file()` opens a file with the Pi's normal app, just like double-clicking it. There are six sounds in your `party` folder.

Add these to your program:

1. At the top: `from pipath_computer import open_file`
2. Before the loop, a **list** of the six sounds:
```
sounds = ["party/1.wav", "party/2.wav", "party/3.wav",
          "party/4.wav", "party/5.wav", "party/6.wav"]
```
3. In the loop, after the print: `open_file(sounds[roll - 1])` (before `button.wait_for_release()`)

Why `roll - 1`? Lists count from **0**, so the first sound is `sounds[0]`. A roll of 1 needs `sounds[0]`, and a roll of 6 needs `sounds[5]`.

**Your task:** add the three parts, run it and roll. Count the beeps!
"""
hints = [
  "Put the import at the very top, the list before `while True:`, and `open_file(...)` inside the loop (indented).",
  "Inside the loop: `open_file(sounds[roll - 1])` after `print(\"You rolled\", roll)`.",
  "Check you have all three: the import, the `sounds = [...]` list, and `open_file(sounds[roll - 1])`.",
]
error_hints = { FileNotFoundError = "Check the file names in your list. They should be like `\"party/1.wav\"`.", IndexError = "A list of 6 things has positions 0 to 5. Did you use `sounds[roll - 1]`?" }
success = "The dice plays a sound! The LEDs and the computer work together."
demo = '''
from gpiozero import Button, LEDBarGraph
from random import randint
from pipath_computer import open_file

button = Button(23)
dice = LEDBarGraph(17, 27, 22, 5, 6, 13)
sounds = ["party/1.wav", "party/2.wav", "party/3.wav",
          "party/4.wav", "party/5.wav", "party/6.wav"]

print("Press the button to roll!")
while True:
    button.wait_for_press()
    roll = randint(1, 6)
    dice.value = roll / 6
    print("You rolled", roll)
    open_file(sounds[roll - 1])
    button.wait_for_release()      # one roll per press
'''
demo_events = ["1 tap 23", "3 tap 23"]
demo_seconds = 4.5
demo_files = ["p3/party"]

