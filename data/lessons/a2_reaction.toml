# ------------------------------------------------------------------ STEP 3
[[steps]]
title = "No cheating!"
support = "scaffolded"
starter_mode = "keep"
text = """
What if someone holds the button down, or presses before the light? Right now they'd get an amazing time. Let's catch them!

`button.wait_for_press(timeout=wait)` waits for a press, but gives up after `wait` seconds. It gives back **True** if the button was pressed, or **False** if time ran out. That's perfect: a press *during* the wait is a false start.

```
wait = random.uniform(2, 5)
if button.wait_for_press(timeout=wait):
    print("Too soon! Wait for the light.")
else:
    light.on()
    start = monotonic()
    ...
```

**Your task:** change your program so it uses this. The light, stopwatch and reaction time all go inside the `else:` (indented). Then test it **both** ways: press too early once, and play properly once.
"""
hints = [
  "Replace your `sleep(random.uniform(2, 5))` line with the `wait = ...` and `if button.wait_for_press(timeout=wait):` lines.",
  "Everything from `light.on()` to the final `print` moves inside the `else:`. Select those lines and press Tab.",
  "Test the false start: press the button straight after `Get ready...`.",
]
success = "No more cheating. Fair tests matter in science and in games."
demo = '''
from gpiozero import LED, Button
from time import monotonic
import random

light = LED(17)
button = Button(23)

print("Get ready...")
wait = random.uniform(2, 5)
if button.wait_for_press(timeout=wait):
    print("Too soon! Wait for the light.")
else:
    light.on()
    start = monotonic()
    button.wait_for_press()
    end = monotonic()
    light.off()
    print(f"Your reaction time: {round((end - start) * 1000)} ms")
'''
demo_events = ["1 tap 23"]

