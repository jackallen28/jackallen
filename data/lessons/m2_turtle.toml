text = """
Did you spot the pattern? For *any* shape, the turtle turns **360 ÷ the number of sides** at each corner.

So let's write a **function**: a named recipe you can use again and again. `def polygon(sides, size):` has two **parameters**. They are like empty boxes that get filled in each time you **call** the function:

```
polygon(4, 100)    # sides = 4, size = 100
polygon(6, 60)     # sides = 6, size = 60
```

**Your task:**
1. Fill in the two blanks so `polygon` works for any number of sides.
2. Call it at least **3 more times** to draw a triangle, a pentagon (5 sides) and an octagon (8 sides). Try a different colour for each.
"""
