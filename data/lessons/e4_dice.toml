kind = "switch"
pin = 25
connect = "One leg → GPIO25 (pin 22), other leg → GND. It works exactly like a button."

# ------------------------------------------------------------------ STEP 1
[[steps]]
title = "Light the whole row"
support = "scaffolded"
starter_mode = "replace"
starter = '''
from gpiozero import LEDBoard
from time import sleep

bar = LEDBoard(17, 27, 22, 5, 6, 13)

bar.on()
sleep(1)
bar.off()
sleep(0.5)
bar.value = (1, 0, 1, 0, 1, 0)    # every second LED
sleep(1)
'''
text = """
`LEDBoard` controls a group of LEDs as one thing. `bar.on()` lights them all.

`bar.value` takes a **tuple** with one number per LED: `1` for on, `0` for off.

**Your task:** run it to check all six LEDs work. Then add **two more patterns** of your own (for example, the outside two only, or the left half).
"""
hints = [
  "Outside two only: `(1, 0, 0, 0, 0, 1)`",
  "Add each pattern on its own line, followed by `sleep(1)` so you can see it.",
]
success = "All six LEDs under your control."

demo = '''
from gpiozero import LEDBoard
from time import sleep

bar = LEDBoard(17, 27, 22, 5, 6, 13)

bar.on()
sleep(1)
bar.off()
sleep(0.5)
bar.value = (1, 0, 1, 0, 1, 0)    # every second LED
sleep(1)
bar.value = (1, 0, 0, 0, 0, 1)    # the outside two
sleep(1)
bar.value = (1, 1, 1, 0, 0, 0)    # the left half
sleep(1)
'''

