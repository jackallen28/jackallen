[[steps]]
title = "A function that asks"
support = "scaffolded"
starter_mode = "keep"
text = """
A **function** is a named block of code you can use again and again. A function can also **give back** an answer with `return`.

We'll make a function called `ask` that asks one question and gives back **True** (they got it right) or **False** (they didn't). Then the loop just keeps score.

**Your task:**
1. Near the top of your program (under the lists), start a function:
```
def ask(question, answer):
```
2. Move the lines that ask and check the question **inside** it (indented). Use `question` and `answer` instead of `q` and `a`.
3. Replace the `score += 1` line with `return True`. In the `else` part, add `return False`.
4. Change the loop so it calls your function and adds 1 to the score when it gives back True:
```
for q, a in zip(questions, answers):
    if ask(q, a):
        score += 1
```

Run it. The quiz should work exactly the same as before, but now your code is **organised** into a tidy piece with a name.
"""
hints = [
  "The function goes **above** the loop, because Python needs to read the `def` before you can use it.",
  "Inside `ask`, use `reply = input(question)`, then the same `if` as before but with `answer`. End each part with `return True` or `return False`.",
  "Example:\n```\ndef ask(question, answer):\n    reply = input(question)\n    if reply.strip().lower() == answer.strip().lower():\n        print(\"Correct!\")\n        return True\n    else:\n        print(f\"Not quite. The answer is {answer}.\")\n        return False\n```",
]
error_hints = { NameError = "Python reads from the top down. Is your `def ask` above the loop? Inside the function, did you use `question` and `answer` (not `q` and `a`)?", IndentationError = "Every line inside the function needs 4 spaces in front of it, and the lines inside the `if` need 8." }
success = "Your function does one job well and hands back the result. That's how big programs are built: lots of small functions."
