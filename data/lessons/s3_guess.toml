# ------------------------------------------------------------------ STEP 2
[[steps]]
title = "Take a guess"
support = "scaffolded"
starter_mode = "append"
starter = '''

guess = int(input("Guess my number (1-10): "))

if guess ___ secret:
    print("You got it!")
else:
    print("Nope! It was", secret)
'''
text = """
Now the player can make a guess. The `if` checks a **condition**:

- if it's **True**, Python runs the indented lines under `if`
- otherwise, it runs the lines under `else`

To **compare** two values, Python uses **`==`** (two equals signs). One `=` *stores* a value, two `==` *compare*.

**Your task:** fill in the blank with the right comparison, then run it and make a guess.
"""
hints = [
  "You want to check: is the guess **equal to** the secret?",
  "Use two equals signs: `==`",
  "The line should read `if guess == secret:`",
]
error_hints = { SyntaxError = "Inside an `if`, use `==` to compare. A single `=` is for storing values." }
success = "Your program can make decisions now!"
demo = '''
import random

secret = random.randint(1, 10)
print("Psst... the secret number is", secret)

guess = int(input("Guess my number (1-10): "))

if guess == secret:
    print("You got it!")
else:
    print("Nope! It was", secret)
'''
demo_input = "7\n"

