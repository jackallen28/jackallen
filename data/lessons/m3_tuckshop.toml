text = """
A receipt on the screen disappears when the program stops. Let's **save it to a file** so it lasts.

Every receipt needs its own name, or each sale would write over the last one. The time is perfect for that:

```
from datetime import datetime
stamp = datetime.now().strftime("%Y-%m-%d_%H-%M-%S")
# stamp is now something like 2026-10-18_12-30-05
```

`open(file_name, "w")` makes a new file for **w**riting. `f.write()` puts text in it. Unlike `print()`, `write()` doesn't start a new line by itself, so each line ends with `\\n` (the new-line character).

(We usually put `import` lines at the top of a program. You can move the `from datetime import datetime` line up there if you like.)

**Your task:** fill in the blanks so the file name has the **date and time** in it, and the file has the **GST** in it. Run it, then open your folder in the file manager and find your receipt.
