[[steps]]
title = "A spinning rainbow pattern"
support = "scaffolded"
starter_mode = "replace"
run_mode = "until_stopped"
starter = '''
import turtle

t = turtle.Turtle()
t.speed(0)
t.pensize(2)
turtle.bgcolor("black")

def polygon(sides, size):
    angle = 360 / sides
    for i in range(sides):
        t.forward(size)
        t.left(angle)

colours = ["red", "orange", "yellow", "green", "blue", "purple"]

for i in range(36):
    t.color(colours[i % ___])
    polygon(4, 100)
    t.left(___)

print("Pattern finished!")
turtle.done()
'''
text = """
Here's a trick artists love: draw a shape, turn a little, draw it again... and keep going all the way round.

`range(36)` draws **36 squares**. If the turtle turns **10 degrees** after each one, that's 36 × 10 = 360, one full circle.

To change colour each time, we pick from a **list** of colours. The `%` sign (called **modulo**) gives the *remainder* after dividing. So `i % 6` counts 0, 1, 2, 3, 4, 5, 0, 1, 2... and never runs off the end of the list. `len(colours)` tells you how many colours are in the list.

**Your task:**
1. Fill in the blanks: wrap around the colours list with `%`, and turn 10 degrees after each square.
2. Run it, then experiment! Change the shape in `polygon(4, 100)`, or try `range(72)` with a turn of 5.
"""
hints = [
  "The first blank is how many colours are in the list. The second is how far to turn after each square.",
  "Use `len(colours)` for the first blank (so it still works if you add colours) and `10` for the second.",
  "The two lines are `t.color(colours[i % len(colours)])` and `t.left(10)`.",
]
error_hints = { IndexError = "The list only has 6 colours (positions 0 to 5). Use `i % len(colours)` so the position wraps back to 0.", Terminator = "The turtle window was closed before it finished drawing. Press **Run** again and let it finish." }
success = "Wow! A loop, a function and a list working together. That's real generative art."
demo = '''
import turtle

t = turtle.Turtle()
t.speed(0)
t.pensize(2)
turtle.bgcolor("black")

def polygon(sides, size):
    angle = 360 / sides
    for i in range(sides):
        t.forward(size)
        t.left(angle)

colours = ["red", "orange", "yellow", "green", "blue", "purple"]

for i in range(36):
    t.color(colours[i % len(colours)])
    polygon(4, 100)
    t.left(10)

print("Pattern finished!")
turtle.done()
'''
