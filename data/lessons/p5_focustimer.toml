# ------------------------------------------------------------------ STEP 1
[[steps]]
title = "Count down on the screen"
support = "guided"
starter_mode = "replace"
starter = '''
from time import sleep

SESSION_SECONDS = 12      # a real focus session is 25 * 60

for time_left in range(SESSION_SECONDS, 0, ___):
    minutes = time_left // 60
    seconds = time_left % 60
    print(f"Time left: {minutes}:{seconds:02}")
    sleep(1)

print("Time's up!")
'''
text = """
A timer counts **down**. `range(12, 0, -1)` gives the numbers 12, 11, 10 ... down to 1. The third number is the **step**: `-1` means "go down by one each time".

`SESSION_SECONDS` is in capital letters because it's a **constant**: a setting you choose once, at the top. Change it there and the whole program changes.

To show the time like a clock:
- `time_left // 60` is the whole **minutes** (`//` divides and throws away the leftover)
- `time_left % 60` is the **seconds** left over
- `{seconds:02}` always shows two digits, so 5 seconds shows as `05`

**Your task:** fill in the blank so the loop counts down by one each second. Run it and watch the clock.
"""
hints = [
  "The third number in `range()` is how much to change by each time. You want to go down.",
  "Going down by one is a negative number.",
  "The line is `for time_left in range(SESSION_SECONDS, 0, -1):`",
]
success = "A countdown clock! Try `SESSION_SECONDS = 75` to see the minutes change, then put it back to 12."
demo = '''
