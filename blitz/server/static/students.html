<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Students — Allentronics</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body class="plain">
<header class="masthead">
  <div class="wrap">
    <nav class="nav"><a href="/">Home</a><a href="/blitz">Make a Blitz</a><a href="/index">Index materials</a><a href="/questions">Questions</a></nav>
    <a href="/"><img class="logo" src="/logo.png" alt="Allentronics Education Services"></a>
    <p class="tagline">Students · which questions each student or class has been given.</p>
  </div>
</header>
<div class="wrap">
  <fieldset>
    <legend>Students and classes</legend>
    <div id="list"></div>
    <div class="row" style="margin-top:10px">
      <input id="newname" type="text" placeholder="New student or class name" style="max-width:320px">
      <button id="add" type="button" class="primary">Add</button>
      <span class="spacer" style="flex:1"></span>
      <a id="master" href="/students/files/MASTER.xlsx"><button type="button" class="ghost">Download MASTER.xlsx</button></a>
    </div>
    <p class="hint" id="where"></p>
  </fieldset>

  <fieldset id="detail" hidden>
    <legend id="detail-name"></legend>
    <div class="row">
      <a id="wb" href="#"><button type="button" class="ghost">Download their workbook</button></a>
      <a id="make" href="#"><button type="button" class="primary">Make them a Blitz →</button></a>
    </div>
    <div id="sheets"></div>
  </fieldset>
</div>
<script src="/students.js"></script>
</body>
</html>
