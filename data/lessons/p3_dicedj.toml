from gpiozero import Button, LEDBarGraph
from random import randint, choice
from pipath_computer import open_file
import glob

button = Button(23)
dice = LEDBarGraph(17, 27, 22, 5, 6, 13)
files = glob.glob("party/*")
print("Found", len(files), "files to play")

print("Press the button to roll!")
while True:
    button.wait_for_press()
    roll = randint(1, 6)
    dice.value = roll / 6
    print("You rolled", roll)
    open_file(choice(files))
    button.wait_for_release()      # one roll per press
'''
