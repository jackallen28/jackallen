id = "m3_tuckshop"
title = "Tuckshop Till"
file_name = "tuckshop_till.py"

intro = """
## Run the school tuckshop

Every shop has a **till**: the program that knows the prices, adds up an order and prints a receipt. You're going to build one for your school tuckshop.

Your till will:
- keep the menu and prices in a **dictionary**
- show money properly, like `$4.50` (not `4.5`)
- take an order in a **loop** until the customer types `done`
- print a receipt with the total and the **GST**
- save each receipt to a **file**, and keep a log of every sale in `sales.csv`
- read the log back to show the day's **takings** (all the money made today)

Help gets lighter as you go. By the last step you'll have just a goal, like a real programmer.
"""

outro = """
## Open for business!

You built a real point-of-sale program. You used a **dictionary** to look up prices, a `while` loop to take orders, `if item in menu` to check them, `:.2f` to show money, and **files** to keep receipts and a sales log that lasts after the program stops.

That's how real shops work: every sale goes into a log, and the log is added up at the end of the day.

**Extension ideas:**
- Let customers order more than one of something: ask "How many?" and multiply
- Add a **daily special** that is 50 cents off, or a discount for teachers
- Ask how much cash the customer gave you and work out their **change**
"""

# ------------------------------------------------------------------ STEP 1
[[steps]]
title = "The menu board"
support = "scaffolded"
starter_mode = "replace"
starter = '''
# The tuckshop menu: each item has a price in dollars
menu = {
    "sausage roll": 4.50,
    "salad wrap": 6.00,
    "banana bread": 3.20,
    "juice": 2.50,
    "fruit cup": 3.00,
}

print("====== TUCKSHOP MENU ======")
for item, price in menu.___():
    print(f"{item}: ${price:___}")
'''
text = """
A **dictionary** stores pairs: a **key** and its **value**. Here the key is the food and the value is its price.

```
menu = {"juice": 2.50, "fruit cup": 3.00}
print(menu["juice"])    # prints 2.5
```

Look at that: Python printed `2.5`, not `$2.50`. Money needs **two decimal places**. In an f-string, `:.2f` does that:

```
price = 2.5
print(f"${price:.2f}")    # prints $2.50
```

The `$` is just a normal character. The `{price:.2f}` part shows the price with 2 decimal places.

`menu.items()` gives you each key and value together, so a `for` loop can go through the whole menu.

**Your task:**
1. Fill in the two blanks so the menu prints with proper prices, like `juice: $2.50`.
2. Add **one more item** of your own to the dictionary (a meat pie? a cheese toastie?).
"""
hints = [
  "The first blank is the dictionary method that gives you each key and its value. The second blank is the money format.",
  "The first blank is `items`. The second blank is `.2f` (dot, two, f).",
  "The finished lines are `for item, price in menu.items():` and `print(f\"{item}: ${price:.2f}\")`. To add an item, put a new line inside the `{ }` like `\"meat pie\": 5.00,`",
]
success = "Your menu board looks like a real shop's. Two decimal places, every time."
