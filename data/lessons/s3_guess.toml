# ------------------------------------------------------------------ STEP 3
[[steps]]
title = "Higher or lower?"
support = "scaffolded"
starter_mode = "keep"
text = """
"Nope" isn't a very helpful clue! Let's tell the player whether to go **higher** or **lower**.

`elif` means **"else if"**. It lets you check more than one condition:

```
if temperature > 30:
    print("Hot!")
elif temperature < 10:
    print("Cold!")
else:
    print("Just right")
```

**Your task:** change your `if` so it says:
- `"You got it!"` if the guess is correct
- `"Too low!"` if the guess is **less than** the secret (`<`)
- `"Too high!"` if the guess is **greater than** the secret (`>`)
"""
hints = [
  "You'll need an `if`, then an `elif`, then an `else` (or two `elif`s).",
  "`elif guess < secret:` checks if the guess is too low.",
  "Example:\n```\nif guess == secret:\n    print(\"You got it!\")\nelif guess < secret:\n    print(\"Too low!\")\nelse:\n    print(\"Too high!\")\n```",
]
success = "Now your game gives useful clues."
demo = '''
import random

secret = random.randint(1, 10)
print("Psst... the secret number is", secret)

guess = int(input("Guess my number (1-10): "))

if guess == secret:
    print("You got it!")
elif guess < secret:
    print("Too low!")
else:
    print("Too high!")
'''
demo_input = "7\n"

