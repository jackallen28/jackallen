id = "s3_guess"
title = "Guess My Number"
file_name = "guess_my_number.py"

intro = """
## Build a guessing game

The computer will pick a **secret number** and you'll try to guess it. To build it you'll learn three of the most important ideas in programming:

- **randomness**, using Python's `random` module
- **decisions**, with `if`, `elif` and `else`
- **loops**, with `while`, so the game keeps going until you win

This project gives you **less help** as you go. By the last step you'll write code from just a goal. That's what real programmers do!
"""

outro = """
## You built a real game!

You used `random` to make a secret, `if/elif/else` to make decisions, a `while` loop to keep the game going, and a **counter** to keep score.

You've finished the **Simple** projects. That's a big deal!

**Extension ideas:**
- Let the player choose easy (1-10), medium (1-50) or hard (1-100)
- Give the player only 7 tries, then reveal the number
- Keep the best score in a variable and ask "Play again?"
"""

# ------------------------------------------------------------------ STEP 1
[[steps]]
title = "Pick a secret number"
support = "scaffolded"
starter_mode = "replace"
starter = '''
import random

secret = random.randint(1, 10)
print("Psst... the secret number is", secret)
'''
text = """
`import random` loads Python's **random** module, a toolbox for chance.

`random.randint(1, 10)` picks a whole number from **1 to 10** (both included).

**Your task:** press **Run 3 or 4 times**. Does the secret number change?

(We're printing the secret for now so we can test. We'll hide it later!)
"""
hints = [
  "Just press Run a few times and watch the number in the Output.",
]
success = "A different number (usually) each time. That's randomness."
demo = '''
import random

secret = random.randint(1, 10)
print("Psst... the secret number is", secret)
'''

