# PI & COMPUTER 4: Doorbell Cam. An ultrasonic sensor notices a visitor, rings a bell, takes
# their photo and shows it on the screen. See e1_lightswitch.toml for the GPIO lesson keys.
# Pin plan: distance sensor TRIG 4, ECHO 26 (through a 1kΩ / 2kΩ divider), LED 17, buzzer 18.
# Step by step: test the sensor -> test the camera and the screen -> test the bell (LED + buzzer)
# -> sensor + bell -> snap the visitor -> show the photo -> challenge: cooldown, count and log.

id = "p4_doorbell"
title = "Doorbell Cam"
file_name = "doorbell_cam.py"
requires_gpio = true
requires_camera = true

intro = """
## Who's at the door?

A smart doorbell notices someone coming, rings, takes their photo and shows it on a screen. You can build one with a Pi!

You'll put four parts together, one at a time:
- an **ultrasonic distance sensor** that notices when someone comes close
- the **camera**, and the **screen**: take a photo and open it
- a **bell**: a light and a buzzer
- then join them up: ring, snap and show the visitor

**In the Simulator:** drag the slider under the sensor to bring a visitor closer, and pick what the pretend camera sees on the board (click the camera panel's title to choose a real camera).

**Safety:** the sensor's ECHO pin sends back 5V. It must go through the two resistors (see **Wiring + Safety**). Take the blue HAT off before you change wires, and ask your teacher to check before you put it back on.
"""

outro = """
## Your Doorbell Cam is on duty!

You joined a sensor, a camera, a buzzer and the computer's screen. You used **events**, the photo's **file name** (a return value), a **cooldown** timer and a **log** file. That's a real smart-home gadget.

**How open_file() works:** it runs the Pi's `xdg-open` command, which opens a file with its normal app:

```
import subprocess
subprocess.Popen(["xdg-open", name])
```

**Extension ideas:**
- Only ring at night: check `datetime.now().hour`
- Use your **Teachable Machine** classifier to guess if the visitor is a person or a box
- Keep the five newest photos and delete older ones with `os.remove()`
- Add a "do not disturb" button that turns the bell off but still takes photos
"""

[[wiring]]
part = "Distance sensor (HC-SR04)"
kind = "distance"
pins = [26, 4]
connect = "VCC → 5V (pin 2). GND → GND (pin 6). TRIG → GPIO4 (pin 7). ECHO → 1kΩ resistor → GPIO26 (pin 37), plus a 2kΩ resistor from GPIO26 to GND. The two resistors turn the 5V echo into a safe 3.3V."

[[wiring]]
part = "LED"
kind = "led"
pin = 17
colour = "yellow"
connect = "GPIO17 (pin 11) → 330Ω resistor → LED long leg (+). Short leg (−) → GND rail."

[[wiring]]
part = "Buzzer"
kind = "buzzer"
pin = 18
connect = "An *active* buzzer: + (the longer leg) → GPIO18 (pin 12). − → GND rail."

[[wiring]]
part = "Camera"
connect = "A USB webcam in any USB port, or the Pi camera on its ribbon cable. Plug a USB camera in before you start PiPath. Only fit a ribbon camera when the Pi is shut down: ask your teacher."

