# PI & COMPUTER 6: Control Pad. Three buttons that control the computer, like a macro pad or a
# stream deck: take a screenshot, turn the volume up and down. An LED flashes to say "done".
# See e1_lightswitch.toml for the GPIO lesson keys. Pin plan: buttons 23, 24, 25, LED 17.
# The pipath_computer helpers only print "▶ ..." lines in Watch the goal and the tests
# (take_screenshot also writes a small grey .png), so checks look for those lines.
# Step by step: test the buttons -> test the LED flash -> button 1 takes a screenshot ->
# buttons 2 and 3 change the volume -> a dictionary of actions -> hold for a second action ->
# challenge: a log of every action in controlpad_log.csv.

id = "p6_controlpad"
title = "Control Pad"
file_name = "control_pad.py"
requires_gpio = true

intro = """
## Your own control pad

Streamers and video editors use a **control pad** (a "stream deck" or "macro pad"): a box of buttons where each one makes the computer do a job. In this project you'll build one with three buttons and an LED.

You'll:
- test the three buttons, then the LED, one part at a time
- make button 1 take a **screenshot**
- make buttons 2 and 3 turn the **volume** up and down
- keep all the actions in a **dictionary**, with one function that runs the right one
- **hold** button 1 to open a favourite website
- keep a log of every action in a file

The helpers come from `pipath_computer`: `take_screenshot()`, `change_volume()` and `open_website()`.

**Safety first:** take the blue GPIO HAT off before you change any wires, and put it back on after. Never turn the Pi off, or you'll lose your progress.
"""

outro = """
## You built a Control Pad!

You used `when_pressed` and `when_held`, functions, a **dictionary** that turns a pin number into an action, and a log file. Real control pads, TV remotes and game controllers all work like this: a button press is looked up in a table to find what to do.

**How the helpers work (no magic):** they run the Pi's own commands with `subprocess`. On Raspberry Pi OS, `grim` takes a screenshot and `wpctl` changes the volume:

```
import subprocess
subprocess.run(["grim", "screenshot.png"])
subprocess.run(["wpctl", "set-volume", "@DEFAULT_AUDIO_SINK@", "5%+"])
```

**Extension ideas:**
- Swap the helpers for your own `subprocess.run(...)` lines with `grim` and `wpctl`. Try `wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle` for a mute button
- Give every screenshot its own name with the date and time, so new ones don't replace old ones
- Add a **mode** button: in "music" mode the buttons change the volume, in "photo" mode they take screenshots. Flash the LED once or twice to show the mode
"""

