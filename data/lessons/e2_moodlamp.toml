# ------------------------------------------------------------------ STEP 3
[[steps]]
title = "Button changes the colour"
support = "scaffolded"
starter_mode = "replace"
run_mode = "until_stopped"
starter = '''
from gpiozero import RGBLED, Button
from signal import pause

lamp = RGBLED(red=17, green=27, blue=22)
button = Button(23)

colours = [(1, 0, 0), (1, 0.3, 0), (1, 1, 0), (0, 1, 0), (0, 0, 1), (0.5, 0, 1)]
position = 0

def next_colour():
    global position
    position = position + 1
    lamp.color = colours[position]

lamp.color = colours[position]
button.when_pressed = next_colour
pause()
'''
text = """
Now a button press moves to the next colour in the list.

**Your task:** run it and press the button **lots** of times. Something will go wrong after the last colour. Read the Coach!

Then fix it using **`%` (modulo)**. It gives the *remainder* after dividing, so `6 % 6` is `0`. That's perfect for wrapping back to the start of a list:

```
position = (position + 1) % len(colours)
```
"""
hints = [
  "The list has 6 colours at positions 0 to 5. What happens when position becomes 6?",
  "Use `% len(colours)` so the position wraps back to 0.",
  "Change the middle line of the function to `position = (position + 1) % len(colours)`",
]
error_hints = { IndexError = "Position 6 doesn't exist: the list stops at 5. How could you wrap back to 0? Look at the `%` tip in the step." }
success = "Your lamp cycles forever. `%` is a programmer's favourite trick for wrapping around."

demo = '''
from gpiozero import RGBLED, Button
from signal import pause

lamp = RGBLED(red=17, green=27, blue=22)
button = Button(23)

colours = [(1, 0, 0), (1, 0.3, 0), (1, 1, 0), (0, 1, 0), (0, 0, 1), (0.5, 0, 1)]
position = 0

def next_colour():
    global position
    position = (position + 1) % len(colours)
    lamp.color = colours[position]

lamp.color = colours[position]
button.when_pressed = next_colour
pause()
'''
demo_events = ["1 tap 23 every 0.6 until 5.8"]
demo_seconds = 6.5

[[steps.checks]]
type = "runs_ok"
label = "Your program runs"

[[steps.checks]]
type = "code_regex"
value = '''%\s*len\(\s*colours\s*\)'''
label = "Position wraps around with % len(colours)"

[[steps.checks]]
