# ------------------------------------------------------------------ STEP 6
[[steps]]
title = "Challenge: cooldown and report"
support = "brief"
starter_mode = "keep"
run_mode = "until_stopped"
text = """
Two problems with real alarms: they can go off again and again for the same person, and nobody reads the log.

**Goal 1: a 10-second cooldown.** After the alarm goes off, ignore motion for 10 seconds.
- Keep the time of the last alarm: `last_alarm = 0` at the start
- In `motion()`: if `monotonic() - last_alarm < 10`, do nothing (`return`)
- Otherwise set `last_alarm = monotonic()` and sound the alarm

**Goal 2: a report.** Write `report()`, which reads `motion_log.csv` and prints how many **motion** events happened in each hour, like `09:00  3 events`. Call it after each alarm.

**Tips:**
- `with open("motion_log.csv") as f:` then `for line in f:` reads one line at a time
- `when, event = line.strip().split(",")` splits a line at the comma
- `when[11:13]` is the hour, e.g. `"09"`
- Count with a **dictionary**: `counts[hour] = counts.get(hour, 0) + 1`
"""
hints = [
  "Don't forget `from time import monotonic` and `global last_alarm` inside `motion()`.",
  "Report:\n```\ndef report():\n    counts = {}\n    with open(\"motion_log.csv\") as f:\n        for line in f:\n            when, event = line.strip().split(\",\")\n            if event == \"motion\":\n                counts[when[11:13]] = counts.get(when[11:13], 0) + 1\n    for hour, n in counts.items():\n        print(f\"{hour}:00  {n} events\")\n```",
]
success = "Cooldowns, logs and reports: you've built a real security system. Brilliant work!"
demo = '''
from gpiozero import MotionSensor, LED, Buzzer, Button
from signal import pause
from datetime import datetime
from time import monotonic

pir = MotionSensor(4)
light = LED(17)
buzzer = Buzzer(18)
button = Button(23)
armed = False
last_alarm = -100

def log(event):
    with open("motion_log.csv", "a") as f:
        f.write(f"{datetime.now().isoformat(timespec='seconds')},{event}\n")

def report():
    counts = {}
    with open("motion_log.csv") as f:
        for line in f:
            when, event = line.strip().split(",")
            if event == "motion":
                hour = when[11:13]
                counts[hour] = counts.get(hour, 0) + 1
    for hour, n in counts.items():
        print(f"{hour}:00  {n} events")

def toggle_armed():
    global armed
    armed = not armed
    if armed:
        light.on()
        print("Armed")
        log("armed")
    else:
        light.off()
        print("Disarmed")
        log("disarmed")

def motion():
    global last_alarm
    if not armed:
        return
    if monotonic() - last_alarm < 10:
        print("(cooldown: ignored)")
        return
    last_alarm = monotonic()
    print("Intruder alert!")
    log("motion")
    buzzer.beep(0.1, 0.1, n=5)
    report()

button.when_pressed = toggle_armed
pir.when_motion = motion
print("Press the button to arm the alarm")
pause()
'''
