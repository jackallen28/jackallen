title = "Draw a square"
support = "guided"
starter_mode = "replace"
run_mode = "until_stopped"
starter = '''
import turtle

t = turtle.Turtle()
t.speed(0)          # 0 means "as fast as you can" (good for the Pi)
t.pensize(3)
t.color("teal")

t.forward(100)      # walk 100 steps
t.left(90)          # turn left by 90 degrees (a corner)
t.forward(100)
t.left(___)
t.forward(___)
t.left(90)
t.___(100)
t.left(90)

turtle.done()       # keeps the window open until you close it
'''
text = """
`t = turtle.Turtle()` makes a turtle called `t`. Then:
- `t.forward(100)` walks forward 100 steps, drawing a line
- `t.left(90)` turns left by **90 degrees**. That's a right-angle corner, like the corner of a page.

A square has **4 sides** and **4 corners**, so the turtle needs to walk and turn 4 times.

**Your task:** fill in the three blanks so the turtle draws a whole square, then press **Run**.

A **new window** opens with the turtle in it. Keep your code where you can see it. When you've seen the square, close the turtle window or press **Stop**.
"""
