# ------------------------------------------------------------------ STEP 5
[[steps]]
title = "Challenge: best of 5 and a high score"
support = "brief"
starter_mode = "keep"
text = """
**Goal:** a one-player game of **5 rounds** that remembers the **high score** in a file.

1. Put one round in a function `play_round()` that **returns** the reaction time in ms
2. Play 5 rounds with a `for` loop and keep the times in a **list**
3. Print the best (smallest) time: `min(times)`
4. Read the old high score from `highscore.txt`. The first time, the file won't exist yet, so catch the error:

```
try:
    with open("highscore.txt") as f:
        high_score = int(f.read())
except FileNotFoundError:
    high_score = 9999
```

5. If the best time beats it, print `New high score!` and save it with `open("highscore.txt", "w")`. Otherwise print the high score to beat.
"""
hints = [
  "`times = []`, then in the loop: `times.append(play_round())`.",
  "Saving: `with open(\"highscore.txt\", \"w\") as f:` then (indented) `f.write(str(best))`.",
]
success = "Your game remembers! Files are how programs keep things after they close."
demo = '''
from gpiozero import LED, Button
from time import sleep, monotonic
import random

light = LED(17)
button = Button(23)

def play_round():
    print("Get ready...")
    sleep(random.uniform(2, 5))
    light.on()
    start = monotonic()
    button.wait_for_press()
    light.off()
    ms = round((monotonic() - start) * 1000)
    print(f"{ms} ms")
    sleep(1)
    return ms

times = []
for round_number in range(5):
    print("Round", round_number + 1)
    times.append(play_round())

best = min(times)
print(f"Your best time: {best} ms")

try:
    with open("highscore.txt") as f:
        high_score = int(f.read())
except FileNotFoundError:
    high_score = 9999

if best < high_score:
    print("New high score!")
    with open("highscore.txt", "w") as f:
        f.write(str(best))
else:
    print(f"The high score to beat is {high_score} ms")
'''
demo_events = ["1 tap 23 every 0.8 until 36"]

