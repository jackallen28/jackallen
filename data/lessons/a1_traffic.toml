# ------------------------------------------------------------------ STEP 7
[[steps]]
title = "Challenge: the full crossing"
support = "brief"
starter_mode = "keep"
run_mode = "until_stopped"
text = """
Real crossings count down, so people know how long they have. Then the red figure **flashes** to say "don't start crossing now".

**Goal:**
1. While people cross, count down: print `Walk 5`, `Walk 4` ... `Walk 1`, one second apart, with the beeping on.
2. Then stop the beeping and **flash** the red light 5 times before green comes back.

**Tips:**
- `for n in range(5, 0, -1):` counts 5, 4, 3, 2, 1
- `red.blink(0.2, 0.2, n=5, background=False)` flashes 5 times, then carries on
"""
hints = [
  "Replace `print(\"Walk!\")` and `sleep(4)` with a loop: `for n in range(5, 0, -1):` then (indented) `print(\"Walk\", n)` and `sleep(1)`.",
  "After `buzzer.off()`, flash the red light: `red.blink(0.2, 0.2, n=5, background=False)`.",
]
success = "A complete pedestrian crossing, built one part at a time. Brilliant work!"
demo = '''
from gpiozero import LED, Button, Buzzer
from time import sleep

red = LED(17)
amber = LED(27)
green = LED(22)
button = Button(23)
buzzer = Buzzer(18)

def cycle():
    """Amber, then red with a countdown while people cross, then flashing red."""
    amber.on()
    sleep(2)
    amber.off()
    red.on()
    buzzer.beep(0.1, 0.1)          # tick-tick-tick while people cross
    for n in range(5, 0, -1):      # 5, 4, 3, 2, 1
        print("Walk", n)
        sleep(1)
    buzzer.off()
    red.blink(0.2, 0.2, n=5, background=False)   # flashing red: don't start crossing now
    red.off()

while True:
    green.on()              # cars can go until someone presses the button
    print("Press the button to cross")
    button.wait_for_press()
    green.off()
    cycle()
'''
demo_events = ["1.5 tap 23"]
demo_seconds = 12

