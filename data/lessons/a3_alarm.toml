title = "Keep a log"
support = "brief"
starter_mode = "keep"
run_mode = "until_stopped"
text = """
Security systems keep a **log**: a record of every event and when it happened. We'll save ours as a **CSV** file (comma-separated values), which any spreadsheet can open.

**Goal:** every time the alarm is armed, disarmed or set off, add one line to `motion_log.csv`, like this:

```
2026-10-16T09:41:07,motion
```

**Tips:**

```
from datetime import datetime

def log(event):
    with open("motion_log.csv", "a") as f:
        f.write(f"{datetime.now().isoformat(timespec='seconds')},{event}\\n")
```

- `"a"` means **append**: add to the end of the file instead of starting again
- `\\n` starts a new line
- Call `log("motion")`, `log("armed")` and `log("disarmed")` in the right places

Find the file in your PiPath folder afterwards and open it in a spreadsheet!
"""
hints = [
  "Copy the `log` function from the tips, and put `from datetime import datetime` at the top.",
  "Call `log(\"motion\")` inside the `if armed:` part of `motion()`. Call `log(\"armed\")` / `log(\"disarmed\")` in `toggle_armed()`.",
]
error_hints = { NameError = "Did you add `from datetime import datetime` at the top?" }
success = "Your alarm keeps records. That's called data logging."
demo = '''
from gpiozero import MotionSensor, LED, Buzzer, Button
from signal import pause
from datetime import datetime

pir = MotionSensor(4)
light = LED(17)
buzzer = Buzzer(18)
button = Button(23)
armed = False

def log(event):
    with open("motion_log.csv", "a") as f:
        f.write(f"{datetime.now().isoformat(timespec='seconds')},{event}\n")
    print("Logged:", event)

def toggle_armed():
    global armed
    armed = not armed
    if armed:
        light.on()
        log("armed")
    else:
        light.off()
        log("disarmed")

def motion():
    if armed:
        print("Intruder alert!")
        log("motion")
        buzzer.beep(0.1, 0.1, n=5)

button.when_pressed = toggle_armed
pir.when_motion = motion
print("Press the button to arm the alarm")
pause()
'''
