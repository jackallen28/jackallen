# ------------------------------------------------------------------ STEP 4
[[steps]]
title = "Two-player race"
support = "brief"
starter_mode = "keep"
text = """
**Goal:** two players, two buttons. When the light comes on, the **first** to press wins.

`wait_for_press()` can only watch one button, so use **events** instead:

```
player1.when_pressed = player1_pressed
player2.when_pressed = player2_pressed
```

**Tips:**
- Make a variable `winner = None` (None means "nobody yet")
- Each player's function sets `winner` to their name, but **only if** `winner is None`. You'll need `global winner` inside each function.
- Set up the `when_pressed` events **after** the light comes on, so early presses don't count
- Then wait until someone wins: `while winner is None:` with `sleep(0.01)` inside
- Print who won, like `Player 2 wins!`
"""
hints = [
  "Player 2's button is `Button(24)`.",
  "A player's function:\n```\ndef player1_pressed():\n    global winner\n    if winner is None:\n        winner = \"Player 1\"\n```",
]
success = "A real two-player game. Events let your program watch two things at once."
demo = '''
from gpiozero import LED, Button
from time import sleep, monotonic
import random

light = LED(17)
player1 = Button(23)
player2 = Button(24)
winner = None

def player1_pressed():
    global winner
    if winner is None:
        winner = "Player 1"

def player2_pressed():
    global winner
    if winner is None:
        winner = "Player 2"

print("Both players: get ready...")
sleep(random.uniform(2, 5))
light.on()
start = monotonic()
player1.when_pressed = player1_pressed
player2.when_pressed = player2_pressed

while winner is None:
    sleep(0.01)

light.off()
print(f"{winner} wins in {round((monotonic() - start) * 1000)} ms!")
'''
demo_events = ["5.8 tap 24"]

