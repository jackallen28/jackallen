from gpiozero import LED, Button
from time import sleep, monotonic
import random

moles = [LED(17), LED(27), LED(22)]               # left, middle, right
buttons = [Button(23), Button(24), Button(25)]

def which_button(timeout):
    """Wait up to timeout seconds for a button. Return 0, 1 or 2, or None if too slow."""
    start = monotonic()
    while monotonic() - start < ___:
        for number in range(3):
            if buttons[number].is_pressed:
                buttons[number].wait_for_release()
                return number
        sleep(0.01)
    return ___

for i in range(3):
    print("Quick! Press a button...")
    choice = which_button(3)
    if choice is None:
        print("Too slow!")
    else:
        print("You pressed button", choice)
'''
text = """
In the game, a mole only stays up for a short time. So we need a **function** that waits for **any** button, but **not forever**.

`which_button(timeout)` checks all three buttons, again and again, 100 times a second. `monotonic()` is the Pi's stopwatch: `monotonic() - start` is how many seconds have gone by.

- A button is pressed? `return` its number (0, 1 or 2).
- Time's up? `return None`. `None` is Python's way of saying *nothing*.

**Your task:** fill in the two blanks:
1. Keep checking while the time gone by is less than `timeout`
2. When time's up, return `None`

Run it and play 3 times. Press a button quickly once, and once don't press anything at all.

**Watch out:** we check `if choice is None`, not `if not choice`. Why? To Python, `0` counts as "nothing" too, so the left button would look like "too slow"!
"""
