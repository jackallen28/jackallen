# ELECTRONICS LAB 4. See e1_lightswitch.toml for the GPIO lesson keys.

id = "e4_dice"
title = "Bar Graph & Digital Dice"
file_name = "led_dice.py"
requires_gpio = true

intro = """
## Six LEDs, lots of ideas

A row of LEDs can show a **level** (like a volume meter), a **count**, or an **animation**.

In this project you will:
- control six LEDs at once with `LEDBoard`
- make a scanning light animation
- build an up/down **counter** with limits
- turn it all into an electronic **dice**, and then make it **shakeable**!

This project needs a fair bit of wiring. Build it neatly and test each LED as you go.
"""

outro = """
## Your LED dice is ready to roll!

You used `LEDBoard` and `LEDBarGraph`, built animations with loops, kept a counter inside limits, and discovered that **any switch is a button**.

**Extension ideas:**
- Two-player mode: take turns rolling and keep score
- Show the roll as a dice face pattern instead of a bar
- Use a reed switch and a magnet to make a "secret door" alarm
"""

[[wiring]]
part = "6 LEDs (left to right)"
connect = "GPIO17, GPIO27, GPIO22, GPIO5, GPIO6, GPIO13 → each through its own 330Ω resistor → LED long leg. All short legs → GND rail."

[[wiring]]
part = "LED 1"
kind = "led"
pin = 17
colour = "green"
connect = "GPIO17 (pin 11)"

[[wiring]]
part = "LED 2"
kind = "led"
pin = 27
colour = "green"
connect = "GPIO27 (pin 13)"

[[wiring]]
part = "LED 3"
kind = "led"
pin = 22
colour = "amber"
connect = "GPIO22 (pin 15)"

[[wiring]]
part = "LED 4"
kind = "led"
pin = 5
colour = "amber"
connect = "GPIO5 (pin 29)"

[[wiring]]
part = "LED 5"
kind = "led"
pin = 6
colour = "red"
connect = "GPIO6 (pin 31)"

[[wiring]]
part = "LED 6"
kind = "led"
pin = 13
colour = "red"
connect = "GPIO13 (pin 33)"

[[wiring]]
