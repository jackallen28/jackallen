# ------------------------------------------------------------------ STEP 4
[[steps]]
title = "Which button?"
support = "scaffolded"
starter_mode = "keep"
text = """
To check the player's answer we need a function that **waits for any button** and **returns** which one was pressed.

```
def get_press():
    while True:
        for number in range(3):
            if buttons[number].is_pressed:
                flash(number)          # light it up as feedback
                return number          # send the answer back
        sleep(0.01)                    # rest a moment so the Pi stays cool
```

`return` sends a value back to whoever called the function, like `choice = get_press()`.

**Your task:** add `get_press()` under your `flash` function. Then at the bottom of your program, loop through the pattern and check each press:

- if the press matches, keep going
- if not, print `"Wrong! Game over"` and stop with `break`

If they get them all, print `"You win!"`.
"""
hints = [
  "After flashing the pattern: `for number in pattern:` then `choice = get_press()`.",
  "Compare with `if choice != number:`, then print the game-over message and `break`.",
  "Example:\n```\nfor number in pattern:\n    choice = get_press()\n    if choice != number:\n        print(\"Wrong! Game over\")\n        break\nelse:\n    print(\"You win!\")\n```\n(A `for` loop's `else` runs only if the loop didn't `break`.)",
]
success = "Your game checks the player's memory. Functions that return values are a big step!"

[[steps.checks]]
type = "runs_ok"
label = "Your program runs"

[[steps.checks]]
type = "code_uses"
value = "node:Return"
label = "Your get_press() function returns a value"

[[steps.checks]]
type = "code_uses"
value = "node:Break"
label = "A wrong press ends the round"

[[steps.checks]]
type = "output_regex"
value = '''You win|Game over'''
