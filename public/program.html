<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Program</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="/"><span class="brand-logo" aria-hidden="true"></span><span data-site-name>Program Bookings</span></a>
      <nav class="site-nav" aria-label="Main">
        <a href="/">Programs</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <p class="breadcrumb"><a href="/">← All programs</a></p>
    <div id="page"><p class="muted">Loading…</p></div>
  </main>

  <template id="program-template">
    <h1 id="program-name"></h1>
    <div class="program-layout">
      <aside>
        <div class="card">
          <ul class="facts-list" id="program-facts"></ul>
        </div>
      </aside>

      <div>
        <section class="card step" aria-labelledby="step1">
          <h2 class="step-title" id="step1"><span class="step-number">1</span> How many classes?</h2>
          <div class="inline-field">
            <label for="classes">Number of classes</label>
            <select id="classes" class="input"></select>
          </div>
        </section>

        <section class="card step" aria-labelledby="step2">
          <h2 class="step-title" id="step2"><span class="step-number">2</span> Choose a date</h2>
          <div id="calendar-message" role="status" aria-live="polite" hidden></div>
          <div class="legend" aria-hidden="true">
            <span><span class="swatch ok"></span> Available</span>
            <span><span class="swatch no"></span> Unavailable</span>
          </div>
          <div id="calendar"></div>
          <h3 class="small" style="margin-top:16px">Next available dates</h3>
          <div class="next-dates" id="next-dates"><span class="muted small">Loading…</span></div>
        </section>

        <section class="card step" aria-labelledby="step3" id="slot-section" hidden>
          <h2 class="step-title" id="step3"><span class="step-number">3</span> <span id="slot-heading">Choose a time</span></h2>
          <ul class="slot-list" id="slots"></ul>
        </section>

        <section class="card step" aria-labelledby="step4" id="form-section" hidden>
          <h2 class="step-title" id="step4"><span class="step-number">4</span> Your details</h2>
          <p id="booking-summary" class="notice"></p>
          <div id="form-message" role="alert" hidden></div>
          <form id="booking-form" novalidate>
            <div class="form-grid">
              <div class="field full">
                <label for="school">School <span class="required" aria-hidden="true">*</span></label>
                <input id="school" name="school" autocomplete="organization" required aria-describedby="school-error">
                <span class="error" id="school-error"></span>
              </div>
              <div class="field">
                <label for="contactName">Contact name <span class="required" aria-hidden="true">*</span></label>
                <input id="contactName" name="contactName" autocomplete="name" required aria-describedby="contactName-error">
                <span class="error" id="contactName-error"></span>
              </div>
              <div class="field">
                <label for="yearLevel">Year level <span class="required" aria-hidden="true">*</span></label>
                <input id="yearLevel" name="yearLevel" required placeholder="e.g. Year 8" aria-describedby="yearLevel-error">
                <span class="error" id="yearLevel-error"></span>
              </div>
              <div class="field">
                <label for="email">Email <span class="required" aria-hidden="true">*</span></label>
                <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error">
                <span class="error" id="email-error"></span>
              </div>
              <div class="field">
                <label for="phone">Phone <span class="required" aria-hidden="true">*</span></label>
                <input id="phone" name="phone" type="tel" autocomplete="tel" required aria-describedby="phone-error">
                <span class="error" id="phone-error"></span>
              </div>
              <div class="field full">
                <label for="notes">Notes <span class="muted small">(optional)</span></label>
                <textarea id="notes" name="notes" aria-describedby="notes-hint notes-error"></textarea>
                <span class="hint" id="notes-hint">Anything we should know — e.g. accessibility needs, arrival time.</span>
                <span class="error" id="notes-error"></span>
              </div>
              <div class="honeypot" aria-hidden="true">
                <label for="website">Leave this empty</label>
                <input id="website" name="website" tabindex="-1" autocomplete="off">
              </div>
            </div>
            <p class="privacy">
              <strong>Privacy:</strong> we only collect what we need to run your booking — your school, a contact name,
              email and phone, and the year level. These details are seen only by our program staff and are not shared.
            </p>
            <button class="button" type="submit" id="submit-button">Confirm booking</button>
          </form>
        </section>
      </div>
    </div>
  </template>

  <footer class="site-footer">
    <a href="/admin">Staff login</a>
  </footer>

  <script src="/vendor/fullcalendar/index.global.min.js"></script>
  <script type="module" src="/js/program.js"></script>
</body>
</html>
