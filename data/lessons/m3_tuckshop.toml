text = """
Time for the **receipt**. The loop goes through the order, prints each item and adds its price to a running `total`.

**GST** (Goods and Services Tax) is a 10% tax on most things you buy in Australia. Shop prices **already include** the GST, so the receipt shows how much of the total was GST.

Here's the trick: if the price *with* GST is 110%, then the GST part is 10 out of 110, which is **1/11** of the total.

```
total = 11.00
gst = total / 11    # 1.0, so $1.00 of it is GST
```

(Watch out: `total * 0.1` would be wrong, because that's 10% of a price that already has GST in it.)

**Your task:** fill in the blanks so the receipt adds up each **price** and works out the **GST**. Run it, order a few things and check the maths.
"""
hints = [
