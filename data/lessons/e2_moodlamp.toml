label = "I can press past the last colour and it goes back to red"

# ------------------------------------------------------------------ STEP 4
[[steps]]
title = "Secret party mode"
support = "brief"
starter_mode = "keep"
run_mode = "until_stopped"
text = """
Buttons can tell a **short press** from a **long press**. `when_held` runs when the button is held down (1 second by default).

**Goal:** holding the button switches to **party mode**, where the lamp flashes random colours. A normal press goes back to cycling colours.

**Tips:**
- `random.random()` gives a random number between 0 and 1, perfect for each part of a colour
- `lamp.blink(on_time=0.2, off_time=0.1, on_color=..., n=10)` flashes a colour 10 times. Look it up or experiment!
"""
hints = [
  "Write a new function `party()` and set `button.when_held = party`.",
  "A random colour: `(random.random(), random.random(), random.random())`. Don't forget `import random` and `from time import sleep` at the top.",
  "Example:\n```\ndef party():\n    for i in range(20):\n        lamp.color = (random.random(), random.random(), random.random())\n        sleep(0.1)\n\nbutton.when_held = party\n```",
]
success = "Party mode unlocked! Two behaviours from one button."

demo = '''
from gpiozero import RGBLED, Button
from signal import pause
from time import sleep
import random

lamp = RGBLED(red=17, green=27, blue=22)
button = Button(23)

colours = [(1, 0, 0), (1, 0.3, 0), (1, 1, 0), (0, 1, 0), (0, 0, 1), (0.5, 0, 1)]
position = 0

def next_colour():
    global position
    position = (position + 1) % len(colours)
    lamp.color = colours[position]

def party():
    print("Party mode!")
    for i in range(20):
        lamp.color = (random.random(), random.random(), random.random())
        sleep(0.1)
    lamp.color = colours[position]

lamp.color = colours[position]
button.when_pressed = next_colour
button.when_held = party
pause()
'''
demo_events = ["1 tap 23", "2 tap 23", "3 press 23", "5 release 23"]
demo_seconds = 7

[[steps.checks]]
type = "runs_ok"
label = "Your program runs"

[[steps.checks]]
type = "code_uses"
value = "attr:when_held"
label = "You use when_held for a long press"

[[steps.checks]]
type = "code_uses"
value = "import:random"
label = "You use random colours"

[[steps.checks]]
type = "confirm"
label = "Holding the button starts party mode"

