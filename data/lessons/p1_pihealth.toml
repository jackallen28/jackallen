# ------------------------------------------------------------------ STEP 6
[[steps]]
title = "Live lights"
support = "scaffolded"
starter_mode = "replace"
run_mode = "until_stopped"
starter = '''
from gpiozero import PWMLED
from pipath_computer import cpu_temp, cpu_load, ram_used
from time import sleep

temp_led = PWMLED(17)
cpu_led = PWMLED(27)
ram_led = PWMLED(22)

while True:
    temp = cpu_temp()
    load = cpu_load()
    ram = ram_used()

    # 30 °C or less = off, 80 °C or more = full
    temp_led.value = min(1, max(0, (temp - 30) / 50))
    cpu_led.value = load / 100
    ram_led.value = ___

    print(f"{temp} °C   CPU {load} %   RAM {ram} %")
    sleep(0.5)
'''
text = """
Time to join the numbers to the lights. An LED's `value` goes from 0 to 1, but the Pi's numbers go from 0 to 100. Divide by 100 to change one into the other: 50 % becomes 0.5.

The temperature is different: it never gets near 0 °C. So 30 °C is "off" and 80 °C is "full". `min(1, max(0, ...))` keeps the answer between 0 and 1.

**Your task:** fill in the blank so the RAM LED shows how much memory is used. Run it, then open the web browser and watch the CPU light glow brighter. Press **Stop** when you've seen it.
"""
hints = [
  "Look at how the CPU LED does it.",
  "Divide the RAM number by 100.",
  "The line is `ram_led.value = ram / 100`",
]
success = "Live lights! Your Pi now shows how it feels without a screen."
