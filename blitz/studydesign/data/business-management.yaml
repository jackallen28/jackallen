subject_id: business-management
subject_name: VCE Business Management
accreditation: ""        # set by the importer from the PDF cover page
source: "DRAFT — not yet imported from the VCAA study design"

units:
  - id: bm-u3
    number: 3
    title: Managing a business
    areas_of_study:
      - number: 1
        title: Business foundations
        outcome: >-
          On completion of this unit the student should be able to discuss the
          key characteristics of businesses and stakeholders, and analyse the
          relationship between corporate culture, management styles and
          management skills.
        key_knowledge:
          - text: characteristics of businesses, including sole traders, partnerships, private limited companies, public listed companies, social enterprises and government business enterprises
            label: Types of businesses
          - text: business objectives, including to make a profit, to increase market share, to fulfil a market need, to fulfil a social need and to meet shareholder expectations
            label: Business objectives
          - text: characteristics of stakeholders of businesses, including their interests and potential conflicts between stakeholders
            label: Stakeholders
          - text: corporate social responsibility considerations when dealing with stakeholders
            label: CSR and stakeholders
          - text: management styles, including autocratic, persuasive, consultative, participative and laissez-faire
            label: Management styles
          - text: the appropriateness of management styles in relation to the nature of the task, time, experience of employees and manager preference
            label: Choosing a style
          - text: management skills, including communication, delegation, planning, leading, decision-making, interpersonal and emotional intelligence
            label: Management skills
          - text: the relationship between management styles and management skills
            label: Styles and skills
          - text: corporate culture, both official and real, and strategies for its development
            label: Corporate culture
      - number: 2
        title: Managing employees
        outcome: >-
          On completion of this unit the student should be able to explain
          theories of motivation and apply them to a range of contexts, and
          analyse and evaluate strategies related to the management of employees.
        key_knowledge:
          - text: the relationship between managing employees and business objectives
            label: Employees and objectives
          - text: "motivation theories: Maslow's Hierarchy of Needs, Locke and Latham's Goal Setting Theory and Lawrence and Nohria's Four Drive Theory"
            label: Motivation theories
          - text: "motivation strategies: performance-related pay, career advancement, investment in training, support and sanction"
            label: Motivation strategies
          - text: the advantages and disadvantages of motivation strategies and their effect on short- and long-term employee motivation
            label: Evaluating motivation strategies
          - text: "training options: on-the-job and off-the-job training"
            label: Training options
          - text: "performance management strategies: management by objectives, appraisals, self-evaluation and employee observation"
            label: Performance management
          - text: "termination management: retirement, redundancy, resignation and dismissal, including entitlement and transition considerations"
            label: Termination management
          - text: the relationship between the management of employees and corporate culture, business objectives and business performance
            label: Employees and performance
          - text: "the roles of participants in the workplace relations process: human resource managers, employees, employer associations, unions and the Fair Work Commission"
            label: Workplace relations participants
          - text: "awards and agreements as methods of determining wages and conditions"
            label: Awards and agreements
          - text: "dispute resolution: mediation and arbitration"
            label: Dispute resolution
      - number: 3
        title: Operations management
        outcome: >-
          On completion of this unit the student should be able to analyse the
          relationship between business objectives and operations management,
          and propose and evaluate strategies to improve the efficiency and
          effectiveness of business operations.
        key_knowledge:
          - text: the relationship between operations management and business objectives
            label: Operations and objectives
          - text: "key elements of an operations system: inputs, processes and outputs"
            label: Operations system
          - text: the characteristics of operations management within both manufacturing and service businesses
            label: Manufacturing vs service
          - text: "technological developments: automated production lines, robotics, computer-aided design, computer-aided manufacturing, artificial intelligence, online services and website development"
            label: Technological developments
          - text: "materials management strategies: forecasting, master production schedule, materials requirement planning and Just In Time"
            label: Materials management
          - text: "quality management strategies: quality control, quality assurance and Total Quality Management"
            label: Quality management
          - text: "waste minimisation strategies: the reduction of the overuse of resources and the reduction, reuse and recycling of end-of-life products"
            label: Waste minimisation
          - text: "lean management: pull, one-piece flow, takt time and zero defects"
            label: Lean management
          - text: "global considerations: global sourcing of inputs, overseas manufacture and global outsourcing"
            label: Global considerations
          - text: corporate social responsibility considerations in operations management
            label: CSR in operations
  - id: bm-u4
    number: 4
    title: Transforming a business
    areas_of_study:
      - number: 1
        title: Reviewing performance — the need for change
        outcome: >-
          On completion of this unit the student should be able to explain the
          way business change may come about, use key performance indicators to
          analyse the performance of a business, discuss the driving and
          restraining forces for change and evaluate management strategies to
          position a business for the future.
        key_knowledge:
          - text: "business change, including proactive and reactive approaches to change"
            label: Business change
          - text: "key performance indicators as sources of data to analyse the performance of businesses: percentage of market share, net profit figures, rate of productivity growth, number of sales, rates of staff absenteeism, level of staff turnover, level of wastage, number of customer complaints and number of workplace accidents"
            label: Key performance indicators
          - text: "Force Field Analysis theory (Lewin), including weighting, ranking and evaluation of the forces for and against change"
            label: Force Field Analysis
          - text: "driving forces for change: owners, managers, employees, competitors, legislation, pursuit of profit, reduction of costs, globalisation, technology, innovation and societal attitudes"
            label: Driving forces
          - text: "restraining forces for change: managers, employees, time, organisational inertia, legislation and financial considerations"
            label: Restraining forces
          - text: "the principles of the Learning Organisation (Senge): systems thinking, personal mastery, mental models, shared vision and team learning"
            label: Learning Organisation
          - text: "management strategies to respond to key performance indicators: staff training, staff motivation, change in management styles or management skills, increased investment in technology, improving quality in production, cost cutting, initiating lean production techniques and redeployment of resources"
            label: Strategies to respond to KPIs
          - text: "Porter's Generic Strategies (lower cost and differentiation) to enhance business competitiveness"
            label: Porter's Generic Strategies
      - number: 2
        title: Implementing change
        outcome: >-
          On completion of this unit the student should be able to evaluate the
          effectiveness of strategies used to implement change and discuss the
          effect of change on stakeholders, using a contemporary business case
          study.
        key_knowledge:
          - text: "the importance of leadership in change management"
            label: Leadership in change
          - text: "management strategies to seek new business opportunities both domestically and globally"
            label: New opportunities
          - text: "the effect of change on stakeholders, including managers, employees, customers, suppliers, the general community and society"
            label: Effect on stakeholders
          - text: "corporate social responsibility considerations when implementing change"
            label: CSR and change
          - text: "the importance of reviewing key performance indicators to evaluate the effectiveness of business transformation"
            label: Reviewing KPIs
          - text: "a contemporary business case study from the last four years to evaluate business transformation"
            label: Contemporary case study

# Question formats available on a Business Management sheet. Weights are a
# rough share of one page and are calibrated in blitz/render/layout.py.
question_types:
  - id: bm-mc
    label: Multiple choice
    description: Four-option recall and application questions.
    typical_marks: [1]
    default_weight: 0.30
  - id: bm-short
    label: Short answer
    description: One to three mark definition, identification and explanation questions.
    typical_marks: [1, 2, 3]
    default_weight: 0.55
  - id: bm-case-study
    label: Case study response
    description: Questions attached to a business scenario, answered with reference to it.
    typical_marks: [2, 3, 4, 5, 6]
    default_weight: 1.10
  - id: bm-extended
    label: Extended response
    description: Six to ten mark discuss, analyse or evaluate questions requiring a judgement.
    typical_marks: [6, 8, 10]
    default_weight: 1.60
  - id: bm-theory-application
    label: Theory application
    description: Apply a named theory (Maslow, Lewin, Senge, Porter) to a given situation.
    typical_marks: [3, 4, 6]
    default_weight: 1.00
  - id: bm-definition
    label: Key term drill
    description: Rapid-fire definitions of the subject's examinable terminology.
    typical_marks: [1, 2]
    default_weight: 0.25

# Command terms drive the "what is this question actually asking for" hints
# printed beside extended responses.
command_terms:
  identify: Name or state — no explanation required.
  outline: Give the main features briefly, more than naming but less than explaining.
  describe: Give a detailed account of the characteristics or features.
  explain: Make the relationship or reason clear — say why or how.
  distinguish: Set out the differences between two things, using a connective such as "whereas".
  compare: Set out both similarities and differences.
  analyse: Break the topic into parts and show how they relate to one another and to the business.
  discuss: Present both sides or a range of viewpoints, then reach a position.
  evaluate: Weigh strengths against weaknesses and state a clear, justified judgement.
  justify: Give reasons that support a decision or conclusion.
  propose: Put forward a strategy or course of action for consideration.
