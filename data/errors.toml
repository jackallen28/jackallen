  "USB: unplug the camera and plug it back in. Ribbon: ask your teacher to check the cable. Don't turn the Pi off yourself: you'd lose your progress.",
  "No camera today? Switch the camera panel to **Simulated** and use the pretend camera.",
]

[[error]]
