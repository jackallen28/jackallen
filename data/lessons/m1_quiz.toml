# ------------------------------------------------------------------ STEP 3
[[steps]]
title = "Bug hunt: canberra is wrong?!"
support = "scaffolded"
starter_mode = "keep"
text = """
Your quiz has a sneaky bug. Let's find it.

**Your task:**
1. **Run** your quiz. For the first question, type `canberra` with a small **c**. Is it marked right?
2. Fix the bug so **messy answers still count**: small letters, CAPITALS, or extra spaces at the start or end.
3. Run it again with messy answers, like ` CANBERRA ` and `Platypus`, and get full marks.

**Why it happens:** Python compares text **letter by letter**. To a computer, `"C"` and `"c"` are different letters, and a space is a letter too. So `"canberra" == "Canberra"` is **False**.

Two string methods clean up text before you compare it:

```
reply = "  CanBERra "
print(reply.strip())            # "CanBERra"  (spaces gone)
print(reply.strip().lower())    # "canberra"  (spaces gone, all small letters)
```

Clean up **both** sides of the `==`, so it doesn't matter how the answer in your list is written either.
"""
hints = [
  "Find the line that compares the player's reply with the answer. That's where the bug is.",
  "Use `.strip()` to remove spaces and `.lower()` to make everything small letters. Do it to the reply **and** to the answer.",
  "The line should read `if reply.strip().lower() == a.strip().lower():`",
]
success = "Bug squashed! Cleaning up input before you use it is called **normalising**, and real apps do it all the time."
demo = '''
# Quiz Master
questions = [
    "What is the capital of Australia? ",
    "Which Aussie animal lays eggs: platypus or wombat? ",
    "How many points is a goal worth in AFL? ",
    "Which planet is closest to the Sun? ",
    "Which bird is on the coat of arms with the kangaroo? ",
]
answers = ["Canberra", "platypus", "6", "Mercury", "emu"]

score = 0

for q, a in zip(questions, answers):
    reply = input(q)
    if reply.strip().lower() == a.strip().lower():
        print("Correct!")
        score += 1
    else:
        print(f"Not quite. The answer is {a}.")

print(f"Score: {score} out of {len(questions)}")
'''
