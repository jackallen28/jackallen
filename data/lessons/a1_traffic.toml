title = "The pedestrian button"
support = "scaffolded"
starter_mode = "keep"
run_mode = "until_stopped"
text = """
At a pedestrian crossing, the lights stay **green for cars** until someone presses the button. Then they change so people can cross.

`button.wait_for_press()` makes the program **wait** right there until the button is pressed.

**Your task:**
1. Add `Button` to your import line: `from gpiozero import LED, Button`
2. Make a button on GPIO23: `button = Button(23)`
3. Change your loop so it goes like this:

```
while True:
    green.on()
    print("Press the button to cross")
    button.wait_for_press()
    green.off()
    cycle()
```

4. Take the green part **out** of `cycle()`, so `cycle()` is just amber then red. While the light is red, print `Walk!`

Run it. *Simulator:* click and hold the button on the board. *Real Pi:* press your real button.
"""
