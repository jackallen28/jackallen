# ------------------------------------------------------------------ STEP 2
[[steps]]
title = "Match buttons to lights"
support = "scaffolded"
starter_mode = "replace"
run_mode = "until_stopped"
starter = '''
from gpiozero import LED, Button
from signal import pause

leds = [LED(17), LED(27), LED(22)]
buttons = [Button(23), Button(24), Button(25)]

for led, button in zip(leds, buttons):
    button.when_pressed = led.on
    button.when_released = led.off

pause()
'''
text = """
`zip()` pairs up two lists like a zipper: the first LED with the first button, the second with the second, and so on.

**Your task:** run it and test each button. Each one should light **its own** LED while you hold it.

If a button lights the wrong LED, it's a wiring mix-up. Swap the wires or swap the numbers in the list.
"""
hints = [
  "Press each button one at a time and watch which LED lights.",
  "If red and green are swapped, swap `Button(23)` and `Button(24)` in the list.",
]
success = "Three inputs, three outputs, three lines of code."

[[steps.checks]]
