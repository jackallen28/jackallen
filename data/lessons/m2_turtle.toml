  "Start from your spinning pattern and change one thing at a time: the shape, the size, how far it turns.",
  "Move without drawing: `t.penup()`, `t.goto(0, -150)`, `t.pendown()`. Use this to draw a stem or start in a new spot.",
]
error_hints = { Terminator = "The turtle window was closed before it finished drawing. Press **Run** again and let it finish." }
