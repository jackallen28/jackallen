import random

moles = [LED(17), LED(27), LED(22)]               # left, middle, right
buttons = [Button(23), Button(24), Button(25)]
buzzer = Buzzer(18)

def which_button(timeout):
    """Wait up to timeout seconds for a button. Return 0, 1 or 2, or None if too slow."""
    start = monotonic()
    while monotonic() - start < timeout:
        for number in range(3):
            if buttons[number].is_pressed:
                buttons[number].wait_for_release()
                return number
        sleep(0.01)
    return None

try:
    with open("highscore.txt") as file:
        best = int(file.read())
except (FileNotFoundError, ValueError):
    best = 0
print("High score to beat:", best)

score = 0
misses = 0
time_allowed = 2.0
while misses < 3:
    print(f"Lives: {3 - misses}   Time: {time_allowed:.1f} seconds")
    mole = random.randint(0, 2)
    moles[mole].on()
    choice = which_button(time_allowed)
    moles[mole].off()
    if choice == mole:
        print("Hit!")
        score = score + 1
        buzzer.beep(on_time=0.1, n=1)
        time_allowed = max(0.5, time_allowed - 0.2)
    else:
        misses = misses + 1
        if choice is None:
            print("Too slow!")
        else:
            print("Miss!")
    sleep(0.5)

print("Game over! Score:", score)
if score > best:
    print("New high score!")
    with open("highscore.txt", "w") as file:
        file.write(str(score))
else:
    print("The high score is still", best)
'''
