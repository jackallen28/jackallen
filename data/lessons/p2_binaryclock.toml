# ------------------------------------------------------------------ STEP 7
[[steps]]
title = "Challenge: seconds, minutes, hours"
support = "brief"
starter_mode = "replace"
run_mode = "until_stopped"
starter = '''
from gpiozero import LEDBoard, Button
from datetime import datetime
from time import sleep

lights = LEDBoard(17, 27, 22, 5, 6, 13)
button = Button(23)
mode = "seconds"

# Goal: each press switches seconds -> minutes -> hours -> seconds,
# and prints which one it's showing.

while True:
    now = datetime.now()
    bits = format(now.second, "06b")
    lights.value = tuple(int(b) for b in bits)
    sleep(0.2)
'''
text = """
**Goal:** each press of the button switches the clock to the next **mode**: seconds → minutes → hours → back to seconds. Print which one it's showing each time, like `Showing minutes`.

Tips:
- write a function that changes `mode`, and give it to `button.when_pressed` (no brackets!)
- a function that changes a variable from outside it needs `global mode` as its first line
- in the loop, pick `now.second`, `now.minute` or `now.hour` depending on `mode`
"""
hints = [
  "`def next_mode():` then `global mode`, then `if mode == \"seconds\": mode = \"minutes\"` and so on with `elif`.",
  "In the loop: `number = now.second`, then `if mode == \"minutes\": number = now.minute`, and the same for hours. Use `number` in `format()`.",
]
success = "A binary clock with three modes. Ask a friend to read the time from it!"
demo = '''
from gpiozero import LEDBoard, Button
from datetime import datetime
from time import sleep

lights = LEDBoard(17, 27, 22, 5, 6, 13)
button = Button(23)
mode = "seconds"

def next_mode():
    global mode
    if mode == "seconds":
        mode = "minutes"
    elif mode == "minutes":
        mode = "hours"
    else:
        mode = "seconds"
    print("Showing", mode)

button.when_pressed = next_mode

while True:
    now = datetime.now()
    number = now.second
    if mode == "minutes":
        number = now.minute
    elif mode == "hours":
        number = now.hour
    bits = format(number, "06b")
    lights.value = tuple(int(b) for b in bits)
    sleep(0.2)
'''
demo_events = ["2 tap 23", "4 tap 23", "6 tap 23"]
demo_seconds = 7.5

