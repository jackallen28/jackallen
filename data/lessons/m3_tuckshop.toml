**Goal:** at the end of your program, read `sales.csv` back and print how many sales there were **today** and the day's **takings** (all the money made today), like this:

```
Sales today: 3
Today's takings: $21.40
```

Tips:
- `open("sales.csv")` opens a file for reading. `for line in f:` goes through it one line at a time.
- `line.strip().split(",")` turns `"2026-10-18,12:30,2,7.00"` into a list: `["2026-10-18", "12:30", "2", "7.00"]`.
- The total is text, so turn it into a number with `float()` before you add it up.
- Only count a line if its date matches `today`.

If an old line in `sales.csv` gives you an error, you can delete the file and start a fresh log.
"""
hints = [
  "Start with `takings = 0` and `sales = 0` before you open the file. Inside the loop, split each line into its parts.",
