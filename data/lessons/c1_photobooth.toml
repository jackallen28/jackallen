title = "A new name every time"
support = "scaffolded"
starter_mode = "keep"
run_mode = "until_stopped"
text = """
Right now every photo is called `countdown.jpg`, so each new one **replaces** the last. Let's give every photo its own name using the **date and time**, and keep the booth running.

```
from datetime import datetime

name = datetime.now().strftime("photo_%Y-%m-%d_%H-%M-%S.jpg")
```

That makes names like `photo_2026-10-16_09-41-07.jpg`. (`%Y` is the year, `%H` the hour, `%M` minutes, `%S` seconds.)

**Your task:**
1. Put the countdown, beep and photo in a function: `def countdown_photo():`
2. Use the date-and-time name instead of `countdown.jpg`, and print it
3. At the bottom, loop forever:

```
while True:
    print("Press the button for a photo")
    button.wait_for_press()
    countdown_photo()
```

Take two photos, check they both appear, then press **Stop**.
"""
hints = [
  "Add `from datetime import datetime` at the top.",
  "Inside your function, make the name just before the photo: `name = datetime.now().strftime(\"photo_%Y-%m-%d_%H-%M-%S.jpg\")`, then `cam.take_photo(name)`.",
  "Example:\n```\ndef countdown_photo():\n    count = 3\n    for light in lights:\n        print(count)\n        light.on()\n        sleep(1)\n        light.off()\n        count = count - 1\n    buzzer.beep(0.1, 0.1, n=2, background=False)\n    name = datetime.now().strftime(\"photo_%Y-%m-%d_%H-%M-%S.jpg\")\n    cam.take_photo(name)\n    print(\"Saved\", name)\n```",
]
error_hints = { NameError = "Did you add `from datetime import datetime` at the top?" }
success = "Every photo gets its own name. Nothing gets overwritten!"
demo = '''
from gpiozero import LED, Button, Buzzer
from pipath_camera import Camera
from time import sleep
from datetime import datetime

cam = Camera()
button = Button(23)
buzzer = Buzzer(18)
lights = [LED(17), LED(27), LED(22)]

def countdown_photo():
    count = 3
    for light in lights:
        print(count)
        light.on()
        sleep(1)
        light.off()
        count = count - 1
    buzzer.beep(0.1, 0.1, n=2, background=False)
    name = datetime.now().strftime("photo_%Y-%m-%d_%H-%M-%S.jpg")
    cam.take_photo(name)
    print("Saved", name)

while True:
    print("Press the button for a photo")
    button.wait_for_press()
    countdown_photo()
'''
