# ------------------------------------------------------------------ STEP 5
[[steps]]
title = "Beep faster as you get closer"
support = "scaffolded"
starter_mode = "replace"
run_mode = "until_stopped"
starter = '''
from gpiozero import DistanceSensor, Buzzer
from time import sleep

sensor = DistanceSensor(echo=26, trigger=4)
buzzer = Buzzer(18)

while True:
    cm = sensor.distance * 100
    print(round(cm), "cm")
    if cm < ___:
        buzzer.on()           # very close: one long tone
        sleep(0.1)
    else:
        buzzer.on()           # a short beep...
        sleep(0.05)
        buzzer.off()
        sleep(cm / ___)       # ...then a gap: further away = longer gap
'''
text = """
Join the sensor and the buzzer. The closer you get, the **shorter the gap** between beeps.

You might think: just call `buzzer.beep()` every time round the loop. But `beep()` runs in the **background** with its own timer. Calling it again restarts it before it has finished, so the beeps get muddled.

So this time **your code** makes each beep, with `sleep()`:
- `buzzer.on()`, a short `sleep(0.05)`, then `buzzer.off()`: one short beep
- then a quiet gap of `sleep(cm / 100)`. At 100 cm that's 1 second. At 20 cm it's only 0.2 seconds!
- closer than **10 cm**, the buzzer just stays on: one long tone means **stop!**

**Your task:** fill in the two blanks: a long tone when the distance is **less than 10**, and a gap of **cm divided by 100**. Run it and move slowly closer. Get closer than 10 cm, then press **Stop**.
"""
hints = [
  "The first blank is where the long tone starts. The second turns centimetres into seconds.",
  "Long tone under 10 cm: `if cm < 10:`. The gap: `sleep(cm / 100)`.",
  "The lines are `if cm < 10:` and `sleep(cm / 100)`",
]
error_hints = { ZeroDivisionError = "Did you divide by 0? The gap should be `cm / 100`." }
success = "Beep... beep... beep-beep-beep! It sounds just like a real car."
demo = '''
