[[steps]]
title = "Challenge: shuffle the questions"
support = "brief"
starter_mode = "keep"
text = """
**Goal:** ask the questions in a **different order** every time the quiz is played, and still mark every answer correctly.

`random.shuffle(my_list)` mixes up a list, like shuffling cards. You'll need `import random` at the top.

**Watch out:** if you shuffle `questions` and `answers` on their own, the answers won't match their questions any more! Find a way to keep each question **with** its answer while you shuffle.

Play your quiz at least twice to check the order changes.
"""
hints = [
  "Join each question and its answer into a **pair** first, then shuffle the pairs. `zip()` makes pairs.",
  "`quiz = list(zip(questions, answers))` makes one list of pairs. Shuffle `quiz`, then loop with `for q, a in quiz:`.",
  "Example:\n```\nimport random\n...\nquiz = list(zip(questions, answers))\nrandom.shuffle(quiz)\nfor q, a in quiz:\n    if ask(q, a):\n        score += 1\n```",
]
success = "A shuffled quiz, with every answer still in the right place. You're a true Quiz Master!"
demo = '''
# Quiz Master
import random

questions = [
    "What is the capital of Australia? ",
    "Which Aussie animal lays eggs: platypus or wombat? ",
    "How many points is a goal worth in AFL? ",
    "Which planet is closest to the Sun? ",
    "Which bird is on the coat of arms with the kangaroo? ",
]
answers = ["Canberra", "platypus", "6", "Mercury", "emu"]


def ask(question, answer):
    reply = input(question)
    if reply.strip().lower() == answer.strip().lower():
        print("Correct!")
        return True
    else:
        print(f"Not quite. The answer is {answer}.")
        return False


quiz = list(zip(questions, answers))
random.shuffle(quiz)

score = 0

for q, a in quiz:
    if ask(q, a):
        score += 1

print(f"Score: {score} out of {len(quiz)}")

percent = score / len(quiz) * 100
print(f"You got {percent:.0f}%")
if percent >= 80:
    print("Quiz Master!")
elif percent >= 50:
    print("Not bad at all!")
else:
    print("Have another go!")
'''
demo_input = "Canberra\nplatypus\n6\nMercury\nemu\n"

