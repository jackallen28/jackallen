# CAMERA & AI 2: Teachable Machine. A nearest-neighbour image classifier the students write themselves.
# No AI library and no internet: tiny greyscale grids from pipath_camera + a distance function.
# demo_files: sample training data (data/demo_files/c2/examples.json, made with the Simulator's
# Ball and Box), copied next to the demo so "Watch the goal" works before students collect their own.
# Pin plan: green LED 22 (first thing), red LED 17 (second thing), button 23.
# Step by step: pictures as numbers -> collect examples -> distance -> a guess on its own ->
# button + lights join in -> challenge.

id = "c2_teachable"
title = "Teachable Machine"
file_name = "teachable_machine.py"
requires_gpio = true
requires_camera = true

intro = """
## Teach your Pi to see

How does a phone recognise a face, or a self-driving car spot a stop sign? They **learn from examples**. That's called **machine learning**.

In this activity you'll build a tiny version yourself, with no AI library and no internet:
- see how a computer stores a picture: **as numbers**
- collect **training examples** of two things
- write a **distance** function that measures how different two pictures are
- make the Pi **guess** what it's looking at
- add a button and lights, so the matching LED lights up
- **test** how accurate it is, and find out why it gets things wrong

**Pick two things** the camera can tell apart: a ball and a box, a red cup and a book, thumbs up and thumbs down. In the **Simulator**, use **Ball** and **Box** on the board.
"""

outro = """
## You built a machine that learns!

Your Pi learned from examples and made predictions. That idea is called a **nearest neighbour** classifier. Some real systems still use it, and bigger AI systems are built on the same idea: **turn pictures into numbers, then compare them**.

**Think about it:**
- Your machine only knows what you showed it. If every training photo was taken in a bright room, it may get confused in the dark.
- Real AI can be unfair in the same way. When the training examples leave some people out, the AI works badly for them. This is called **bias**, and checking training data for it is a real job.

**Extension ideas:**
- Add a **third** thing and a third LED
- Use **k nearest neighbours**: let the 3 closest examples vote
- Save a "confidence" score: how much closer was the best match than the next best?
"""

