[[steps]]
title = "Arm and disarm"
support = "scaffolded"
starter_mode = "keep"
run_mode = "until_stopped"
text = """
An alarm that goes off every time *you* walk past isn't much use. Real alarms can be **armed** (on guard) or **disarmed** (off). The last part joins in: the **button**.

A **state** variable remembers which one it is: `armed = False` at the start. `armed = not armed` flips True to False and False to True.

```
def toggle_armed():
    global armed          # this function changes armed
    armed = not armed
    if armed:
        light.on()
        print("Armed")
    else:
        light.off()
        print("Disarmed")
```

**Your task:**
1. Add a button on GPIO23 (import `Button` too), and `armed = False` near the top
2. Add the `toggle_armed()` function, and connect it: `button.when_pressed = toggle_armed`
3. The LED now shows the state (on = armed), so take `light.on()` out of `close()`
4. In `close()`, only beep `if armed:`. You won't need `clear()` any more: delete it **and** the `sensor.when_out_of_range = clear` line.

Test it: come close while it's disarmed, then arm it and come close again.
"""
hints = [
  "Near the top: `button = Button(23)` and `armed = False`. Copy `toggle_armed()` from the instructions.",
  "In `close()`, put the beep inside `if armed:` (indented under it).",
  "At the bottom, next to `sensor.when_in_range = close`: `button.when_pressed = toggle_armed`.",
]
success = "Your alarm has a memory: its state. Lots of programs work like this."
demo = '''
from gpiozero import DistanceSensor, LED, Buzzer, Button
from signal import pause

sensor = DistanceSensor(echo=26, trigger=4, threshold_distance=0.3)
light = LED(17)          # on = armed
buzzer = Buzzer(18)
button = Button(23)
armed = False

def toggle_armed():
    global armed
    armed = not armed
    if armed:
        light.on()
        print("Armed")
    else:
        light.off()
        print("Disarmed")

def close():
    if armed:
        print("Intruder alert!")
        buzzer.beep(0.1, 0.1, n=5)
    else:
        print("Something's close, but the alarm is off")

button.when_pressed = toggle_armed
sensor.when_in_range = close
print("Press the button to arm the alarm")
pause()
'''
