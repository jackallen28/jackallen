id = "e3_simon"
title = "Simon Says"
file_name = "simon_says.py"
requires_gpio = true

intro = """
## Build a memory game

The lights flash a pattern. You repeat it on the buttons. Each round the pattern gets **one step longer**. How far can you get?

This is the biggest program so far. You will:
- store LEDs and buttons in **lists** so one loop controls them all
- pair them up with `zip()`
- write **functions** that `return` an answer
- build a full **game loop** with a score and a game-over

Wire all three LED + button pairs before you start (see the **Wiring** card).
"""

outro = """
## You built Simon Says!

That's a real game with lists, functions, return values, a game loop and hardware. Seriously impressive.

**Extension ideas:**
- Speed up the flashes as the score grows
- Add a buzzer with a different note for each colour (`from gpiozero import TonalBuzzer`)
- Save the high score to a file so it survives restarting the game
"""

[[wiring]]
part = "Red LED + button"
connect = "LED: GPIO17 (pin 11) → 330Ω → long leg, short leg → GND. Button: GPIO23 (pin 16) and GND."

[[wiring]]
part = "Green LED + button"
connect = "LED: GPIO27 (pin 13) → 330Ω → long leg, short leg → GND. Button: GPIO24 (pin 18) and GND."

[[wiring]]
part = "Blue LED + button"
connect = "LED: GPIO22 (pin 15) → 330Ω → long leg, short leg → GND. Button: GPIO25 (pin 22) and GND."

[[wiring]]
part = "Tip"
connect = "Put each button directly under its LED so players know which is which. Use the breadboard's blue (−) rail for all the GNDs."

# ------------------------------------------------------------------ STEP 1
[[steps]]
title = "Lists of lights"
support = "scaffolded"
starter_mode = "replace"
starter = '''
from gpiozero import LED
from time import sleep

leds = [LED(17), LED(27), LED(22)]   # red, green, blue

for led in leds:
    led.on()
    sleep(0.5)
    led.off()
'''
text = """
Instead of three separate variables, all the LEDs live in **one list**. Now a single `for` loop can control them all, and adding a fourth LED later is just one more item in the list.

`leds[0]` is red, `leds[1]` is green, `leds[2]` is blue.

**Your task:** run it. Then make the lights run **forwards then backwards** (red, green, blue, green, red).
"""
hints = [
  "You can loop through a list backwards with `reversed(leds)`.",
  "Add a second loop: `for led in reversed(leds):`",
]
success = "One loop, any number of LEDs. That's the power of lists."

