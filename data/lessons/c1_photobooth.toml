# CAMERA & AI 1: Photo Booth. See e1_lightswitch.toml for the GPIO lesson keys.
#   requires_camera = true  -> Camera button (Simulated / USB / Ribbon) + camera panel on the board
# Students use PiPath's camera helper (pipath/student_lib/pipath_camera.py), so the same code
# works with a USB webcam, a ribbon camera, or the Simulator.
# Pin plan: LEDs 17 (red) 27 (amber) 22 (green), button 23, buzzer 18.
# Step by step: the camera -> camera + button -> the countdown lights on their own ->
# all together -> date-and-time names -> challenge.

id = "c1_photobooth"
title = "Photo Booth"
file_name = "photo_booth.py"
requires_gpio = true
requires_camera = true

intro = """
## Build a photo booth

Press a button, watch the lights count down **3, 2, 1**, hear a beep, and *snap!* Your Pi takes a photo.

You'll build it one part at a time:
- take photos with code
- start the camera with a **button**
- make a **countdown** with a list of LEDs and a loop, then join it all up
- give every photo its own name with the **date and time**
- shoot a 4-photo **photo strip**

**Choose your camera** by clicking the title of the **camera panel** on the board (bottom right):
- **USB**: a USB webcam plugged into the Pi
- **Ribbon**: a Raspberry Pi camera on the ribbon cable
- **Simulated**: no camera? The board makes pretend photos

Your photos are saved in your PiPath folder, next to your code.
"""

outro = """
## Say cheese!

You used a camera, a button, a list of LEDs, a loop, a function and `datetime` to build a working photo booth.

**How does the camera code work?** `pipath_camera` is a small helper PiPath gives you. On a ribbon camera it uses the **Picamera2** library. Outside PiPath you can write:

```
from picamera2 import Picamera2
cam = Picamera2()
cam.start()
cam.capture_file("me.jpg")
```

**Extension ideas:**
- Add a "selfie timer" setting: hold the button for a 10-second countdown instead of 3
- Combine with the **Motion Alarm**: take a photo whenever the sensor sees movement
- Try **Teachable Machine** next, and teach the Pi to recognise what's in the photo!
"""

