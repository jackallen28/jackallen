# ELECTRONICS LAB 2. See e1_lightswitch.toml for the GPIO lesson keys.

id = "e2_moodlamp"
title = "RGB Mood Lamp"
file_name = "mood_lamp.py"
requires_gpio = true

intro = """
## One LED, millions of colours

An **RGB LED** has three tiny lights inside it: **R**ed, **G**reen and **B**lue. Mix them and you can make almost any colour. That's how every screen works!

In this project you will:
- mix colours using **tuples** like `(1, 0.5, 0)`
- cycle through a **list** of colours with a button
- use `%` (modulo) to loop back to the start of a list
- add a secret **party mode** when you hold the button down
"""

outro = """
## Your mood lamp is glowing!

You used `RGBLED`, colour tuples, lists, `%` to wrap around, and `when_held` for a long press.

**Extension ideas:**
- A "sunrise" mode that slowly fades from deep red to bright yellow over 30 seconds
- A second button that goes *backwards* through the colours
- Ask the user to type a colour name with `input()` and look it up in a dictionary
"""

[[wiring]]
part = "RGB LED (common cathode)"
kind = "rgbled"
pins = [17, 27, 22]
connect = "Longest leg → GND (pin 6). Red leg → 330Ω → GPIO17 (pin 11). Green leg → 330Ω → GPIO27 (pin 13). Blue leg → 330Ω → GPIO22 (pin 15)."

[[wiring]]
part = "Button"
kind = "button"
pin = 23
connect = "One leg → GPIO23 (pin 16). Opposite leg → GND (pin 14)."

[[wiring]]
part = "Tip"
connect = "If your LED is *common anode* (long leg to 3.3V), add `active_high=False` to RGBLED(...). Your teacher will know which kind you have."

# ------------------------------------------------------------------ STEP 1
[[steps]]
title = "Mix your first colours"
support = "scaffolded"
starter_mode = "replace"
starter = '''
from gpiozero import RGBLED
from time import sleep

lamp = RGBLED(red=17, green=27, blue=22)

lamp.color = (1, 0, 0)    # red
sleep(1)
lamp.color = (0, 1, 0)    # green
sleep(1)
lamp.color = (1, 1, 0)    # red + green = ?
sleep(2)
'''
text = """
A colour is written as a **tuple** of three numbers: `(red, green, blue)`. Each number goes from `0` (off) to `1` (full).

**Your task:** run it. What colour does red + green make?

Then add two more colours of your own: try **purple** (red + blue) and **white** (all three).
"""
hints = [
  "Purple is red and blue together: `(1, 0, 1)`",
  "White is everything on: `(1, 1, 1)`. Add each colour with its own `sleep()` so you can see it.",
]
success = "Red + green = yellow. Light mixes differently to paint!"

demo = '''
from gpiozero import RGBLED
from time import sleep

lamp = RGBLED(red=17, green=27, blue=22)

lamp.color = (1, 0, 0)    # red
sleep(1)
lamp.color = (0, 1, 0)    # green
sleep(1)
lamp.color = (1, 1, 0)    # red + green = yellow
sleep(1)
lamp.color = (1, 0, 1)    # purple
sleep(1)
lamp.color = (1, 1, 1)    # white
sleep(1)
'''

