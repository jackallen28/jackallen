# PiPath activity catalogue
# Every activity shown on the home screen is listed here, in order.
# Students can open ANY ready activity at any time. Tiers are a guide (colour + filter),
# not a lock.
#
# status = "ready"   -> a lesson file exists in data/lessons/<id>.toml and can be played
# status = "planned" -> shown as "Coming soon"
# try_first = [ids]  -> optional tip on the card: "Good to try first: ..." (hidden once those are done)
# gpio = true        -> card says "needs GPIO kit"; camera = true -> "needs camera"
#
# support describes the gradual release of responsibility across the lesson:
#   guided     - starter code with blanks, hints available straight away
#   scaffolded - step-by-step instructions, hints unlock after one try
#   brief      - just the goal and the checks, hints unlock after two tries

[[tier]]
id = "simple"
title = "Simple"
tagline = "Python on the screen"
description = "Print, variables, input, decisions and loops."

[[tier]]
id = "moderate"
title = "Moderate"
tagline = "Bigger programs"
description = "Lists, dictionaries, functions, files and graphics."

[[tier]]
id = "advanced"
title = "Advanced"
tagline = "Electronics with GPIO"
description = "Control LEDs, buttons, buzzers and sensors with gpiozero."

[[tier]]
id = "lab"
title = "Electronics Lab"
tagline = "Extra hardware projects"
description = "More lights and inputs. Do them in any order."

# ---------------------------------------------------------------- SIMPLE
[[project]]
id = "s1_hello"
